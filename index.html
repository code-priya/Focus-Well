<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>StudyBuddy AI | Your Happy Study Companion</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.15.0/dist/tf.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #FF6B9D;
            --primary-dark: #FF5277;
            --secondary: #6C63FF;
            --accent: #FFD166;
            --success: #06D6A0;
            --warning: #FF9F1C;
            --danger: #EF476F;
            --dark: #2D3047;
            --light: #F9F9FF;
            --white: #FFFFFF;
            --shadow: 0 10px 30px rgba(0,0,0,0.08);
            --shadow-lg: 0 20px 40px rgba(0,0,0,0.12);
            --radius: 20px;
            --radius-sm: 12px;
        }

        body {
            font-family: 'Nunito', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Cute Animations */
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-15px); }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .floating {
            animation: float 3s ease-in-out infinite;
        }

        /* Glass Card */
        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            transition: all 0.3s ease;
            border: 1px solid rgba(255,255,255,0.3);
        }

        .glass-card:hover {
            transform: translateY(-5px);
            box-shadow: var(--shadow-lg);
        }

        /* Navigation */
        .nav-bar {
            background: white;
            border-radius: 50px;
            padding: 12px 24px;
            margin: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: var(--shadow);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 24px;
            font-weight: 800;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .nav-links {
            display: flex;
            gap: 20px;
        }

        .nav-link {
            cursor: pointer;
            padding: 8px 16px;
            border-radius: 30px;
            transition: all 0.3s;
            font-weight: 600;
        }

        .nav-link:hover, .nav-link.active {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
        }

        /* Main Container */
        .main-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        /* Grid Layouts */
        .grid-2 {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 24px;
        }

        .grid-3 {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 24px;
        }

        .grid-4 {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
        }

        /* Stress Meter */
        .stress-meter {
            background: linear-gradient(135deg, #FFE8E8, #FFE0F0);
            border-radius: var(--radius);
            padding: 20px;
            text-align: center;
        }

        .stress-level {
            width: 150px;
            height: 150px;
            margin: 0 auto;
        }

        /* Chatbot */
        .chatbot-container {
            position: fixed;
            bottom: 30px;
            right: 30px;
            z-index: 1000;
        }

        .chatbot-toggle {
            width: 70px;
            height: 70px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: var(--shadow-lg);
            transition: all 0.3s;
            animation: pulse 2s infinite;
        }

        .chatbot-toggle:hover {
            transform: scale(1.1);
        }

        .chatbot-window {
            position: absolute;
            bottom: 80px;
            right: 0;
            width: 380px;
            height: 500px;
            background: white;
            border-radius: 20px;
            box-shadow: var(--shadow-lg);
            display: none;
            flex-direction: column;
            overflow: hidden;
        }

        .chatbot-window.open {
            display: flex;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }

        .message {
            margin-bottom: 15px;
            display: flex;
        }

        .message.bot {
            justify-content: flex-start;
        }

        .message.user {
            justify-content: flex-end;
        }

        .message-bubble {
            max-width: 80%;
            padding: 10px 15px;
            border-radius: 20px;
            font-size: 14px;
        }

        .message.bot .message-bubble {
            background: #F0F0FF;
            color: var(--dark);
        }

        .message.user .message-bubble {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
        }

        /* Flashcard */
        .flashcard {
            background: white;
            border-radius: var(--radius);
            padding: 30px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            min-height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: var(--shadow);
        }

        .flashcard:hover {
            transform: translateY(-5px);
            box-shadow: var(--shadow-lg);
        }

        /* Upload Area */
        .upload-area {
            border: 2px dashed var(--primary);
            border-radius: var(--radius);
            padding: 40px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            background: rgba(255,107,157,0.05);
        }

        .upload-area:hover {
            background: rgba(255,107,157,0.1);
            border-color: var(--secondary);
        }

        /* Buttons */
        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border: none;
            padding: 12px 28px;
            border-radius: 40px;
            color: white;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 14px;
        }

        .btn-primary:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 20px rgba(108,99,255,0.3);
        }

        /* Study Guide */
        .study-guide-section {
            background: white;
            border-radius: var(--radius);
            padding: 20px;
            margin-bottom: 20px;
        }

        /* Transcription */
        .transcript-item {
            background: #F9F9FF;
            border-radius: var(--radius-sm);
            padding: 15px;
            margin-bottom: 10px;
            cursor: pointer;
        }

        /* Responsive */
        @media (max-width: 1000px) {
            .grid-4 { grid-template-columns: repeat(2, 1fr); }
            .grid-3 { grid-template-columns: repeat(2, 1fr); }
        }

        @media (max-width: 768px) {
            .grid-2, .grid-3, .grid-4 { grid-template-columns: 1fr; }
            .nav-links { display: none; }
            .chatbot-window { width: 300px; right: -20px; }
        }

        /* Cute Elements */
        .cute-icon {
            font-size: 48px;
            margin-bottom: 16px;
        }

        .welcome-banner {
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-radius: var(--radius);
            padding: 40px;
            color: white;
            margin-bottom: 30px;
            position: relative;
            overflow: hidden;
        }

        .welcome-banner::before {
            content: "🌟";
            position: absolute;
            font-size: 100px;
            right: 20px;
            bottom: 20px;
            opacity: 0.2;
        }

        /* Stress Indicator */
        .stress-indicator {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 8px;
        }

        .stress-low { background: var(--success); }
        .stress-medium { background: var(--warning); }
        .stress-high { background: var(--danger); }
    </style>
</head>
<body>
    <div id="app"></div>

    <script>
        // ============ ADVANCED STRESS ANALYSIS ALGORITHM ============
        class StressAnalyzer {
            constructor() {
                this.weights = {
                    sleepQuality: 0.25,
                    anxietyLevel: 0.30,
                    physicalSymptoms: 0.20,
                    workload: 0.15,
                    socialSupport: 0.10
                };
            }

            calculateStressLevel(userData) {
                const factors = {
                    sleepQuality: userData.sleepQuality || 7,
                    anxietyLevel: userData.anxietyLevel || 3,
                    physicalSymptoms: userData.physicalSymptoms || 2,
                    workload: userData.workload || 3,
                    socialSupport: userData.socialSupport || 4
                };

                let stressScore = 0;
                for (const [factor, value] of Object.entries(factors)) {
                    const normalizedValue = value / 10;
                    stressScore += normalizedValue * this.weights[factor];
                }

                stressScore = Math.min(1, Math.max(0, stressScore)) * 100;
                
                let level = 'low';
                let color = '#06D6A0';
                let emoji = '😊';
                let advice = '';
                
                if (stressScore < 30) {
                    level = 'low';
                    color = '#06D6A0';
                    emoji = '😊✨';
                    advice = "You're doing great! Keep maintaining your healthy habits! 🌟";
                } else if (stressScore < 60) {
                    level = 'medium';
                    color = '#FF9F1C';
                    emoji = '😌🌿';
                    advice = "Take some deep breaths. A short break or a walk might help! 🚶‍♀️";
                } else {
                    level = 'high';
                    color = '#EF476F';
                    emoji = '😰💙';
                    advice = "You need some rest! Try our relaxation exercises or talk to someone. You're not alone! 🤗";
                }
                
                return { score: Math.round(stressScore), level, color, emoji, advice };
            }

            generateStressReductionTips(stressLevel) {
                const tips = {
                    low: [
                        "🎯 Keep up your great routine!",
                        "📚 Challenge yourself with new topics",
                        "💪 Maintain your healthy habits"
                    ],
                    medium: [
                        "🧘 Try 5 minutes of deep breathing",
                        "🚶 Take a 10-minute walk outside",
                        "🎵 Listen to calming music",
                        "📝 Journal your thoughts"
                    ],
                    high: [
                        "🛑 Take an immediate break from studying",
                        "💆 Try progressive muscle relaxation",
                        "🗣️ Talk to a friend or counselor",
                        "😴 Prioritize sleep tonight",
                        "🍵 Make yourself a warm tea"
                    ]
                };
                return tips[stressLevel] || tips.medium;
            }
        }

        // ============ AI STUDY GUIDE GENERATOR ============
        class StudyGuideGenerator {
            generateGuide(topic, complexity = 'medium') {
                const guides = {
                    'math': {
                        title: 'Mastering Mathematics 📐',
                        segments: [
                            '1. Understanding Basic Concepts',
                            '2. Practice Problems & Solutions',
                            '3. Common Mistakes to Avoid',
                            '4. Advanced Applications',
                            '5. Quiz Yourself!'
                        ],
                        tips: 'Practice daily for 30 minutes!'
                    },
                    'science': {
                        title: 'Science Explorer 🔬',
                        segments: [
                            '1. Key Scientific Principles',
                            '2. Experiments & Observations',
                            '3. Real-world Applications',
                            '4. Review Questions',
                            '5. Lab Safety Tips'
                        ],
                        tips: 'Connect concepts to real life!'
                    },
                    'programming': {
                        title: 'Coding Adventure 💻',
                        segments: [
                            '1. Syntax Fundamentals',
                            '2. Practice Exercises',
                            '3. Debugging Techniques',
                            '4. Project Ideas',
                            '5. Code Review Checklist'
                        ],
                        tips: 'Code every day, even for 15 minutes!'
                    }
                };
                
                const defaultGuide = {
                    title: `Study Guide: ${topic} 📚`,
                    segments: [
                        '1. Introduction & Overview',
                        '2. Key Concepts to Master',
                        '3. Practice Exercises',
                        '4. Common Challenges',
                        '5. Summary & Review'
                    ],
                    tips: 'Take breaks every 45 minutes for best focus!'
                };
                
                return guides[topic.toLowerCase()] || defaultGuide;
            }

            generateFlashcards(topic, count = 5) {
                const flashcards = [];
                for (let i = 1; i <= count; i++) {
                    flashcards.push({
                        id: i,
                        question: `${topic} - Question ${i}: What is a key concept you've learned?`,
                        answer: `This is the answer for ${topic} concept ${i}. Review your notes for specific details!`
                    });
                }
                return flashcards;
            }
        }

        // ============ LECTURE TRANSCRIPTION ============
        class LectureTranscriber {
            constructor() {
                this.transcripts = [];
                this.isRecording = false;
                this.recognition = null;
            }

            initSpeechRecognition() {
                if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
                    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                    this.recognition = new SpeechRecognition();
                    this.recognition.continuous = true;
                    this.recognition.interimResults = true;
                    this.recognition.lang = 'en-US';
                    return true;
                }
                return false;
            }

            startRecording(onResult, onEnd) {
                if (!this.recognition) {
                    if (!this.initSpeechRecognition()) {
                        alert("Speech recognition not supported. Please type your notes instead.");
                        return false;
                    }
                }
                
                this.isRecording = true;
                this.recognition.onresult = (event) => {
                    let transcript = '';
                    for (let i = event.resultIndex; i < event.results.length; i++) {
                        transcript += event.results[i][0].transcript;
                    }
                    if (onResult) onResult(transcript);
                };
                
                this.recognition.onend = () => {
                    this.isRecording = false;
                    if (onEnd) onEnd();
                };
                
                this.recognition.start();
                return true;
            }

            stopRecording() {
                if (this.recognition && this.isRecording) {
                    this.recognition.stop();
                    this.isRecording = false;
                }
            }

            generateSummary(transcript) {
                const sentences = transcript.split(/[.!?]+/).filter(s => s.trim().length > 20);
                const keyPoints = sentences.slice(0, 5).map(s => s.trim());
                return {
                    summary: keyPoints.join('. ') + '.',
                    keyPoints: keyPoints,
                    wordCount: transcript.split(' ').length,
                    readingTime: Math.ceil(transcript.split(' ').length / 200)
                };
            }
        }

        // ============ AI CHATBOT ============
        class StudyChatbot {
            getResponse(message, userData) {
                const msg = message.toLowerCase();
                const stressLevel = userData?.stressLevel || 30;
                
                if (msg.includes('stress') || msg.includes('anxious') || msg.includes('worried')) {
                    return "💙 I hear you! Stress is normal, but you're not alone. Try taking 5 deep breaths with me: Inhale... 1,2,3,4... Exhale... 1,2,3,4. Feel better? You've got this! 🌸";
                }
                if (msg.includes('study tip') || msg.includes('how to study')) {
                    return "📚 Here's a happy study tip: Try the Pomodoro method! Study for 25 minutes, then take a 5-minute dance break! 🎵 Makes learning so much more fun!";
                }
                if (msg.includes('motivation') || msg.includes('motivate')) {
                    return "🌟 You are capable of amazing things! Remember why you started. Every small step counts toward your big dreams. Keep going, superstar! ⭐";
                }
                if (msg.includes('break') || msg.includes('tired')) {
                    return "😴 Time for a cozy break! Stretch, grab some water, or look out the window for 2 minutes. Your brain needs rest to learn better! 💤";
                }
                if (msg.includes('exam') || msg.includes('test')) {
                    return "📝 Exam coming up? You've prepared well! Trust yourself, get good sleep, and eat a healthy breakfast. You'll do great! 🎯";
                }
                if (msg.includes('procrastinate') || msg.includes('delay')) {
                    return "⏰ Let's beat procrastination together! Start with just 5 minutes of work - that's all. Often, getting started is the hardest part! You can do it! 🚀";
                }
                
                return "🎓 Hi study buddy! I'm here to help with study tips, stress relief, motivation, or just to chat! What would you like to talk about today? 💫";
            }
        }

        // ============ STORAGE ============
        const Storage = {
            getUsers: () => JSON.parse(localStorage.getItem('studybuddy_users') || '[]'),
            saveUser: (user) => {
                const users = Storage.getUsers();
                users.push(user);
                localStorage.setItem('studybuddy_users', JSON.stringify(users));
            },
            getUser: (email) => Storage.getUsers().find(u => u.email === email),
            updateUser: (email, data) => {
                const users = Storage.getUsers();
                const idx = users.findIndex(u => u.email === email);
                if (idx !== -1) {
                    users[idx] = { ...users[idx], ...data };
                    localStorage.setItem('studybuddy_users', JSON.stringify(users));
                }
            },
            getCurrent: () => JSON.parse(localStorage.getItem('studybuddy_current')),
            setCurrent: (user) => localStorage.setItem('studybuddy_current', JSON.stringify(user)),
            clearCurrent: () => localStorage.removeItem('studybuddy_current'),
            
            getStudyGuides: () => JSON.parse(localStorage.getItem('studybuddy_guides') || '[]'),
            saveStudyGuide: (guide) => {
                const guides = Storage.getStudyGuides();
                guides.push(guide);
                localStorage.setItem('studybuddy_guides', JSON.stringify(guides.slice(-20)));
            },
            
            getFlashcards: () => JSON.parse(localStorage.getItem('studybuddy_flashcards') || '[]'),
            saveFlashcard: (card) => {
                const cards = Storage.getFlashcards();
                cards.push(card);
                localStorage.setItem('studybuddy_flashcards', JSON.stringify(cards));
            },
            
            getTranscripts: () => JSON.parse(localStorage.getItem('studybuddy_transcripts') || '[]'),
            saveTranscript: (transcript) => {
                const transcripts = Storage.getTranscripts();
                transcripts.unshift(transcript);
                localStorage.setItem('studybuddy_transcripts', JSON.stringify(transcripts.slice(0, 20)));
            }
        };

        // ============ INITIALIZE ============
        let currentUser = null;
        let currentScreen = 'dashboard';
        let stressAnalyzer = new StressAnalyzer();
        let studyGuideGen = new StudyGuideGenerator();
        let transcriber = new LectureTranscriber();
        let chatbot = new StudyChatbot();
        let currentFlashcardIndex = 0;
        let flashcards = [];

        function init() {
            const saved = Storage.getCurrent();
            if (saved) {
                currentUser = saved;
                renderDashboard();
            } else {
                renderLogin();
            }
        }

        function renderLogin() {
            document.getElementById('app').innerHTML = `
                <div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px;">
                    <div class="glass-card" style="max-width: 450px; width: 100%; padding: 40px; text-align: center;">
                        <div class="floating">
                            <div style="font-size: 70px;">🎓✨</div>
                        </div>
                        <h1 style="font-size: 32px; margin: 20px 0 10px;">StudyBuddy AI</h1>
                        <p style="color: #666;">Your Happy Study Companion</p>
                        
                        <form id="loginForm" style="margin-top: 30px;">
                            <input type="email" id="email" placeholder="Email" required style="width: 100%; padding: 14px; margin-bottom: 12px; border: 2px solid #E0E0E0; border-radius: 12px;">
                            <input type="password" id="password" placeholder="Password" required style="width: 100%; padding: 14px; margin-bottom: 20px; border: 2px solid #E0E0E0; border-radius: 12px;">
                            <button type="submit" class="btn-primary" style="width: 100%;">Login →</button>
                        </form>
                        
                        <p style="margin-top: 20px;">New here? <a href="#" onclick="renderRegister(); return false;" style="color: var(--primary);">Create Account 🎉</a></p>
                        <p style="margin-top: 15px; font-size: 12px; color: #999;">Demo: student@studybuddy.com / 123</p>
                    </div>
                </div>
            `;
            
            document.getElementById('loginForm').addEventListener('submit', (e) => {
                e.preventDefault();
                const email = document.getElementById('email').value;
                const pwd = document.getElementById('password').value;
                const user = Storage.getUser(email);
                if (user && user.password === pwd) {
                    currentUser = user;
                    Storage.setCurrent(user);
                    renderDashboard();
                } else {
                    alert('Invalid credentials. Try student@studybuddy.com / 123');
                }
            });
        }

        function renderRegister() {
            document.getElementById('app').innerHTML = `
                <div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px;">
                    <div class="glass-card" style="max-width: 450px; width: 100%; padding: 40px;">
                        <h2 style="text-align: center; margin-bottom: 20px;">Create Account 🌟</h2>
                        <form id="registerForm">
                            <input type="text" id="name" placeholder="Full Name" required style="width: 100%; padding: 12px; margin-bottom: 12px; border: 2px solid #E0E0E0; border-radius: 12px;">
                            <input type="email" id="email" placeholder="Email" required style="width: 100%; padding: 12px; margin-bottom: 12px; border: 2px solid #E0E0E0; border-radius: 12px;">
                            <input type="password" id="password" placeholder="Password" required style="width: 100%; padding: 12px; margin-bottom: 20px; border: 2px solid #E0E0E0; border-radius: 12px;">
                            <button type="submit" class="btn-primary" style="width: 100%;">Sign Up 🎉</button>
                        </form>
                        <p style="text-align: center; margin-top: 20px;"><a href="#" onclick="renderLogin(); return false;">Back to Login</a></p>
                    </div>
                </div>
            `;
            
            document.getElementById('registerForm').addEventListener('submit', (e) => {
                e.preventDefault();
                const name = document.getElementById('name').value;
                const email = document.getElementById('email').value;
                const password = document.getElementById('password').value;
                
                if (Storage.getUser(email)) {
                    alert('User exists! Login instead.');
                    return;
                }
                
                const newUser = {
                    name, email, password,
                    sleepQuality: 7,
                    anxietyLevel: 3,
                    physicalSymptoms: 2,
                    workload: 3,
                    socialSupport: 4,
                    studyStreak: 0,
                    points: 0,
                    createdAt: new Date().toISOString()
                };
                Storage.saveUser(newUser);
                currentUser = newUser;
                Storage.setCurrent(newUser);
                renderDashboard();
            });
        }

        function renderDashboard() {
            const stressData = stressAnalyzer.calculateStressLevel(currentUser);
            const stressTips = stressAnalyzer.generateStressReductionTips(stressData.level);
            const transcripts = Storage.getTranscripts();
            const guides = Storage.getStudyGuides();
            const flashcardsList = Storage.getFlashcards();
            
            document.getElementById('app').innerHTML = `
                <div class="nav-bar">
                    <div class="logo">
                        <span>🎓✨</span>
                        <span>StudyBuddy AI</span>
                    </div>
                    <div class="nav-links">
                        <div class="nav-link ${currentScreen === 'dashboard' ? 'active' : ''}" onclick="renderDashboard()">🏠 Home</div>
                        <div class="nav-link" onclick="renderStudyTools()">📚 Study Tools</div>
                        <div class="nav-link" onclick="renderFlashcards()">🃏 Flashcards</div>
                        <div class="nav-link" onclick="renderLectureTools()">🎙️ Lectures</div>

        }

        function playCalmMusic() {
            alert("🎵 Calm Music Recommendation 🎵\n\nTry these for relaxation:\n• Lo-fi study beats\n• Nature sounds (rain, ocean)\n• Classical piano\n• Meditation music");
        }

        function openChatbot() {
            const window = document.getElementById('chatbotWindow');
            if (window) window.classList.add('open');
        }

        function toggleChatbot() {
            const window = document.getElementById('chatbotWindow');
            if (window) window.classList.toggle('open');
        }

        function sendChatMessage() {
            const input = document.getElementById('chatInput');
            const message = input.value.trim();
            if (!message) return;
            
            const chatDiv = document.getElementById('chatMessages');
            chatDiv.innerHTML += `<div class="message user"><div class="message-bubble">${message}</div></div>`;
            input.value = '';
            
            setTimeout(() => {
                const response = chatbot.getResponse(message, currentUser);
                chatDiv.innerHTML += `<div class="message bot"><div class="message-bubble">${response}</div></div>`;
                chatDiv.scrollTop = chatDiv.scrollHeight;
            }, 500);
        }

        function logout() {
            Storage.clearCurrent();
            currentUser = null;
            renderLogin();
        }

        // Make functions global
        window.renderDashboard = renderDashboard;
        window.renderStudyTools = renderStudyTools;
        window.renderFlashcards = renderFlashcards;
        window.renderLectureTools = renderLectureTools;
        window.renderWellness = renderWellness;
        window.flipCurrentCard = flipCurrentCard;
        window.previousFlashcard = previousFlashcard;
        window.nextFlashcard = nextFlashcard;
        window.recordStudySession = recordStudySession;
        window.createFlashcardsFromGuide = createFlashcardsFromGuide;
        window.viewStudyGuide = viewStudyGuide;
        window.viewTranscript = viewTranscript;
        window.startBreathingExercise = startBreathingExercise;
        window.showPositiveAffirmation = showPositiveAffirmation;
        window.playCalmMusic = playCalmMusic;
        window.openChatbot = openChatbot;
        window.toggleChatbot = toggleChatbot;
        window.sendChatMessage = sendChatMessage;
        window.logout = logout;
        window.renderLogin = renderLogin;
        window.renderRegister = renderRegister;

        // Start app
        init();
    </script>
</body>
</html>
