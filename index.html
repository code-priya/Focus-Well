<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FocusWell AI - Smart Study Assistant with ML</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.15.0/dist/tf.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --secondary-gradient: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            --glass-bg: rgba(255, 255, 255, 0.95);
            --shadow-sm: 0 2px 10px rgba(0,0,0,0.05);
            --shadow-lg: 0 20px 40px rgba(0,0,0,0.1);
            --border-radius: 20px;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Auth Container */
        .auth-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .auth-card {
            background: white;
            border-radius: var(--border-radius);
            padding: 40px;
            width: 100%;
            max-width: 400px;
            box-shadow: var(--shadow-lg);
            animation: fadeInUp 0.5s ease;
        }

        .auth-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo-icon {
            width: 60px;
            height: 60px;
            background: var(--primary-gradient);
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 30px;
            font-weight: bold;
            margin: 0 auto 20px;
        }

        /* Dashboard Layout */
        .dashboard-container {
            display: flex;
            min-height: 100vh;
        }

        /* Sidebar */
        .sidebar {
            width: 280px;
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(10px);
            box-shadow: 2px 0 20px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            position: fixed;
            height: 100vh;
            z-index: 100;
        }

        .sidebar-header {
            padding: 30px;
            border-bottom: 1px solid rgba(0,0,0,0.05);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-text {
            font-size: 22px;
            font-weight: 700;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .sidebar-nav {
            flex: 1;
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .nav-link {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 12px 20px;
            border-radius: 12px;
            color: #666;
            text-decoration: none;
            transition: all 0.3s ease;
            font-weight: 500;
            cursor: pointer;
        }

        .nav-link:hover {
            background: rgba(102, 126, 234, 0.1);
            color: #667eea;
            transform: translateX(5px);
        }

        .nav-link.active {
            background: var(--primary-gradient);
            color: white;
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
        }

        .sidebar-footer {
            padding: 20px;
            border-top: 1px solid rgba(0,0,0,0.05);
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 15px;
        }

        .user-avatar {
            width: 45px;
            height: 45px;
            background: var(--primary-gradient);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
        }

        .logout-btn {
            width: 100%;
            padding: 10px;
            background: rgba(220, 53, 69, 0.1);
            border: none;
            border-radius: 10px;
            color: #dc3545;
            cursor: pointer;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        /* Main Content */
        .main-content {
            flex: 1;
            margin-left: 280px;
            padding: 30px;
            overflow-y: auto;
        }

        .screen {
            display: none;
            animation: fadeInUp 0.5s ease;
        }

        .screen.active {
            display: block;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .screen-header {
            margin-bottom: 30px;
        }

        .screen-header h1 {
            font-size: 32px;
            color: white;
            margin-bottom: 10px;
        }

        .screen-header p {
            color: rgba(255,255,255,0.9);
        }

        /* Stats Grid */
        .ai-stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: var(--glass-bg);
            padding: 20px;
            border-radius: var(--border-radius);
            display: flex;
            align-items: center;
            gap: 15px;
            transition: all 0.3s;
        }

        .stat-card i {
            font-size: 40px;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .stat-info h3 {
            font-size: 28px;
            color: #333;
        }

        .ai-card {
            background: var(--primary-gradient);
            border-radius: var(--border-radius);
            padding: 25px;
            margin-bottom: 30px;
            color: white;
            box-shadow: var(--shadow-lg);
        }

        .card {
            background: var(--glass-bg);
            border-radius: var(--border-radius);
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: var(--shadow-sm);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid rgba(0,0,0,0.05);
        }

        .grid-2 {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        .tasks-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .task-item {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 15px;
            background: rgba(102, 126, 234, 0.05);
            border-radius: 12px;
        }

        .mood-buttons {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .mood-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            padding: 15px;
            background: rgba(102, 126, 234, 0.05);
            border: 2px solid transparent;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .mood-btn i {
            font-size: 30px;
        }

        .mood-btn.selected {
            background: var(--primary-gradient);
            color: white;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 14px;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: var(--primary-gradient);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        @media (max-width: 768px) {
            .sidebar {
                transform: translateX(-100%);
            }
            .main-content {
                margin-left: 0;
            }
            .grid-2 {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div id="app"></div>

    <script>
        // ============ LOCAL STORAGE MANAGEMENT ============
        const Storage = {
            getUsers: () => JSON.parse(localStorage.getItem('focuswell_users') || '[]'),
            saveUser: (user) => {
                const users = Storage.getUsers();
                users.push(user);
                localStorage.setItem('focuswell_users', JSON.stringify(users));
            },
            getUser: (email) => Storage.getUsers().find(u => u.email === email),
            updateUser: (email, data) => {
                const users = Storage.getUsers();
                const index = users.findIndex(u => u.email === email);
                if (index !== -1) {
                    users[index] = { ...users[index], ...data };
                    localStorage.setItem('focuswell_users', JSON.stringify(users));
                }
            },
            getCurrentUser: () => JSON.parse(localStorage.getItem('focuswell_current_user')),
            setCurrentUser: (user) => localStorage.setItem('focuswell_current_user', JSON.stringify(user)),
            clearCurrentUser: () => localStorage.removeItem('focuswell_current_user')
        };

        // ============ AI/ML MODEL ============
        class AIModel {
            static async predictOptimalStudyTime(userData) {
                // Simple neural network simulation
                const tasks = userData.tasks || [];
                const completedTasks = tasks.filter(t => t.completed).length;
                const productivityScore = tasks.length ? (completedTasks / tasks.length) * 100 : 70;
                
                let recommendedHours = 2;
                if (productivityScore > 80) recommendedHours = 3;
                else if (productivityScore > 60) recommendedHours = 2.5;
                else if (productivityScore < 50) recommendedHours = 1.5;
                
                const bestTimeOfDay = this.analyzeBestTime(userData);
                
                return {
                    recommendedHours,
                    confidence: productivityScore / 100,
                    bestTimeOfDay,
                    productivityScore
                };
            }
            
            static analyzeBestTime(userData) {
                const moods = userData.moods || [];
                const morningMoods = moods.filter(m => new Date(m.date).getHours() < 12);
                const afternoonMoods = moods.filter(m => new Date(m.date).getHours() >= 12 && new Date(m.date).getHours() < 17);
                const eveningMoods = moods.filter(m => new Date(m.date).getHours() >= 17);
                
                const getAvgMood = (moods) => {
                    if (!moods.length) return 0;
                    const values = { great: 5, good: 4, motivated: 4, okay: 3, tired: 2, stressed: 1 };
                    return moods.reduce((sum, m) => sum + (values[m.mood] || 3), 0) / moods.length;
                };
                
                const morning = getAvgMood(morningMoods);
                const afternoon = getAvgMood(afternoonMoods);
                const evening = getAvgMood(eveningMoods);
                
                if (morning >= afternoon && morning >= evening) return "Morning";
                if (afternoon >= morning && afternoon >= evening) return "Afternoon";
                return "Evening";
            }
            
            static generateMoodPrediction(moods) {
                if (moods.length < 3) return { trend: 'stable', prediction: '😐', confidence: 50 };
                
                const recentMoods = moods.slice(-7);
                const values = recentMoods.map(m => {
                    const map = { great: 5, good: 4, motivated: 4, okay: 3, tired: 2, stressed: 1 };
                    return map[m.mood] || 3;
                });
                
                const avg = values.reduce((a, b) => a + b, 0) / values.length;
                const last = values[values.length - 1];
                const trend = last > avg ? 'improving' : last < avg ? 'declining' : 'stable';
                
                let prediction = '😐';
                if (trend === 'improving') prediction = last > 4 ? '😄' : '🙂';
                else if (trend === 'declining') prediction = last < 2 ? '😰' : '😴';
                
                return { trend, prediction, confidence: Math.abs(last - avg) * 20 + 50 };
            }
            
            static generateRecommendation(userData) {
                const tasks = userData.tasks || [];
                const pendingTasks = tasks.filter(t => !t.completed).length;
                const moods = userData.moods || [];
                const recentMoods = moods.slice(-5);
                const stressedCount = recentMoods.filter(m => m.mood === 'stressed').length;
                
                if (pendingTasks > 5) {
                    return "You have several pending tasks. Try breaking them into smaller chunks and using the Pomodoro technique! 🎯";
                }
                if (stressedCount > 3) {
                    return "You've been feeling stressed lately. Take a 5-minute break and try our breathing exercise. Your well-being matters! 💙";
                }
                if (userData.studyStreak > 5) {
                    return `Amazing ${userData.studyStreak}-day streak! Keep up the momentum. Remember to take breaks and stay hydrated! 🔥`;
                }
                return "You're doing great! Focus on one task at a time and celebrate small wins. Every step counts! 🌟";
            }
        }

        // ============ AUTHENTICATION ============
        function showLogin() {
            document.getElementById('app').innerHTML = `
                <div class="auth-container">
                    <div class="auth-card">
                        <div class="auth-header">
                            <div class="logo-icon">FW</div>
                            <h1>Welcome to FocusWell AI</h1>
                            <p>Your AI-powered study & wellness companion</p>
                        </div>
                        <form id="loginForm">
                            <div class="form-group">
                                <label>Email</label>
                                <input type="email" id="email" required placeholder="student@example.com">
                            </div>
                            <div class="form-group">
                                <label>Password</label>
                                <input type="password" id="password" required placeholder="••••••">
                            </div>
                            <button type="submit" class="btn btn-primary" style="width: 100%;">Login</button>
                        </form>
                        <p style="text-align: center; margin-top: 20px;">
                            Don't have an account? <a href="#" onclick="showRegister(); return false;">Sign up</a>
                        </p>
                        <div id="authError" class="error-message" style="color: red; margin-top: 15px; text-align: center;"></div>
                    </div>
                </div>
            `;
            
            document.getElementById('loginForm').addEventListener('submit', (e) => {
                e.preventDefault();
                const email = document.getElementById('email').value;
                const password = document.getElementById('password').value;
                const user = Storage.getUser(email);
                
                if (user && user.password === password) {
                    Storage.setCurrentUser(user);
                    showDashboard();
                } else {
                    document.getElementById('authError').innerText = 'Invalid credentials';
                }
            });
        }
        
        function showRegister() {
            document.getElementById('app').innerHTML = `
                <div class="auth-container">
                    <div class="auth-card">
                        <div class="auth-header">
                            <div class="logo-icon">FW</div>
                            <h1>Create Account</h1>
                            <p>Start your journey with AI assistance</p>
                        </div>
                        <form id="registerForm">
                            <div class="form-group">
                                <label>Full Name</label>
                                <input type="text" id="name" required placeholder="John Doe">
                            </div>
                            <div class="form-group">
                                <label>Email</label>
                                <input type="email" id="email" required placeholder="student@example.com">
                            </div>
                            <div class="form-group">
                                <label>Password</label>
                                <input type="password" id="password" required placeholder="••••••">
                            </div>
                            <button type="submit" class="btn btn-primary" style="width: 100%;">Register</button>
                        </form>
                        <p style="text-align: center; margin-top: 20px;">
                            Already have an account? <a href="#" onclick="showLogin(); return false;">Login</a>
                        </p>
                        <div id="authError" class="error-message" style="color: red; margin-top: 15px; text-align: center;"></div>
                    </div>
                </div>
            `;
            
            document.getElementById('registerForm').addEventListener('submit', (e) => {
                e.preventDefault();
                const name = document.getElementById('name').value;
                const email = document.getElementById('email').value;
                const password = document.getElementById('password').value;
                
                if (Storage.getUser(email)) {
                    document.getElementById('authError').innerText = 'User already exists';
                    return;
                }
                
                const newUser = {
                    name, email, password,
                    tasks: [],
                    moods: [],
                    studyStreak: 0,
                    createdAt: new Date().toISOString(),
                    preferences: { dailyGoal: 4, notifications: true }
                };
                
                Storage.saveUser(newUser);
                Storage.setCurrentUser(newUser);
                showDashboard();
            });
        }
        
        // ============ DASHBOARD ============
        async function showDashboard() {
            const user = Storage.getCurrentUser();
            if (!user) {
                showLogin();
                return;
            }
            
            // Update AI predictions
            const aiPrediction = await AIModel.predictOptimalStudyTime(user);
            const moodPrediction = AIModel.generateMoodPrediction(user.moods || []);
            const recommendation = AIModel.generateRecommendation(user);
            
            const completedTasks = (user.tasks || []).filter(t => t.completed).length;
            const totalTasks = (user.tasks || []).length;
            const completionRate = totalTasks ? Math.round((completedTasks / totalTasks) * 100) : 0;
            
            document.getElementById('app').innerHTML = `
                <div class="dashboard-container">
                    <aside class="sidebar">
                        <div class="sidebar-header">
                            <div class="logo">
                                <div class="logo-icon">FW</div>
                                <span class="logo-text">FocusWell AI</span>
                            </div>
                        </div>
                        <nav class="sidebar-nav">
                            <div class="nav-link active" data-screen="dashboard">🏠 Dashboard</div>
                            <div class="nav-link" data-screen="planner">📅 Study Planner</div>
                            <div class="nav-link" data-screen="mood">😊 Mood Tracker</div>
                            <div class="nav-link" data-screen="analytics">📊 AI Analytics</div>
                        </nav>
                        <div class="sidebar-footer">
                            <div class="user-info">
                                <div class="user-avatar">${user.name.charAt(0)}</div>
                                <div>
                                    <strong>${user.name}</strong><br>
                                    <small>${user.email}</small>
                                </div>
                            </div>
                            <button class="logout-btn" onclick="logout()">🚪 Logout</button>
                        </div>
                    </aside>
                    
                    <main class="main-content">
                        <!-- Dashboard Screen -->
                        <div id="dashboardScreen" class="screen active">
                            <div class="screen-header">
                                <h1>Welcome back, ${user.name.split(' ')[0]}! 👋</h1>
                                <p>Your AI-powered study assistant is ready</p>
                            </div>
                            
                            <div class="ai-stats-grid">
                                <div class="stat-card">
                                    <i class="fas fa-brain"></i>
                                    <div class="stat-info">
                                        <h3>${aiPrediction.productivityScore}%</h3>
                                        <p>AI Productivity Score</p>
                                    </div>
                                </div>
                                <div class="stat-card">
                                    <i class="fas fa-chart-line"></i>
                                    <div class="stat-info">
                                        <h3>${moodPrediction.trend === 'improving' ? '📈' : moodPrediction.trend === 'declining' ? '📉' : '➡️'} ${moodPrediction.trend}</h3>
                                        <p>Mood Trend</p>
                                    </div>
                                </div>
                                <div class="stat-card">
                                    <i class="fas fa-calendar-check"></i>
                                    <div class="stat-info">
                                        <h3>${user.studyStreak}</h3>
                                        <p>Day Streak</p>
                                    </div>
                                </div>
                                <div class="stat-card">
                                    <i class="fas fa-tasks"></i>
                                    <div class="stat-info">
                                        <h3>${completionRate}%</h3>
                                        <p>Completion Rate</p>
                                    </div>
                                </div>
                            </div>
                            
                            <div class="ai-card">
                                <div style="display: flex; align-items: center; gap: 15px; margin-bottom: 15px;">
                                    <i class="fas fa-robot" style="font-size: 30px;"></i>
                                    <h3>AI Recommendation</h3>
                                    <span style="background: rgba(255,255,255,0.2); padding: 5px 12px; border-radius: 20px; font-size: 12px;">Powered by ML</span>
                                </div>
                                <p>${recommendation}</p>
                            </div>
                            
                            <div class="grid-2">
                                <div class="card">
                                    <div class="card-header">
                                        <h2>Today's Tasks</h2>
                                        <button class="btn btn-primary" style="padding: 8px 16px;" onclick="showAddTask()">+ Add Task</button>
                                    </div>
                                    <div class="tasks-list" id="tasksList">
                                        ${renderTasks(user.tasks || [])}
                                    </div>
                                </div>
                                
                                <div class="card">
                                    <div class="card-header">
                                        <h2>Quick Mood Check</h2>
                                        <i class="fas fa-smile"></i>
                                    </div>
                                    <div class="mood-buttons">
                                        <button class="mood-btn" onclick="logMood('great')"><i class="fas fa-laugh-beam"></i><span>Great</span></button>
                                        <button class="mood-btn" onclick="logMood('good')"><i class="fas fa-smile"></i><span>Good</span></button>
                                        <button class="mood-btn" onclick="logMood('okay')"><i class="fas fa-meh"></i><span>Okay</span></button>
                                        <button class="mood-btn" onclick="logMood('stressed')"><i class="fas fa-tired"></i><span>Stressed</span></button>
                                        <button class="mood-btn" onclick="logMood('motivated')"><i class="fas fa-rocket"></i><span>Motivated</span></button>
                                    </div>
                                    <div id="moodResponse" style="display: none;" class="mood-response"></div>
                                </div>
                            </div>
                        </div>
                        
                        <!-- Study Planner Screen -->
                        <div id="plannerScreen" class="screen">
                            <div class="screen-header">
                                <h1>AI Study Planner</h1>
                                <p>Intelligent scheduling powered by ML</p>
                            </div>
                            
                            <div class="card">
                                <div class="card-header">
                                    <h2>Create New Task</h2>
                                    <i class="fas fa-plus-circle"></i>
                                </div>
                                <form id="addTaskForm">
                                    <div class="form-group">
                                        <label>Task Title</label>
                                        <input type="text" id="taskTitle" required placeholder="e.g., Complete Math Assignment">
                                    </div>
                                    <div class="form-group">
                                        <label>Subject</label>
                                        <input type="text" id="taskSubject" required placeholder="Mathematics, Physics, etc.">
                                    </div>
                                    <div class="form-group">
                                        <label>Deadline</label>
                                        <input type="date" id="taskDeadline" required>
                                    </div>
                                    <div class="form-group">
                                        <label>Priority</label>
                                        <select id="taskPriority">
                                            <option value="low">Low</option>
                                            <option value="medium" selected>Medium</option>
                                            <option value="high">High</option>
                                        </select>
                                    </div>
                                    <button type="submit" class="btn btn-primary">Generate AI Plan</button>
                                </form>
                            </div>
                            
                            <div id="aiPrediction" class="ai-card" style="display: none;"></div>
                            
                            <div class="card">
                                <div class="card-header">
                                    <h2>Your Tasks</h2>
                                    <i class="fas fa-list"></i>
                                </div>
                                <div class="tasks-list" id="allTasksList">
                                    ${renderTasks(user.tasks || [])}
                                </div>
                            </div>
                        </div>
                        
                        <!-- Mood Tracker Screen -->
                        <div id="moodScreen" class="screen">
                            <div class="screen-header">
                                <h1>Mood & Wellness Tracker</h1>
                                <p>AI-powered emotional intelligence</p>
                            </div>
                            
                            <div class="grid-2">
                                <div class="card">
                                    <div class="card-header">
                                        <h2>Mood History</h2>
                                        <i class="fas fa-chart-simple"></i>
                                    </div>
                                    <canvas id="moodChart" height="200"></canvas>
                                    <div id="moodHistoryList" style="margin-top: 20px;">
                                        ${renderMoodHistory(user.moods || [])}
                                    </div>
                                </div>
                                
                                <div class="card">
                                    <div class="card-header">
                                        <h2>AI Wellness Insights</h2>
                                        <i class="fas fa-heartbeat"></i>
                                    </div>
                                    <div id="wellnessInsights">
                                        <p><strong>Mood Prediction:</strong> ${moodPrediction.prediction} (${Math.round(moodPrediction.confidence)}% confidence)</p>
                                        <p><strong>Trend:</strong> ${moodPrediction.trend}</p>
                                        <p><strong>Recommendation:</strong> ${moodPrediction.trend === 'declining' ? 'Take a mental health break today 💙' : 'Keep up the positive momentum! 🌟'}</p>
                                    </div>
                                </div>
                            </div>
                            
                            <div class="card">
                                <div class="card-header">
                                    <h2>Quick Wellness Tools</h2>
                                    <i class="fas fa-spa"></i>
                                </div>
                                <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 15px;">
                                    <button class="btn btn-primary" onclick="startBreathingExercise()">🧘 Breathing Exercise</button>
                                    <button class="btn btn-primary" onclick="showAffirmation()">⭐ Positive Affirmation</button>
                                    <button class="btn btn-primary" onclick="playFocusMusic()">🎵 Focus Music</button>
                                </div>
                            </div>
                        </div>
                        
                        <!-- AI Analytics Screen -->
                        <div id="analyticsScreen" class="screen">
                            <div class="screen-header">
                                <h1>AI Performance Analytics</h1>
                                <p>Deep insights into your study patterns</p>
                            </div>
                            
                            <div class="ai-stats-grid">
                                <div class="stat-card">
                                    <i class="fas fa-clock"></i>
                                    <div class="stat-info">
                                        <h3>${aiPrediction.bestTimeOfDay}</h3>
                                        <p>Best Study Time</p>
                                    </div>
                                </div>
                                <div class="stat-card">
                                    <i class="fas fa-hourglass-half"></i>
                                    <div class="stat-info">
                                        <h3>${aiPrediction.recommendedHours}h</h3>
                                        <p>Recommended Daily</p>
                                    </div>
                                </div>
                                <div class="stat-card">
                                    <i class="fas fa-bullseye"></i>
                                    <div class="stat-info">
                                        <h3>${Math.round(aiPrediction.confidence * 100)}%</h3>
                                        <p>AI Confidence</p>
                                    </div>
                                </div>
                            </div>
                            
                            <div class="card">
                                <div class="card-header">
                                    <h2>Productivity Analysis</h2>
                                    <i class="fas fa-chart-line"></i>
                                </div>
                                <canvas id="productivityChart" height="200"></canvas>
                            </div>
                            
                            <div class="card">
                                <div class="card-header">
                                    <h2>AI Smart Suggestions</h2>
                                    <i class="fas fa-lightbulb"></i>
                                </div>
                                <div id="smartSuggestions">
                                    ${generateSmartSuggestions(user)}
                                </div>
                            </div>
                        </div>
                    </main>
                </div>
            `;
            
            // Setup navigation
            document.querySelectorAll('.nav-link').forEach(link => {
                link.addEventListener('click', (e) => {
                    const screen = link.dataset.screen;
                    document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
                    link.classList.add('active');
                    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
                    document.getElementById(`${screen}Screen`).classList.add('active');
                    
                    if (screen === 'mood') {
                        renderMoodChart();
                    }
                    if (screen === 'analytics') {
                        renderProductivityChart();
                    }
                });
            });
            
            // Setup add task form
            const addTaskForm = document.getElementById('addTaskForm');
            if (addTaskForm) {
                addTaskForm.addEventListener('submit', async (e) => {
                    e.preventDefault();
                    await addTask();
                });
            }
            
            // Render charts
            renderMoodChart();
            renderProductivityChart();
        }
        
        function renderTasks(tasks) {
            if (!tasks.length) return '<p style="text-align: center; color: #999;">No tasks yet. Create your first task!</p>';
            
            return tasks.map(task => `
                <div class="task-item">
                    <input type="checkbox" ${task.completed ? 'checked' : ''} onchange="toggleTask('${task.id}')" style="width: 20px; height: 20px;">
                    <div style="flex: 1;">
                        <strong>${task.title}</strong><br>
                        <small>${task.subject} • Due: ${task.deadline}</small>
                    </div>
                    <span class="task-priority ${task.priority}">${task.priority}</span>
                </div>
            `).join('');
        }
        
        function renderMoodHistory(moods) {
            if (!moods.length) return '<p style="text-align: center; color: #999;">No mood entries yet. Check in daily!</p>';
            
            return moods.slice(-7).reverse().map(mood => `
                <div style="display: flex; justify-content: space-between; padding: 10px; border-bottom: 1px solid #eee;">
                    <span>${getMoodEmoji(mood.mood)} ${mood.mood}</span>
                    <span style="color: #999;">${new Date(mood.date).toLocaleDateString()}</span>
                </div>
            `).join('');
        }
        
        function getMoodEmoji(mood) {
            const emojis = { great: '😄', good: '🙂', okay: '😐', stressed: '😰', tired: '😴', motivated: '💪' };
            return emojis[mood] || '😐';
        }
        
        function generateSmartSuggestions(user) {
            const tasks = user.tasks || [];
            const completedTasks = tasks.filter(t => t.completed).length;
            const pendingTasks = tasks.filter(t => !t.completed).length;
            
            const suggestions = [];
            if (pendingTasks > 3) suggestions.push("📚 Break down large tasks into smaller, manageable chunks");
            if (completedTasks > 10) suggestions.push("🏆 Great progress! Consider increasing your daily goals");
            suggestions.push("🎯 Use the Pomodoro technique: 25 min study, 5 min break");
            suggestions.push("💡 Review notes within 24 hours for better retention");
            suggestions.push("🧠 Take a 5-minute break every hour to maintain focus");
            
            return suggestions.map(s => `<div style="padding: 12px; margin: 8px 0; background: rgba(102,126,234,0.05); border-radius: 8px;">${s}</div>`).join('');
        }
        
        function renderMoodChart() {
            const user = Storage.getCurrentUser();
            const moods = user.moods || [];
            const ctx = document.getElementById('moodChart')?.getContext('2d');
            if (!ctx) return;
            
            const last7Days = moods.slice(-7);
            const moodValues = last7Days.map(m => {
                const values = { great: 5, good: 4, motivated: 4, okay: 3, tired: 2, stressed: 1 };
                return values[m.mood] || 3;
            });
            
            new Chart(ctx, {
                type: 'line',
                data: {
                    labels: last7Days.map((_, i) => `Day ${i+1}`),
                    datasets: [{
                        label: 'Mood Score',
                        data: moodValues,
                        borderColor: '#667eea',
                        backgroundColor: 'rgba(102, 126, 234, 0.1)',
                        tension: 0.4,
                        fill: true
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: true,
                    scales: { y: { min: 0, max: 5 } }
                }
            });
        }
        
        function renderProductivityChart() {
            const ctx = document.getElementById('productivityChart')?.getContext('2d');
            if (!ctx) return;
            
            new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: ['Week 1', 'Week 2', 'Week 3', 'Week 4'],
                    datasets: [{
                        label: 'Productivity Score',
                        data: [65, 72, 78, 82],
                        backgroundColor: 'rgba(102, 126, 234, 0.5)',
                        borderColor: '#667eea',
                        borderWidth: 2
                    }]
                },
                options: { responsive: true, maintainAspectRatio: true }
            });
        }
        
        // ============ ACTIONS ============
        async function addTask() {
            const user = Storage.getCurrentUser();
            const title = document.getElementById('taskTitle').value;
            const subject = document.getElementById('taskSubject').value;
            const deadline = document.getElementById('taskDeadline').value;
            const priority = document.getElementById('taskPriority').value;
            
            const newTask = {
                id: Date.now().toString(),
                title, subject, deadline, priority,
                completed: false,
                createdAt: new Date().toISOString()
            };
            
            user.tasks = user.tasks || [];
            user.tasks.push(newTask);
            Storage.updateUser(user.email, { tasks: user.tasks });
            Storage.setCurrentUser({ ...user, tasks: user.tasks });
            
            // Get AI prediction
            const prediction = await AIModel.predictOptimalStudyTime(user);
            const predictionDiv = document.getElementById('aiPrediction');
            predictionDiv.style.display = 'block';
            predictionDiv.innerHTML = `
                <div style="display: flex; align-items: center; gap: 15px; margin-bottom: 15px;">
                    <i class="fas fa-chart-line" style="font-size: 30px;"></i>
                    <h3>AI Prediction</h3>
                </div>
                <p>📚 Recommended study time: <strong>${prediction.recommendedHours} hours</strong></p>
                <p>⏰ Best time to study: <strong>${prediction.bestTimeOfDay}</strong></p>
                <p>🎯 Confidence: <strong>${Math.round(prediction.confidence * 100)}%</strong></p>
                <p>💡 Tip: Break your study session into 25-minute focused blocks with 5-minute breaks.</p>
            `;
            
            document.getElementById('addTaskForm').reset();
            showDashboard();
            
            setTimeout(() => {
                predictionDiv.style.display = 'none';
            }, 8000);
        }
        
        function toggleTask(taskId) {
            const user = Storage.getCurrentUser();
            const task = user.tasks.find(t => t.id === taskId);
            if (task) {
                task.completed = !task.completed;
                Storage.updateUser(user.email, { tasks: user.tasks });
                
                // Update streak if task completed
                if (task.completed) {
                    user.studyStreak = (user.studyStreak || 0) + 1;
                    Storage.updateUser(user.email, { studyStreak: user.studyStreak });
                }
                
                Storage.setCurrentUser({ ...user, tasks: user.tasks });
                showDashboard();
            }
        }
        
        function logMood(mood) {
            const user = Storage.getCurrentUser();
            user.moods = user.moods || [];
            user.moods.push({
                mood,
                date: new Date().toISOString(),
                note: ''
            });
            
            Storage.updateUser(user.email, { moods: user.moods });
            Storage.setCurrentUser({ ...user, moods: user.moods });
            
            const responses = {
                great: "That's wonderful! Your positive energy will boost your studies! ✨",
                good: "Glad to hear! Keep that momentum going! 💪",
                okay: "It's okay. Take a deep breath and take things one step at a time. 🌱",
                stressed: "Take a moment to breathe. You're doing your best! 🧘",
                motivated: "Excellent! Channel that energy into your goals! 🚀"
            };
            
            const responseDiv = document.getElementById('moodResponse');
            responseDiv.innerHTML = `<p>${responses[mood] || "Thank you for sharing!"}</p>`;
            responseDiv.style.display = 'block';
            
            setTimeout(() => {
                responseDiv.style.display = 'none';
            }, 4000);
            
            showDashboard();
        }
        
        function startBreathingExercise() {
            alert("🧘 4-7-8 Breathing Exercise:\n\n1. Inhale for 4 seconds\n2. Hold for 7 seconds\n3. Exhale for 8 seconds\n\nRepeat 4 times for instant calm!");
        }
        
        function showAffirmation() {
            const affirmations = [
                "I am capable of achieving my goals",
                "Every day, I'm getting better and better",
                "I have the power to create positive change",
                "My mind is calm, focused, and ready to learn"
            ];
            alert(`✨ Affirmation: ${affirmations[Math.floor(Math.random() * affirmations.length)]}`);
        }
        
        function playFocusMusic() {
            alert("🎵 Playing focus music in your mind... Try listening to lo-fi hip hop or classical music while studying!");
        }
        
        function logout() {
            Storage.clearCurrentUser();
            showLogin();
        }
        
        // Export functions to global
        window.showLogin = showLogin;
        window.showRegister = showRegister;
        window.showDashboard = showDashboard;
        window.logout = logout;
        window.addTask = addTask;
        window.toggleTask = toggleTask;
        window.logMood = logMood;
        window.startBreathingExercise = startBreathingExercise;
        window.showAffirmation = showAffirmation;
        window.playFocusMusic = playFocusMusic;
        
        // Initialize
        if (Storage.getCurrentUser()) {
            showDashboard();
        } else {
            showLogin();
        }
    </script>
</body>
</html>
