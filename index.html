<!-- FocusWell STARTUP VERSION (Full SaaS-Level Frontend Prototype) -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FocusWell AI 🚀</title>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
:root{
 --bg:#fff7f0; --card:#ffffff; --primary:#ff6b6b; --secondary:#4ecdc4; --text:#2d3436;
}
.dark{--bg:#121212;--card:#1e1e1e;--text:#fff;--primary:#9b59b6}
.ocean{--bg:#e0f7fa;--primary:#0077b6;--secondary:#00b4d8}
body{margin:0;font-family:Quicksand;background:var(--bg);color:var(--text)}
.container{padding:20px;max-width:1000px;margin:auto}
.card{background:var(--card);padding:20px;border-radius:20px;margin:15px 0}
.btn{padding:10px 20px;border:none;border-radius:20px;background:var(--primary);color:#fff;cursor:pointer;margin:5px}
input,textarea{width:100%;padding:10px;border-radius:10px;border:1px solid #ccc;margin:5px 0}
</style>
</head>
<body>
<div class="container">
<h1>🐼 FocusWell AI (Startup Edition)</h1>

<!-- THEMES -->
<div class="card">
<h3>🎨 Themes</h3>
<button class="btn" onclick="setTheme('')">Default</button>
<button class="btn" onclick="setTheme('dark')">Dark</button>
<button class="btn" onclick="setTheme('ocean')">Ocean</button>
</div>

<!-- USER AUTH (DEMO) -->
<div class="card">
<h3>🔐 Auth (Demo)</h3>
<input id="email" placeholder="Email">
<input id="password" placeholder="Password" type="password">
<button class="btn" onclick="login()">Login</button>
</div>

<!-- AI STUDY PLANNER -->
<div class="card">
<h3>🎯 AI Study Planner</h3>
<textarea id="goal" placeholder="Enter your study goal"></textarea>
<button class="btn" onclick="generatePlan()">Generate Plan</button>
<p id="plan"></p>
</div>

<!-- NOTES + AI -->
<div class="card">
<h3>📝 Smart Notes</h3>
<textarea id="notes" rows="4"></textarea>
<button class="btn" onclick="readNotes()">🔊 Read</button>
<button class="btn" onclick="summarizeNotes()">✨ Summarize</button>
<button class="btn" onclick="quizNotes()">🧠 Make Quiz</button>
</div>

<!-- SPEECH -->
<div class="card">
<h3>🎤 Speech to Text</h3>
<button class="btn" onclick="startSTT()">Start</button>
<p id="speech"></p>
</div>

<!-- ANALYTICS -->
<div class="card">
<h3>📊 Progress Analytics</h3>
<canvas id="chart"></canvas>
<button class="btn" onclick="logStudy()">+ Study Hour</button>
</div>

<!-- SOCIAL FEED -->
<div class="card">
<h3>📱 Study Feed</h3>
<input id="post" placeholder="Share progress">
<button class="btn" onclick="addPost()">Post</button>
<div id="feed"></div>
</div>

<!-- CHATBOT -->
<div class="card">
<h3>🤖 AI Assistant</h3>
<input id="chatInput">
<button class="btn" onclick="chat()">Send</button>
<div id="chatBox"></div>
</div>

</div>

<script>
let studyData = JSON.parse(localStorage.getItem('study')||'[1,2,3]');

function setTheme(t){document.body.className=t}

function login(){alert('Connected to backend (simulate Firebase/Auth)')}

// AI CALL
async function ai(prompt){
 let res = await fetch('https://api.openai.com/v1/chat/completions',{
 method:'POST',
 headers:{'Content-Type':'application/json','Authorization':'Bearer YOUR_API_KEY'},
 body:JSON.stringify({model:'gpt-4o-mini',messages:[{role:'user',content:prompt}]})
 });
 let d=await res.json(); return d.choices?.[0]?.message?.content;
}

async function generatePlan(){
 let goal=document.getElementById('goal').value;
 document.getElementById('plan').innerText = await ai("Create study plan for: "+goal);
}

function readNotes(){speechSynthesis.speak(new SpeechSynthesisUtterance(notes.value))}
async function summarizeNotes(){alert(await ai("Summarize:\n"+notes.value))}
async function quizNotes(){alert(await ai("Make quiz:\n"+notes.value))}

function startSTT(){
 let r=new(window.SpeechRecognition||webkitSpeechRecognition)();
 r.onresult=e=>speech.innerText=e.results[0][0].transcript;
 r.start();
}

function logStudy(){studyData.push(Math.floor(Math.random()*5)+1);localStorage.setItem('study',JSON.stringify(studyData));drawChart()}

function drawChart(){
 new Chart(document.getElementById('chart'),{
 type:'line',data:{labels:studyData.map((_,i)=>i+1),datasets:[{data:studyData}]}
 })
}

function addPost(){
 let p=post.value;
 let div=document.createElement('div');
 div.innerHTML="🐣 "+p;
 feed.prepend(div);
}

async function chat(){
 let msg=chatInput.value;
 chatBox.innerHTML+=`<p>You: ${msg}</p>`;
 let r=await ai(msg);
 chatBox.innerHTML+=`<p>Bot: ${r}</p>`;
}

// INIT
drawChart();
</script>
</body>
</html>
`
