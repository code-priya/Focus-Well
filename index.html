<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>FocusWell Social | Study Smarter with AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.15.0/dist/tf.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #405DE6;
            --primary-dark: #3851c9;
            --secondary: #E4405F;
            --accent: #F56040;
            --success: #00C851;
            --warning: #FFB900;
            --dark: #262626;
            --light: #FAFAFA;
            --gray: #8E8E8E;
            --border: #DBDBDB;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #FAFAFA;
            overflow-x: hidden;
        }

        /* Instagram-style Stories Bar */
        .stories-container {
            background: white;
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 20px;
            overflow-x: auto;
            white-space: nowrap;
            scrollbar-width: none;
        }

        .stories-container::-webkit-scrollbar {
            display: none;
        }

        .story-item {
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            margin-right: 20px;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .story-item:hover {
            transform: scale(1.05);
        }

        .story-ring {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: linear-gradient(45deg, #F58529, #FEDA77, #DD2A7B, #8134AF, #515BD4);
            padding: 2px;
            margin-bottom: 8px;
        }

        .story-ring-inner {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: white;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .story-ring-inner img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .story-avatar {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
        }

        /* Post Cards */
        .post-card {
            background: white;
            border: 1px solid var(--border);
            border-radius: 12px;
            margin-bottom: 20px;
            overflow: hidden;
        }

        .post-header {
            display: flex;
            align-items: center;
            padding: 12px 16px;
        }

        .post-avatar {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            margin-right: 12px;
        }

        .post-info {
            flex: 1;
        }

        .post-name {
            font-weight: 700;
            color: var(--dark);
        }

        .post-time {
            font-size: 11px;
            color: var(--gray);
        }

        .post-options {
            cursor: pointer;
            font-size: 20px;
        }

        .post-image {
            width: 100%;
            background: linear-gradient(135deg, #667eea, #764ba2);
            min-height: 400px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            position: relative;
            overflow: hidden;
        }

        .post-stats {
            display: flex;
            gap: 16px;
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
        }

        .post-stat {
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .post-stat:hover {
            transform: scale(1.1);
        }

        .post-caption {
            padding: 12px 16px;
        }

        /* Navigation Bar */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: white;
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: space-around;
            padding: 12px 0;
            z-index: 100;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            transition: all 0.2s;
            color: var(--gray);
        }

        .nav-item.active {
            color: var(--primary);
        }

        .nav-item i {
            font-size: 24px;
        }

        .nav-item span {
            font-size: 11px;
        }

        /* Study Stats Dashboard */
        .stats-dashboard {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border-radius: 20px;
            padding: 20px;
            color: white;
            margin-bottom: 20px;
        }

        /* AI Insights Card */
        .ai-insight {
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-radius: 16px;
            padding: 16px;
            color: white;
            margin-bottom: 20px;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .ai-insight:hover {
            transform: translateY(-3px);
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.8);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background: white;
            border-radius: 20px;
            max-width: 90%;
            width: 400px;
            max-height: 80%;
            overflow-y: auto;
            padding: 20px;
        }

        /* Create Post Modal */
        .create-post {
            background: white;
            border-radius: 20px;
            padding: 20px;
        }

        /* Leaderboard */
        .leaderboard-item {
            display: flex;
            align-items: center;
            padding: 12px;
            border-bottom: 1px solid var(--border);
        }

        .leaderboard-rank {
            font-size: 20px;
            font-weight: bold;
            width: 50px;
            color: var(--primary);
        }

        .leaderboard-avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            margin: 0 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
        }

        /* Study Timer */
        .timer-card {
            text-align: center;
            padding: 30px;
        }

        .timer-display {
            font-size: 64px;
            font-weight: bold;
            font-family: monospace;
            margin: 20px 0;
        }

        /* Responsive */
        .main-container {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px 16px 80px 16px;
        }

        @keyframes likeAnimation {
            0% { transform: scale(1); }
            50% { transform: scale(1.3); }
            100% { transform: scale(1); }
        }

        .liked {
            animation: likeAnimation 0.3s ease;
            color: var(--secondary);
        }
    </style>
</head>
<body>
    <div id="app"></div>

    <script>
        // ============ AI/ML ENGINE ============
        class StudyAIEngine {
            constructor() {
                this.model = null;
            }

            async initModel() {
                // Create a simple neural network for productivity prediction
                this.model = tf.sequential();
                this.model.add(tf.layers.dense({ units: 32, activation: 'relu', inputShape: [4] }));
                this.model.add(tf.layers.dense({ units: 16, activation: 'relu' }));
                this.model.add(tf.layers.dense({ units: 1, activation: 'sigmoid' }));
                
                this.model.compile({
                    optimizer: tf.train.adam(0.01),
                    loss: 'meanSquaredError'
                });
                
                // Train with sample data
                const xs = tf.tensor2d([
                    [2, 7, 3, 80], [4, 6, 5, 70], [1, 8, 2, 90], [5, 5, 8, 50], [3, 7, 4, 85]
                ]);
                const ys = tf.tensor2d([[0.7], [0.9], [0.5], [0.95], [0.75]]);
                
                await this.model.fit(xs, ys, { epochs: 20 });
                console.log('AI Model trained!');
            }

            async predictProductivity(studyHours, sleepHours, breaks, focusScore) {
                if (!this.model) await this.initModel();
                const input = tf.tensor2d([[studyHours, sleepHours, breaks, focusScore]]);
                const prediction = await this.model.predict(input);
                const score = (await prediction.data())[0] * 100;
                return Math.min(98, Math.max(20, Math.round(score)));
            }

            generateStudyTip(userData) {
                const tips = [
                    "🎯 Use the Pomodoro Technique: 25 min study, 5 min break!",
                    "📝 Active recall beats passive reading - test yourself!",
                    "🌙 Sleep consolidates memory - get 7-8 hours!",
                    "🎵 Lo-fi music can improve focus by 15%!",
                    "✍️ Handwrite notes for better retention!",
                    "🏆 Study with friends using our groups feature!",
                    "🧘 Take movement breaks every 90 minutes!",
                    "📱 Put your phone on focus mode while studying!"
                ];
                return tips[Math.floor(Math.random() * tips.length)];
            }

            analyzeStudyPattern(studyHistory) {
                if (studyHistory.length < 3) return null;
                
                const bestTimes = {};
                studyHistory.forEach(session => {
                    const hour = new Date(session.time).getHours();
                    const period = hour < 12 ? "Morning" : hour < 17 ? "Afternoon" : "Evening";
                    bestTimes[period] = (bestTimes[period] || 0) + (session.productivity || 70);
                });
                
                let bestTime = "Morning";
                let maxScore = 0;
                for (const [time, score] of Object.entries(bestTimes)) {
                    if (score > maxScore) {
                        maxScore = score;
                        bestTime = time;
                    }
                }
                
                return {
                    bestTimeToStudy: bestTime,
                    consistency: studyHistory.length,
                    averageProductivity: studyHistory.reduce((sum, s) => sum + (s.productivity || 70), 0) / studyHistory.length
                };
            }
        }

        // ============ DATA STORAGE ============
        const DB = {
            getCurrentUser: () => JSON.parse(localStorage.getItem('focuswell_user')),
            setCurrentUser: (user) => localStorage.setItem('focuswell_user', JSON.stringify(user)),
            clearCurrentUser: () => localStorage.removeItem('focuswell_user'),
            
            getPosts: () => JSON.parse(localStorage.getItem('focuswell_posts') || '[]'),
            savePost: (post) => {
                const posts = DB.getPosts();
                posts.unshift(post);
                localStorage.setItem('focuswell_posts', JSON.stringify(posts.slice(0, 50)));
            },
            updatePost: (postId, updates) => {
                const posts = DB.getPosts();
                const index = posts.findIndex(p => p.id === postId);
                if (index !== -1) {
                    posts[index] = { ...posts[index], ...updates };
                    localStorage.setItem('focuswell_posts', JSON.stringify(posts));
                }
            },
            
            getUsers: () => JSON.parse(localStorage.getItem('focuswell_users') || '[]'),
            saveUser: (user) => {
                const users = DB.getUsers();
                users.push(user);
                localStorage.setItem('focuswell_users', JSON.stringify(users));
            },
            updateUser: (email, updates) => {
                const users = DB.getUsers();
                const index = users.findIndex(u => u.email === email);
                if (index !== -1) {
                    users[index] = { ...users[index], ...updates };
                    localStorage.setItem('focuswell_users', JSON.stringify(users));
                }
            },
            getUser: (email) => DB.getUsers().find(u => u.email === email),
            
            getStudySessions: () => JSON.parse(localStorage.getItem('focuswell_sessions') || '[]'),
            saveStudySession: (session) => {
                const sessions = DB.getStudySessions();
                sessions.push(session);
                localStorage.setItem('focuswell_sessions', JSON.stringify(sessions.slice(-30)));
            }
        };

        // Initialize sample data
        function initSampleData() {
            if (DB.getPosts().length === 0) {
                const samplePosts = [
                    { id: 1, userId: 'alex', userName: 'Alex Chen', userAvatar: 'A', content: 'Just finished 4 hours of deep work! 📚 Feeling productive!', image: null, likes: 124, comments: 12, time: new Date().toISOString(), studyHours: 4 },
                    { id: 2, userId: 'maria', userName: 'Maria Garcia', userAvatar: 'M', content: 'AI suggested I study in the morning and it worked! Got 92% on my quiz! 🎉', image: null, likes: 89, comments: 8, time: new Date(Date.now() - 3600000).toISOString(), studyHours: 3 },
                    { id: 3, userId: 'james', userName: 'James Wilson', userAvatar: 'J', content: 'Study streak: 7 days! 🔥 Consistency is key!', image: null, likes: 234, comments: 23, time: new Date(Date.now() - 7200000).toISOString(), studyHours: 2.5 }
                ];
                samplePosts.forEach(post => DB.savePost(post));
            }
            
            if (DB.getUsers().length === 0) {
                const sampleUsers = [
                    { name: 'Alex Chen', email: 'alex@example.com', password: '123', username: 'alexchen', bio: 'CS Student 🖥️ | AI Enthusiast', followers: 234, following: 189, points: 1250, studyStreak: 7 },
                    { name: 'Current User', email: 'student@focuswell.com', password: '123', username: 'student', bio: 'Learning every day! 📚', followers: 45, following: 67, points: 450, studyStreak: 3 }
                ];
                sampleUsers.forEach(u => DB.saveUser(u));
            }
        }

        // ============ MAIN APP ============
        let currentUser = null;
        let currentScreen = 'home';
        let aiEngine = new StudyAIEngine();
        let timerInterval = null;
        let timerSeconds = 0;
        let isTimerRunning = false;

        async function init() {
            initSampleData();
            await aiEngine.initModel();
            
            const savedUser = DB.getCurrentUser();
            if (savedUser) {
                currentUser = savedUser;
                renderHome();
            } else {
                renderLogin();
            }
        }

        function renderLogin() {
            document.getElementById('app').innerHTML = `
                <div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; background: linear-gradient(135deg, #667eea, #764ba2);">
                    <div style="background: white; border-radius: 24px; padding: 32px; max-width: 400px; width: 100%;">
                        <div style="text-align: center; margin-bottom: 32px;">
                            <div style="width: 80px; height: 80px; background: linear-gradient(135deg, #667eea, #764ba2); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 16px;">
                                <i class="fas fa-brain" style="font-size: 40px; color: white;"></i>
                            </div>
                            <h1 style="font-size: 28px;">FocusWell</h1>
                            <p style="color: #8E8E8E;">Study smarter with AI</p>
                        </div>
                        
                        <form id="loginForm">
                            <input type="email" id="email" placeholder="Email" required style="width: 100%; padding: 12px; margin-bottom: 12px; border: 1px solid #DBDBDB; border-radius: 8px;">
                            <input type="password" id="password" placeholder="Password" required style="width: 100%; padding: 12px; margin-bottom: 16px; border: 1px solid #DBDBDB; border-radius: 8px;">
                            <button type="submit" style="width: 100%; padding: 12px; background: linear-gradient(135deg, #667eea, #764ba2); color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer;">Login</button>
                        </form>
                        
                        <p style="text-align: center; margin-top: 16px;">
                            Demo: student@focuswell.com / 123
                        </p>
                        <p style="text-align: center; margin-top: 8px;">
                            <a href="#" onclick="renderRegister(); return false;" style="color: #405DE6;">Create account</a>
                        </p>
                    </div>
                </div>
            `;
            
            document.getElementById('loginForm').addEventListener('submit', (e) => {
                e.preventDefault();
                const email = document.getElementById('email').value;
                const password = document.getElementById('password').value;
                const user = DB.getUser(email);
                if (user && user.password === password) {
                    currentUser = user;
                    DB.setCurrentUser(user);
                    renderHome();
                } else {
                    alert('Invalid credentials. Try student@focuswell.com / 123');
                }
            });
        }

        function renderRegister() {
            document.getElementById('app').innerHTML = `
                <div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; background: linear-gradient(135deg, #667eea, #764ba2);">
                    <div style="background: white; border-radius: 24px; padding: 32px; max-width: 400px; width: 100%;">
                        <h2 style="text-align: center; margin-bottom: 24px;">Create Account</h2>
                        <form id="registerForm">
                            <input type="text" id="name" placeholder="Full Name" required style="width: 100%; padding: 12px; margin-bottom: 12px; border: 1px solid #DBDBDB; border-radius: 8px;">
                            <input type="email" id="email" placeholder="Email" required style="width: 100%; padding: 12px; margin-bottom: 12px; border: 1px solid #DBDBDB; border-radius: 8px;">
                            <input type="text" id="username" placeholder="Username" required style="width: 100%; padding: 12px; margin-bottom: 12px; border: 1px solid #DBDBDB; border-radius: 8px;">
                            <input type="password" id="password" placeholder="Password" required style="width: 100%; padding: 12px; margin-bottom: 16px; border: 1px solid #DBDBDB; border-radius: 8px;">
                            <button type="submit" style="width: 100%; padding: 12px; background: linear-gradient(135deg, #667eea, #764ba2); color: white; border: none; border-radius: 8px; font-weight: bold;">Sign Up</button>
                        </form>
                        <p style="text-align: center; margin-top: 16px;"><a href="#" onclick="renderLogin(); return false;">Back to Login</a></p>
                    </div>
                </div>
            `;
            
            document.getElementById('registerForm').addEventListener('submit', (e) => {
                e.preventDefault();
                const name = document.getElementById('name').value;
                const email = document.getElementById('email').value;
                const username = document.getElementById('username').value;
                const password = document.getElementById('password').value;
                
                if (DB.getUser(email)) {
                    alert('User already exists!');
                    return;
                }
                
                const newUser = { name, email, username, password, bio: 'Student', followers: 0, following: 0, points: 0, studyStreak: 0, avatar: name[0] };
                DB.saveUser(newUser);
                currentUser = newUser;
                DB.setCurrentUser(newUser);
                renderHome();
            });
        }

        async function renderHome() {
            const posts = DB.getPosts();
            const studySessions = DB.getStudySessions();
            const todaySessions = studySessions.filter(s => new Date(s.time).toDateString() === new Date().toDateString());
            const totalStudyHours = todaySessions.reduce((sum, s) => sum + s.hours, 0);
            
            const aiTip = aiEngine.generateStudyTip(currentUser);
            const studyPattern = aiEngine.analyzeStudyPattern(studySessions);
            
            // Get leaderboard
            const users = DB.getUsers();
            const leaderboard = [...users].sort((a, b) => (b.points || 0) - (a.points || 0)).slice(0, 10);
            
            document.getElementById('app').innerHTML = `
                <div class="main-container">
                    <!-- Stats Dashboard -->
                    <div class="stats-dashboard">
                        <div style="display: flex; justify-content: space-between; align-items: center;">
                            <div>
                                <h3>👋 Hello, ${currentUser.name}!</h3>
                                <p style="opacity: 0.9;">${currentUser.studyStreak || 0} day streak 🔥</p>
                            </div>
                            <div style="text-align: right;">
                                <h2>${totalStudyHours.toFixed(1)}h</h2>
                                <p style="opacity: 0.9;">today</p>
                            </div>
                        </div>
                        <div style="display: flex; gap: 16px; margin-top: 16px;">
                            <div style="flex: 1; background: rgba(255,255,255,0.2); border-radius: 12px; padding: 8px; text-align: center;">
                                <div>🏆</div>
                                <div><strong>${currentUser.points || 0}</strong></div>
                                <div style="font-size: 11px;">Points</div>
                            </div>
                            <div style="flex: 1; background: rgba(255,255,255,0.2); border-radius: 12px; padding: 8px; text-align: center;">
                                <div>👥</div>
                                <div><strong>${currentUser.followers || 0}</strong></div>
                                <div style="font-size: 11px;">Followers</div>
                            </div>
                            <div style="flex: 1; background: rgba(255,255,255,0.2); border-radius: 12px; padding: 8px; text-align: center;">
                                <div>📚</div>
                                <div><strong>${studySessions.length}</strong></div>
                                <div style="font-size: 11px;">Sessions</div>
                            </div>
                        </div>
                    </div>
                    
                    <!-- AI Insight Card -->
                    <div class="ai-insight" onclick="showAIAnalysis()">
                        <div style="display: flex; align-items: center; gap: 12px;">
                            <i class="fas fa-robot" style="font-size: 24px;"></i>
                            <div style="flex: 1;">
                                <strong>AI Study Insight</strong>
                                <p style="font-size: 13px; opacity: 0.9;">${aiTip}</p>
                            </div>
                            <i class="fas fa-chevron-right"></i>
                        </div>
                        ${studyPattern ? `<div style="margin-top: 12px; font-size: 12px; border-top: 1px solid rgba(255,255,255,0.2); padding-top: 8px;">
                            📊 Best study time: ${studyPattern.bestTimeToStudy} | Consistency: ${studyPattern.consistency} days
                        </div>` : ''}
                    </div>
                    
                    <!-- Stories -->
                    <div class="stories-container">
                        <div class="story-item" onclick="showStudyTimer()">
                            <div class="story-ring">
                                <div class="story-ring-inner story-avatar">
                                    <i class="fas fa-stopwatch" style="font-size: 32px;"></i>
                                </div>
                            </div>
                            <span style="font-size: 12px;">Timer</span>
                        </div>
                        <div class="story-item" onclick="showLeaderboard()">
                            <div class="story-ring">
                                <div class="story-ring-inner story-avatar">
                                    <i class="fas fa-trophy" style="font-size: 32px;"></i>
                                </div>
                            </div>
                            <span style="font-size: 12px;">Leaderboard</span>
                        </div>
                        <div class="story-item" onclick="showCreatePost()">
                            <div class="story-ring">
                                <div class="story-ring-inner story-avatar">
                                    <i class="fas fa-plus" style="font-size: 32px;"></i>
                                </div>
                            </div>
                            <span style="font-size: 12px;">Share</span>
                        </div>
                        <div class="story-item" onclick="showProfile()">
                            <div class="story-ring">
                                <div class="story-ring-inner story-avatar">
                                    <i class="fas fa-user" style="font-size: 32px;"></i>
                                </div>
                            </div>
                            <span style="font-size: 12px;">Profile</span>
                        </div>
                    </div>
                    
                    <!-- Posts Feed -->
                    <div id="postsFeed">
                        ${posts.map(post => renderPost(post)).join('')}
                    </div>
                </div>
                
                <!-- Bottom Navigation -->
                <div class="bottom-nav">
                    <div class="nav-item ${currentScreen === 'home' ? 'active' : ''}" onclick="renderHome()">
                        <i class="fas fa-home"></i>
                        <span>Home</span>
                    </div>
                    <div class="nav-item" onclick="showStudyTimer()">
                        <i class="fas fa-stopwatch"></i>
                        <span>Study</span>
                    </div>
                    <div class="nav-item" onclick="showLeaderboard()">
                        <i class="fas fa-chart-line"></i>
                        <span>Rank</span>
                    </div>
                    <div class="nav-item" onclick="showProfile()">
                        <i class="fas fa-user"></i>
                        <span>Profile</span>
                    </div>
                </div>
            `;
        }

        function renderPost(post) {
            const isLiked = false; // Would check user's likes in real implementation
            return `
                <div class="post-card">
                    <div class="post-header">
                        <div class="post-avatar">${post.userAvatar || post.userName[0]}</div>
                        <div class="post-info">
                            <div class="post-name">${post.userName}</div>
                            <div class="post-time">${formatTimeAgo(new Date(post.time))}</div>
                        </div>
                        <div class="post-options">
                            <i class="fas fa-ellipsis-h"></i>
                        </div>
                    </div>
                    <div class="post-image">
                        ${post.image ? `<img src="${post.image}" style="width:100%; height:100%; object-fit:cover;">` : `
                            <div style="text-align: center; padding: 40px;">
                                <i class="fas fa-graduation-cap" style="font-size: 60px; margin-bottom: 16px;"></i>
                                <p style="font-size: 18px;">📚 Studied ${post.studyHours || 2} hours today!</p>
                                <p style="font-size: 14px; margin-top: 8px;">${post.content || 'Keep grinding! 💪'}</p>
                            </div>
                        `}
                    </div>
                    <div class="post-stats">
                        <div class="post-stat" onclick="likePost(${post.id})">
                            <i class="fas fa-heart"></i>
                            <span>${post.likes || 0}</span>
                        </div>
                        <div class="post-stat">
                            <i class="fas fa-comment"></i>
                            <span>${post.comments || 0}</span>
                        </div>
                        <div class="post-stat">
                            <i class="fas fa-book-open"></i>
                            <span>${post.studyHours || 0}h studied</span>
                        </div>
                    </div>
                    <div class="post-caption">
                        <strong>${post.userName}</strong> ${post.content || 'Just finished a productive study session! 🎯'}
                    </div>
                </div>
            `;
        }

        function formatTimeAgo(date) {
            const seconds = Math.floor((new Date() - date) / 1000);
            if (seconds < 60) return `${seconds}s ago`;
            const minutes = Math.floor(seconds / 60);
            if (minutes < 60) return `${minutes}m ago`;
            const hours = Math.floor(minutes / 60);
            if (hours < 24) return `${hours}h ago`;
            return `${Math.floor(hours / 24)}d ago`;
        }

        function showStudyTimer() {
            document.getElementById('app').innerHTML = `
                <div class="main-container">
                    <div class="post-card timer-card">
                        <h2>📚 Study Timer</h2>
                        <div class="timer-display" id="timerDisplay">00:00:00</div>
                        <div style="display: flex; gap: 12px; justify-content: center;">
                            <button class="btn-primary" onclick="startTimer()" style="background: #405DE6; color: white; border: none; padding: 12px 24px; border-radius: 8px; cursor: pointer;">Start</button>
                            <button class="btn-primary" onclick="pauseTimer()" style="background: #E4405F; color: white; border: none; padding: 12px 24px; border-radius: 8px; cursor: pointer;">Pause</button>
                            <button class="btn-primary" onclick="resetTimer()" style="background: #8E8E8E; color: white; border: none; padding: 12px 24px; border-radius: 8px; cursor: pointer;">Reset</button>
                        </div>
                        <div style="margin-top: 24px;">
                            <button class="btn-primary" onclick="completeStudySession()" style="background: #00C851; width: 100%;">✓ Complete Session & Share</button>
                        </div>
                    </div>
                    
                    <div class="ai-insight" style="margin-top: 20px;">
                        <i class="fas fa-lightbulb"></i> AI Tip: Take a 5-minute break every 25 minutes for optimal focus!
                    </div>
                </div>
                <div class="bottom-nav">
                    <div class="nav-item" onclick="renderHome()"><i class="fas fa-home"></i><span>Home</span></div>
                    <div class="nav-item active"><i class="fas fa-stopwatch"></i><span>Study</span></div>
                    <div class="nav-item" onclick="showLeaderboard()"><i class="fas fa-chart-line"></i><span>Rank</span></div>
                    <div class="nav-item" onclick="showProfile()"><i class="fas fa-user"></i><span>Profile</span></div>
                </div>
            `;
            currentScreen = 'timer';
            resetTimer();
        }

        function startTimer() {
            if (!isTimerRunning) {
                isTimerRunning = true;
                timerInterval = setInterval(() => {
                    timerSeconds++;
                    updateTimerDisplay();
                }, 1000);
            }
        }

        function pauseTimer() {
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
                isTimerRunning = false;
            }
        }

        function resetTimer() {
            pauseTimer();
            timerSeconds = 0;
            updateTimerDisplay();
        }

        function updateTimerDisplay() {
            const hours = Math.floor(timerSeconds / 3600);
            const minutes = Math.floor((timerSeconds % 3600) / 60);
            const seconds = timerSeconds % 60;
            const display = `${hours.toString().padStart(2, '0')}:${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
            const timerElement = document.getElementById('timerDisplay');
            if (timerElement) timerElement.textContent = display;
        }

        function completeStudySession() {
            const hours = timerSeconds / 3600;
            if (hours < 0.1) {
                alert("Study for at least 10 minutes to earn points!");
                return;
            }
            
            // Save study session
            const session = {
                time: new Date().toISOString(),
                hours: hours,
                productivity: Math.min(95, Math.floor(60 + hours * 10))
            };
            DB.saveStudySession(session);
            
            // Update user points and streak
            const pointsEarned = Math.floor(hours * 50);
            currentUser.points = (currentUser.points || 0) + pointsEarned;
            currentUser.studyStreak = (currentUser.studyStreak || 0) + 1;
            DB.updateUser(currentUser.email, { points: currentUser.points, studyStreak: currentUser.studyStreak });
            DB.setCurrentUser(currentUser);
            
            // Create post about study session
            const newPost = {
                id: Date.now(),
                userId: currentUser.email,
                userName: currentUser.name,
                userAvatar: currentUser.name[0],
                content: `Just finished a ${hours.toFixed(1)} hour study session! ${pointsEarned} points earned! 🎯`,
                image: null,
                likes: 0,
                comments: 0,
                time: new Date().toISOString(),
                studyHours: hours
            };
            DB.savePost(newPost);
            
            alert(`🎉 Great job! You earned ${pointsEarned} points for studying ${hours.toFixed(1)} hours!`);
            renderHome();
        }

        function showLeaderboard() {
            const users = DB.getUsers();
            const leaderboard = [...users].sort((a, b) => (b.points || 0) - (a.points || 0)).slice(0, 20);
            
            document.getElementById('app').innerHTML = `
                <div class="main-container">
                    <div class="post-card">
                        <h2 style="text-align: center; margin-bottom: 20px;">🏆 Study Leaderboard</h2>
                        ${leaderboard.map((user, index) => `
                            <div class="leaderboard-item">
                                <div class="leaderboard-rank">#${index + 1}</div>
                                <div class="leaderboard-avatar">${user.avatar || user.name[0]}</div>
                                <div style="flex: 1;">
                                    <strong>${user.name}</strong>
                                    <p style="font-size: 12px; color: #8E8E8E;">${user.studyStreak || 0} day streak</p>
                                </div>
                                <div style="text-align: right;">
                                    <strong>${user.points || 0}</strong>
                                    <p style="font-size: 11px;">points</p>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
                <div class="bottom-nav">
                    <div class="nav-item" onclick="renderHome()"><i class="fas fa-home"></i><span>Home</span></div>
                    <div class="nav-item" onclick="showStudyTimer()"><i class="fas fa-stopwatch"></i><span>Study</span></div>
                    <div class="nav-item active"><i class="fas fa-chart-line"></i><span>Rank</span></div>
                    <div class="nav-item" onclick="showProfile()"><i class="fas fa-user"></i><span>Profile</span></div>
                </div>
            `;
            currentScreen = 'leaderboard';
        }

        function showProfile() {
            document.getElementById('app').innerHTML = `
                <div class="main-container">
                    <div class="post-card" style="text-align: center;">
                        <div style="width: 100px; height: 100px; background: linear-gradient(135deg, #667eea, #764ba2); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 16px;">
                            <i class="fas fa-user" style="font-size: 50px; color: white;"></i>
                        </div>
                        <h2>${currentUser.name}</h2>
                        <p style="color: #8E8E8E;">@${currentUser.username || currentUser.name.toLowerCase().replace(' ', '')}</p>
                        <p style="margin: 16px 0;">${currentUser.bio || "Studying to be better every day! 📚"}</p>
                        
                        <div style="display: flex; justify-content: space-around; margin: 20px 0; padding: 16px 0; border-top: 1px solid #DBDBDB; border-bottom: 1px solid #DBDBDB;">
                            <div>
                                <h3>${currentUser.points || 0}</h3>
                                <p style="font-size: 12px;">Points</p>
                            </div>
                            <div>
                                <h3>${currentUser.studyStreak || 0}</h3>
                                <p style="font-size: 12px;">Day Streak</p>
                            </div>
                            <div>
                                <h3>${currentUser.followers || 0}</h3>
                                <p style="font-size: 12px;">Followers</p>
                            </div>
                        </div>
                        
                        <button onclick="logout()" style="width: 100%; padding: 12px; background: #E4405F; color: white; border: none; border-radius: 8px; cursor: pointer; margin-top: 16px;">
                            Logout
                        </button>
                    </div>
                </div>
                <div class="bottom-nav">
                    <div class="nav-item" onclick="renderHome()"><i class="fas fa-home"></i><span>Home</span></div>
                    <div class="nav-item" onclick="showStudyTimer()"><i class="fas fa-stopwatch"></i><span>Study</span></div>
                    <div class="nav-item" onclick="showLeaderboard()"><i class="fas fa-chart-line"></i><span>Rank</span></div>
                    <div class="nav-item active"><i class="fas fa-user"></i><span>Profile</span></div>
                </div>
            `;
            currentScreen = 'profile';
        }

        function showCreatePost() {
            const content = prompt("Share your study progress:", "Just finished a productive study session! 🎯");
            if (content) {
                const newPost = {
                    id: Date.now(),
                    userId: currentUser.email,
                    userName: currentUser.name,
                    userAvatar: currentUser.name[0],
                    content: content,
                    image: null,
                    likes: 0,
                    comments: 0,
                    time: new Date().toISOString(),
                    studyHours: 0
                };
                DB.savePost(newPost);
                renderHome();
            }
        }

        function showAIAnalysis() {
            const sessions = DB.getStudySessions();
            const pattern = aiEngine.analyzeStudyPattern(sessions);
            alert(`🤖 AI Study Analysis\n\n${pattern ? 
                `Best Study Time: ${pattern.bestTimeToStudy}\nTotal Sessions: ${pattern.consistency}\nAvg Productivity: ${Math.round(pattern.averageProductivity)}%\n\nTip: Study during your peak hours for best results!` : 
                "Complete more study sessions for AI insights!"}`);
        }

        function likePost(postId) {
            DB.updatePost(postId, { likes: (DB.getPosts().find(p => p.id === postId)?.likes || 0) + 1 });
            renderHome();
        }

        function logout() {
            DB.clearCurrentUser();
            currentUser = null;
            renderLogin();
        }

        // Make functions global
        window.renderHome = renderHome;
        window.showStudyTimer = showStudyTimer;
        window.showLeaderboard = showLeaderboard;
        window.showProfile = showProfile;
        window.showCreatePost = showCreatePost;
        window.showAIAnalysis = showAIAnalysis;
        window.likePost = likePost;
        window.startTimer = startTimer;
        window.pauseTimer = pauseTimer;
        window.resetTimer = resetTimer;
        window.completeStudySession = completeStudySession;
        window.logout = logout;
        window.renderLogin = renderLogin;
        window.renderRegister = renderRegister;

        // Start app
        init();
    </script>
</body>
</html>
