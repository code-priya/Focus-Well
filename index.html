<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FocusWell Pro | Enterprise AI Study Suite</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.15.0/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/universal-sentence-encoder@1.3.3/dist/use.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #3b82f6;
            --primary-dark: #2563eb;
            --secondary: #8b5cf6;
            --accent: #06b6d4;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --dark: #0f172a;
            --glass: rgba(255, 255, 255, 0.98);
            --glass-dark: rgba(15, 23, 42, 0.85);
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1);
            --shadow-xl: 0 20px 25px -5px rgb(0 0 0 / 0.1);
            --radius: 1rem;
            --radius-lg: 1.5rem;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Premium Animations */
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }

        @keyframes glow {
            0%, 100% { box-shadow: 0 0 5px rgba(59,130,246,0.5); }
            50% { box-shadow: 0 0 20px rgba(59,130,246,0.8); }
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(-20px); }
            to { opacity: 1; transform: translateX(0); }
        }

        /* Glassmorphism Components */
        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-xl);
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .glass-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 25px 35px -12px rgba(0,0,0,0.25);
        }

        .gradient-text {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .btn-premium {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border: none;
            padding: 12px 28px;
            border-radius: 50px;
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }

        .btn-premium:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 25px -5px rgba(59,130,246,0.5);
        }

        .btn-premium::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255,255,255,0.3);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        .btn-premium:hover::before {
            width: 300px;
            height: 300px;
        }

        /* Dashboard Layout */
        .dashboard {
            display: flex;
            min-height: 100vh;
        }

        .sidebar {
            width: 280px;
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(20px);
            border-right: 1px solid rgba(255,255,255,0.1);
            position: fixed;
            height: 100vh;
            display: flex;
            flex-direction: column;
            z-index: 100;
        }

        .main-content {
            flex: 1;
            margin-left: 280px;
            padding: 2rem;
            overflow-y: auto;
        }

        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .stat-card {
            background: linear-gradient(135deg, rgba(255,255,255,0.95), rgba(255,255,255,0.85));
            border-radius: var(--radius-lg);
            padding: 1.5rem;
            position: relative;
            overflow: hidden;
        }

        .stat-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
        }

        /* AI Chat Interface */
        .ai-chat {
            background: rgba(255,255,255,0.95);
            border-radius: var(--radius-lg);
            height: 500px;
            display: flex;
            flex-direction: column;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 1.5rem;
        }

        .message {
            margin-bottom: 1rem;
            display: flex;
            animation: slideIn 0.3s ease;
        }

        .message.ai {
            justify-content: flex-start;
        }

        .message.user {
            justify-content: flex-end;
        }

        .message-bubble {
            max-width: 70%;
            padding: 0.75rem 1rem;
            border-radius: 1rem;
        }

        .message.ai .message-bubble {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }

        .message.user .message-bubble {
            background: #e5e7eb;
            color: #1f2937;
        }

        /* Task Board */
        .task-board {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 1.5rem;
            margin-top: 1.5rem;
        }

        .task-column {
            background: rgba(255,255,255,0.9);
            border-radius: var(--radius);
            padding: 1rem;
        }

        .task-card {
            background: white;
            border-radius: 0.75rem;
            padding: 1rem;
            margin-bottom: 0.75rem;
            box-shadow: var(--shadow-sm);
            transition: all 0.3s;
            cursor: pointer;
        }

        .task-card:hover {
            transform: translateX(5px);
            box-shadow: var(--shadow-md);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .sidebar {
                transform: translateX(-100%);
                transition: transform 0.3s;
            }
            .sidebar.open {
                transform: translateX(0);
            }
            .main-content {
                margin-left: 0;
            }
        }

        /* Loading Spinner */
        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(59,130,246,0.3);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Progress Rings */
        .progress-ring {
            transform: rotate(-90deg);
        }

        .progress-ring-circle {
            transition: stroke-dashoffset 0.35s;
            transform-origin: 50% 50%;
        }
    </style>
</head>
<body>
    <div id="app"></div>

    <script>
        // ============ ADVANCED AI/ML ENGINE ============
        class AdvancedAIModel {
            constructor() {
                this.model = null;
                this.encoder = null;
                this.isInitialized = false;
            }

            async initialize() {
                try {
                    // Load Universal Sentence Encoder for NLP tasks
                    this.encoder = await use.load();
                    this.isInitialized = true;
                    console.log('AI Model initialized successfully');
                } catch (error) {
                    console.warn('Using fallback AI models:', error);
                    this.isInitialized = false;
                }
            }

            async analyzeText(text) {
                if (this.encoder && this.isInitialized) {
                    const embeddings = await this.encoder.embed([text]);
                    const embeddingArray = await embeddings.array();
                    return this.processEmbeddings(embeddingArray[0]);
                }
                return this.fallbackTextAnalysis(text);
            }

            processEmbeddings(embeddings) {
                // Simulate sentiment and intent analysis
                const magnitude = Math.sqrt(embeddings.reduce((sum, val) => sum + val * val, 0));
                return {
                    sentiment: magnitude > 0.5 ? 'positive' : magnitude > 0.2 ? 'neutral' : 'negative',
                    confidence: Math.min(0.95, magnitude),
                    topics: this.extractTopics(embeddings)
                };
            }

            fallbackTextAnalysis(text) {
                const words = text.toLowerCase().split(' ');
                const positiveWords = ['good', 'great', 'excellent', 'amazing', 'productive'];
                const negativeWords = ['bad', 'stressed', 'tired', 'overwhelmed', 'difficult'];
                
                let score = 0;
                words.forEach(word => {
                    if (positiveWords.includes(word)) score += 0.3;
                    if (negativeWords.includes(word)) score -= 0.3;
                });
                
                return {
                    sentiment: score > 0.2 ? 'positive' : score < -0.2 ? 'negative' : 'neutral',
                    confidence: Math.abs(score) + 0.5,
                    topics: ['general']
                };
            }

            extractTopics(embeddings) {
                // Simulate topic extraction
                const topics = ['productivity', 'learning', 'focus'];
                return topics.slice(0, Math.floor(Math.random() * 3) + 1);
            }

            async predictOptimalSchedule(userData) {
                const tasks = userData.tasks || [];
                const completedTasks = tasks.filter(t => t.completed).length;
                const productivityScore = tasks.length ? (completedTasks / tasks.length) * 100 : 75;
                
                // Neural network simulation with weighted factors
                const energyLevel = this.calculateEnergyLevel(userData);
                const focusScore = this.calculateFocusScore(userData);
                
                const optimalHours = Math.min(8, Math.max(1, 
                    (productivityScore / 100) * 4 + 
                    (energyLevel / 100) * 2 + 
                    (focusScore / 100) * 2
                ));
                
                const timeSlots = this.findOptimalTimeSlots(userData);
                
                return {
                    recommendedHours: optimalHours.toFixed(1),
                    optimalTimeSlots: timeSlots,
                    productivityScore: Math.round(productivityScore),
                    energyLevel: Math.round(energyLevel),
                    focusScore: Math.round(focusScore),
                    confidence: 0.85 + (productivityScore / 500)
                };
            }

            calculateEnergyLevel(userData) {
                const moods = userData.moods || [];
                if (moods.length === 0) return 70;
                
                const recentMoods = moods.slice(-7);
                const energyMap = { great: 90, motivated: 85, good: 75, okay: 60, tired: 40, stressed: 35 };
                const avgEnergy = recentMoods.reduce((sum, m) => sum + (energyMap[m.mood] || 60), 0) / recentMoods.length;
                return avgEnergy;
            }

            calculateFocusScore(userData) {
                const tasks = userData.tasks || [];
                const focusBreaks = userData.focusBreaks || [];
                const completedOnTime = tasks.filter(t => t.completed && new Date(t.deadline) > new Date(t.completedAt)).length;
                return tasks.length ? (completedOnTime / tasks.length) * 100 : 65;
            }

            findOptimalTimeSlots(userData) {
                const studyPatterns = userData.studyPatterns || [];
                const productiveHours = [];
                
                for (let hour = 8; hour <= 22; hour++) {
                    let productivity = 70;
                    if (hour >= 9 && hour <= 12) productivity = 85;
                    else if (hour >= 14 && hour <= 17) productivity = 80;
                    else if (hour >= 19 && hour <= 21) productivity = 75;
                    else productivity = 60;
                    
                    if (productivity > 75) {
                        productiveHours.push(`${hour}:00 - ${hour + 1}:00`);
                    }
                }
                
                return productiveHours.slice(0, 3);
            }

            async generatePersonalizedPlan(userData) {
                const schedule = await this.predictOptimalSchedule(userData);
                const learningStyle = this.analyzeLearningStyle(userData);
                const recommendedTechniques = this.getStudyTechniques(learningStyle);
                
                return {
                    dailySchedule: schedule,
                    learningStyle: learningStyle,
                    techniques: recommendedTechniques,
                    estimatedImprovement: `${Math.floor(15 + Math.random() * 20)}%`,
                    aiConfidence: `${Math.floor(schedule.confidence * 100)}%`
                };
            }

            analyzeLearningStyle(userData) {
                const tasks = userData.tasks || [];
                const taskTypes = tasks.map(t => t.type || 'general');
                
                const visualCount = taskTypes.filter(t => t === 'visual').length;
                const readingCount = taskTypes.filter(t => t === 'reading').length;
                const kinestheticCount = taskTypes.filter(t => t === 'practical').length;
                
                if (visualCount > readingCount && visualCount > kinestheticCount) return 'Visual Learner';
                if (readingCount > visualCount && readingCount > kinestheticCount) return 'Reading/Writing Learner';
                if (kinestheticCount > visualCount && kinestheticCount > readingCount) return 'Kinesthetic Learner';
                return 'Mixed Learning Style';
            }

            getStudyTechniques(learningStyle) {
                const techniques = {
                    'Visual Learner': ['Mind Maps', 'Color-Coded Notes', 'Diagrams', 'Video Tutorials'],
                    'Reading/Writing Learner': ['Summarization', 'Flashcards', 'Outline Method', 'Blog Writing'],
                    'Kinesthetic Learner': ['Practice Problems', 'Role-Playing', 'Hands-on Projects', 'Study Groups'],
                    'Mixed Learning Style': ['Pomodoro Technique', 'Active Recall', 'Spaced Repetition', 'Feynman Technique']
                };
                return techniques[learningStyle] || techniques['Mixed Learning Style'];
            }
        }

        // ============ DATA MANAGEMENT ============
        class DataManager {
            constructor() {
                this.dbName = 'FocusWellDB';
                this.dbVersion = 2;
                this.db = null;
            }

            async initDB() {
                return new Promise((resolve, reject) => {
                    const request = indexedDB.open(this.dbName, this.dbVersion);
                    
                    request.onerror = () => reject(request.error);
                    request.onsuccess = () => {
                        this.db = request.result;
                        resolve(this.db);
                    };
                    
                    request.onupgradeneeded = (event) => {
                        const db = event.target.result;
                        if (!db.objectStoreNames.contains('users')) {
                            db.createObjectStore('users', { keyPath: 'email' });
                        }
                        if (!db.objectStoreNames.contains('sessions')) {
                            db.createObjectStore('sessions', { keyPath: 'id', autoIncrement: true });
                        }
                        if (!db.objectStoreNames.contains('analytics')) {
                            db.createObjectStore('analytics', { keyPath: 'timestamp' });
                        }
                    };
                });
            }

            async saveUser(user) {
                const transaction = this.db.transaction(['users'], 'readwrite');
                const store = transaction.objectStore('users');
                return store.put(user);
            }

            async getUser(email) {
                const transaction = this.db.transaction(['users'], 'readonly');
                const store = transaction.objectStore('users');
                return new Promise((resolve, reject) => {
                    const request = store.get(email);
                    request.onsuccess = () => resolve(request.result);
                    request.onerror = () => reject(request.error);
                });
            }

            async getAllUsers() {
                const transaction = this.db.transaction(['users'], 'readonly');
                const store = transaction.objectStore('users');
                return new Promise((resolve, reject) => {
                    const request = store.getAll();
                    request.onsuccess = () => resolve(request.result);
                    request.onerror = () => reject(request.error);
                });
            }
        }

        // ============ COMMERCIAL FEATURES ============
        class AnalyticsEngine {
            static calculateKPIs(userData) {
                const tasks = userData.tasks || [];
                const completedTasks = tasks.filter(t => t.completed);
                const totalStudyTime = tasks.reduce((sum, t) => sum + (t.timeSpent || 0), 0);
                
                return {
                    completionRate: tasks.length ? (completedTasks.length / tasks.length) * 100 : 0,
                    averageTaskTime: completedTasks.length ? totalStudyTime / completedTasks.length : 0,
                    streakScore: this.calculateStreakScore(userData),
                    efficiency: this.calculateEfficiency(userData),
                    recommendations: this.generateRecommendations(userData)
                };
            }

            static calculateStreakScore(userData) {
                const studyDays = userData.studyHistory || [];
                let currentStreak = 0;
                let maxStreak = 0;
                
                for (let i = studyDays.length - 1; i >= 0; i--) {
                    if (studyDays[i].studied) {
                        currentStreak++;
                        maxStreak = Math.max(maxStreak, currentStreak);
                    } else {
                        break;
                    }
                }
                
                return { current: currentStreak, max: maxStreak };
            }

            static calculateEfficiency(userData) {
                const tasks = userData.tasks || [];
                const plannedVsActual = tasks.map(task => {
                    const planned = this.estimateTaskTime(task);
                    const actual = task.timeSpent || planned;
                    return planned / actual;
                });
                
                const avgEfficiency = plannedVsActual.reduce((a, b) => a + b, 0) / plannedVsActual.length;
                return Math.min(1, Math.max(0, avgEfficiency)) * 100;
            }

            static estimateTaskTime(task) {
                const baseTimes = { low: 30, medium: 60, high: 120 };
                return baseTimes[task.priority] || 60;
            }

            static generateRecommendations(userData) {
                const kpis = this.calculateKPIs(userData);
                const recommendations = [];
                
                if (kpis.completionRate < 50) {
                    recommendations.push('Break down large tasks into smaller chunks');
                    recommendations.push('Use the Pomodoro technique for better focus');
                }
                if (kpis.efficiency < 60) {
                    recommendations.push('Eliminate distractions during study sessions');
                    recommendations.push('Create a dedicated study environment');
                }
                if (kpis.streakScore.current < 3) {
                    recommendations.push('Set daily reminders to maintain consistency');
                    recommendations.push('Start with small, achievable goals');
                }
                
                return recommendations;
            }
        }

        // ============ UI RENDERING ============
        let currentUser = null;
        let aiModel = new AdvancedAIModel();
        let dataManager = new DataManager();

        async function init() {
            await dataManager.initDB();
            await aiModel.initialize();
            
            // Check for existing session
            const savedUser = localStorage.getItem('focuswell_current_user');
            if (savedUser) {
                currentUser = JSON.parse(savedUser);
                renderDashboard();
            } else {
                renderLogin();
            }
        }

        function renderLogin() {
            document.getElementById('app').innerHTML = `
                <div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1rem;">
                    <div class="glass-card" style="max-width: 450px; width: 100%; padding: 2.5rem;">
                        <div style="text-align: center; margin-bottom: 2rem;">
                            <div style="width: 80px; height: 80px; background: linear-gradient(135deg, #667eea, #764ba2); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 1rem;">
                                <i class="fas fa-brain" style="font-size: 40px; color: white;"></i>
                            </div>
                            <h1 style="font-size: 2rem; margin-bottom: 0.5rem;">FocusWell Pro</h1>
                            <p class="gradient-text" style="font-weight: 600;">Enterprise AI Study Suite</p>
                        </div>
                        
                        <form id="loginForm">
                            <div style="margin-bottom: 1rem;">
                                <label style="display: block; margin-bottom: 0.5rem; font-weight: 600;">Email</label>
                                <input type="email" id="email" required style="width: 100%; padding: 0.75rem; border: 2px solid #e5e7eb; border-radius: 0.5rem; transition: all 0.3s;">
                            </div>
                            <div style="margin-bottom: 1.5rem;">
                                <label style="display: block; margin-bottom: 0.5rem; font-weight: 600;">Password</label>
                                <input type="password" id="password" required style="width: 100%; padding: 0.75rem; border: 2px solid #e5e7eb; border-radius: 0.5rem;">
                            </div>
                            <button type="submit" class="btn-premium" style="width: 100%;">Login to Dashboard →</button>
                        </form>
                        
                        <p style="text-align: center; margin-top: 1.5rem;">
                            Don't have an account? <a href="#" onclick="renderRegister(); return false;" style="color: var(--primary); text-decoration: none; font-weight: 600;">Start Free Trial</a>
                        </p>
                        
                        <div id="errorMsg" style="color: var(--danger); text-align: center; margin-top: 1rem;"></div>
                    </div>
                </div>
            `;
            
            document.getElementById('loginForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                const email = document.getElementById('email').value;
                const password = document.getElementById('password').value;
                
                const user = await dataManager.getUser(email);
                if (user && user.password === password) {
                    currentUser = user;
                    localStorage.setItem('focuswell_current_user', JSON.stringify(user));
                    renderDashboard();
                } else {
                    document.getElementById('errorMsg').innerText = 'Invalid credentials. Please try again.';
                }
            });
        }

        async function renderRegister() {
            document.getElementById('app').innerHTML = `
                <div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1rem;">
                    <div class="glass-card" style="max-width: 500px; width: 100%; padding: 2.5rem;">
                        <div style="text-align: center; margin-bottom: 2rem;">
                            <i class="fas fa-rocket" style="font-size: 50px; background: linear-gradient(135deg, #667eea, #764ba2); -webkit-background-clip: text; -webkit-text-fill-color: transparent;"></i>
                            <h2 style="margin-top: 1rem;">Start Your AI Journey</h2>
                            <p>Get personalized AI insights and boost productivity</p>
                        </div>
                        
                        <form id="registerForm">
                            <div style="margin-bottom: 1rem;">
                                <label>Full Name</label>
                                <input type="text" id="name" required style="width: 100%; padding: 0.75rem; border: 2px solid #e5e7eb; border-radius: 0.5rem;">
                            </div>
                            <div style="margin-bottom: 1rem;">
                                <label>Email</label>
                                <input type="email" id="email" required style="width: 100%; padding: 0.75rem; border: 2px solid #e5e7eb; border-radius: 0.5rem;">
                            </div>
                            <div style="margin-bottom: 1rem;">
                                <label>Password</label>
                                <input type="password" id="password" required style="width: 100%; padding: 0.75rem; border: 2px solid #e5e7eb; border-radius: 0.5rem;">
                            </div>
                            <div style="margin-bottom: 1.5rem;">
                                <label>Role</label>
                                <select id="role" style="width: 100%; padding: 0.75rem; border: 2px solid #e5e7eb; border-radius: 0.5rem;">
                                    <option value="student">Student</option>
                                    <option value="professional">Professional</option>
                                    <option value="entrepreneur">Entrepreneur</option>
                                </select>
                            </div>
                            <button type="submit" class="btn-premium" style="width: 100%;">Create Account →</button>
                        </form>
                        
                        <p style="text-align: center; margin-top: 1.5rem;">
                            Already have an account? <a href="#" onclick="renderLogin(); return false;" style="color: var(--primary); text-decoration: none; font-weight: 600;">Login</a>
                        </p>
                    </div>
                </div>
            `;
            
            document.getElementById('registerForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                const name = document.getElementById('name').value;
                const email = document.getElementById('email').value;
                const password = document.getElementById('password').value;
                const role = document.getElementById('role').value;
                
                const existingUser = await dataManager.getUser(email);
                if (existingUser) {
                    alert('User already exists. Please login.');
                    return;
                }
                
                const newUser = {
                    name, email, password, role,
                    tasks: [],
                    moods: [],
                    studyHistory: [],
                    focusBreaks: [],
                    createdAt: new Date().toISOString(),
                    subscription: 'trial',
                    analytics: {}
                };
                
                await dataManager.saveUser(newUser);
                currentUser = newUser;
                localStorage.setItem('focuswell_current_user', JSON.stringify(newUser));
                renderDashboard();
            });
        }

        async function renderDashboard() {
            const aiPlan = await aiModel.generatePersonalizedPlan(currentUser);
            const kpis = AnalyticsEngine.calculateKPIs(currentUser);
            
            document.getElementById('app').innerHTML = `
                <div class="dashboard">
                    <aside class="sidebar">
                        <div style="padding: 2rem;">
                            <div style="display: flex; align-items: center; gap: 1rem; margin-bottom: 2rem;">
                                <div style="width: 50px; height: 50px; background: linear-gradient(135deg, #667eea, #764ba2); border-radius: 50%; display: flex; align-items: center; justify-content: center;">
                                    <i class="fas fa-brain" style="color: white;"></i>
                                </div>
                                <div>
                                    <h3 style="color: white;">FocusWell Pro</h3>
                                    <p style="color: #94a3b8; font-size: 0.875rem;">AI-Powered Suite</p>
                                </div>
                            </div>
                            
                            <nav style="display: flex; flex-direction: column; gap: 0.5rem;">
                                <a href="#" onclick="showScreen('dashboard')" class="nav-item" data-screen="dashboard" style="display: flex; align-items: center; gap: 1rem; padding: 0.75rem 1rem; border-radius: 0.5rem; color: white; text-decoration: none; transition: all 0.3s;">
                                    <i class="fas fa-chart-line"></i> Dashboard
                                </a>
                                <a href="#" onclick="showScreen('tasks')" class="nav-item" data-screen="tasks" style="display: flex; align-items: center; gap: 1rem; padding: 0.75rem 1rem; border-radius: 0.5rem; color: white; text-decoration: none;">
                                    <i class="fas fa-tasks"></i> Tasks
                                </a>
                                <a href="#" onclick="showScreen('ai-chat')" class="nav-item" data-screen="ai-chat" style="display: flex; align-items: center; gap: 1rem; padding: 0.75rem 1rem; border-radius: 0.5rem; color: white; text-decoration: none;">
                                    <i class="fas fa-robot"></i> AI Assistant
                                </a>
                                <a href="#" onclick="showScreen('analytics')" class="nav-item" data-screen="analytics" style="display: flex; align-items: center; gap: 1rem; padding: 0.75rem 1rem; border-radius: 0.5rem; color: white; text-decoration: none;">
                                    <i class="fas fa-chart-bar"></i> Analytics
                                </a>
                                <a href="#" onclick="showScreen('wellness')" class="nav-item" data-screen="wellness" style="display: flex; align-items: center; gap: 1rem; padding: 0.75rem 1rem; border-radius: 0.5rem; color: white; text-decoration: none;">
                                    <i class="fas fa-heartbeat"></i> Wellness
                                </a>
                            </nav>
                            
                            <div style="position: absolute; bottom: 2rem; left: 2rem; right: 2rem;">
                                <div style="background: rgba(255,255,255,0.1); border-radius: 0.5rem; padding: 1rem; margin-bottom: 1rem;">
                                    <p style="color: white; font-size: 0.875rem;">Subscription: <strong>${currentUser.subscription === 'trial' ? 'Trial' : 'Premium'}</strong></p>
                                    <div style="width: 100%; height: 4px; background: rgba(255,255,255,0.2); border-radius: 2px; margin-top: 0.5rem;">
                                        <div style="width: ${currentUser.subscription === 'trial' ? '30%' : '100%'}; height: 100%; background: linear-gradient(90deg, #667eea, #764ba2); border-radius: 2px;"></div>
                                    </div>
                                </div>
                                <button onclick="logout()" class="btn-premium" style="width: 100%; background: rgba(239,68,68,0.8);">Logout</button>
                            </div>
                        </div>
                    </aside>
                    
                    <main class="main-content">
                        <!-- Dashboard Screen -->
                        <div id="dashboard-screen" style="display: block;">
                            <div class="stats-grid">
                                <div class="stat-card">
                                    <i class="fas fa-brain" style="font-size: 2rem; color: var(--primary);"></i>
                                    <h3 style="margin-top: 1rem;">AI Productivity Score</h3>
                                    <p style="font-size: 2.5rem; font-weight: bold;">${aiPlan.dailySchedule.productivityScore}</p>
                                    <p>+12% vs last week</p>
                                </div>
                                <div class="stat-card">
                                    <i class="fas fa-clock" style="font-size: 2rem; color: var(--secondary);"></i>
                                    <h3 style="margin-top: 1rem;">Optimal Study Time</h3>
                                    <p style="font-size: 1.5rem; font-weight: bold;">${aiPlan.dailySchedule.recommendedHours} hours</p>
                                    <p>${aiPlan.dailySchedule.optimalTimeSlots[0] || '9:00 - 12:00'}</p>
                                </div>
                                <div class="stat-card">
                                    <i class="fas fa-fire" style="font-size: 2rem; color: var(--warning);"></i>
                                    <h3 style="margin-top: 1rem;">Current Streak</h3>
                                    <p style="font-size: 2.5rem; font-weight: bold;">${kpis.streakScore.current}</p>
                                    <p>Max: ${kpis.streakScore.max} days</p>
                                </div>
                                <div class="stat-card">
                                    <i class="fas fa-chart-line" style="font-size: 2rem; color: var(--success);"></i>
                                    <h3 style="margin-top: 1rem;">Efficiency Rate</h3>
                                    <p style="font-size: 2.5rem; font-weight: bold;">${Math.round(kpis.efficiency)}%</p>
                                    <p>Target: 85%</p>
                                </div>
                            </div>
                            
                            <div class="glass-card" style="padding: 1.5rem; margin-bottom: 1.5rem;">
                                <h3>🤖 AI Personalized Plan</h3>
                                <div style="margin-top: 1rem;">
                                    <p><strong>Learning Style:</strong> ${aiPlan.learningStyle}</p>
                                    <p><strong>Recommended Techniques:</strong> ${aiPlan.techniques.join(', ')}</p>
                                    <p><strong>Expected Improvement:</strong> ${aiPlan.estimatedImprovement}</p>
                                    <p><strong>AI Confidence:</strong> ${aiPlan.aiConfidence}</p>
                                </div>
                            </div>
                            
                            <div class="glass-card" style="padding: 1.5rem;">
                                <h3>📋 Priority Recommendations</h3>
                                <ul style="margin-top: 1rem; list-style: none;">
                                    ${kpis.recommendations.map(rec => `<li style="margin-bottom: 0.5rem;"><i class="fas fa-check-circle" style="color: var(--success); margin-right: 0.5rem;"></i>${rec}</li>`).join('')}
                                </ul>
                            </div>
                        </div>
                        
                        <!-- Tasks Screen -->
                        <div id="tasks-screen" style="display: none;">
                            <div class="glass-card" style="padding: 1.5rem; margin-bottom: 1.5rem;">
                                <h3>➕ Add New Task</h3>
                                <form id="addTaskForm" style="margin-top: 1rem;">
                                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                                        <input type="text" id="taskTitle" placeholder="Task title" required style="padding: 0.75rem; border: 2px solid #e5e7eb; border-radius: 0.5rem;">
                                        <input type="text" id="taskSubject" placeholder="Subject/Category" required style="padding: 0.75rem; border: 2px solid #e5e7eb; border-radius: 0.5rem;">
                                        <input type="date" id="taskDeadline" required style="padding: 0.75rem; border: 2px solid #e5e7eb; border-radius: 0.5rem;">
                                        <select id="taskPriority" style="padding: 0.75rem; border: 2px solid #e5e7eb; border-radius: 0.5rem;">
                                            <option value="low">Low Priority</option>
                                            <option value="medium" selected>Medium Priority</option>
                                            <option value="high">High Priority</option>
                                        </select>
                                    </div>
                                    <button type="submit" class="btn-premium" style="margin-top: 1rem; width: 100%;">Add Task with AI Optimization</button>
                                </form>
                            </div>
                            
                            <div class="task-board" id="taskBoard">
                                ${renderTaskBoard(currentUser.tasks || [])}
                            </div>
                        </div>
                        
                        <!-- AI Chat Screen -->
                        <div id="ai-chat-screen" style="display: none;">
                            <div class="ai-chat">
                                <div class="chat-messages" id="chatMessages">
                                    <div class="message ai">
                                        <div class="message-bubble">
                                            Hello! I'm your AI study assistant. How can I help you today? I can help with study planning, motivation, or answering questions about your progress.
                                        </div>
                                    </div>
                                </div>
                                <div style="padding: 1rem; border-top: 1px solid #e5e7eb; display: flex; gap: 1rem;">
                                    <input type="text" id="chatInput" placeholder="Ask me anything about studying, productivity, or wellness..." style="flex: 1; padding: 0.75rem; border: 2px solid #e5e7eb; border-radius: 0.5rem;">
                                    <button onclick="sendMessage()" class="btn-premium">Send</button>
                                </div>
                            </div>
                        </div>
                        
                        <!-- Analytics Screen -->
                        <div id="analytics-screen" style="display: none;">
                            <div class="glass-card" style="padding: 1.5rem; margin-bottom: 1.5rem;">
                                <h3>📊 Performance Analytics</h3>
                                <canvas id="performanceChart" style="max-height: 400px; margin-top: 1rem;"></canvas>
                            </div>
                            
                            <div class="stats-grid">
                                <div class="stat-card">
                                    <h4>Task Completion Rate</h4>
                                    <p style="font-size: 2rem; font-weight: bold;">${Math.round(kpis.completionRate)}%</p>
                                    <div style="width: 100%; height: 8px; background: #e5e7eb; border-radius: 4px; margin-top: 0.5rem;">
                                        <div style="width: ${kpis.completionRate}%; height: 100%; background: linear-gradient(90deg, var(--primary), var(--secondary)); border-radius: 4px;"></div>
                                    </div>
                                </div>
                                <div class="stat-card">
                                    <h4>Average Task Time</h4>
                                    <p style="font-size: 2rem; font-weight: bold;">${Math.round(kpis.averageTaskTime)} min</p>
                                    <p>Optimal: 45-60 min</p>
                                </div>
                            </div>
                        </div>
                        
                        <!-- Wellness Screen -->
                        <div id="wellness-screen" style="display: none;">
                            <div class="stats-grid">
                                <div class="stat-card">
                                    <i class="fas fa-smile" style="font-size: 2rem;"></i>
                                    <h3>Mood Tracker</h3>
                                    <div style="display: flex; gap: 1rem; margin-top: 1rem;">
                                        <button onclick="logMood('great')" class="mood-btn">😁 Great</button>
                                        <button onclick="logMood('good')" class="mood-btn">🙂 Good</button>
                                        <button onclick="logMood('okay')" class="mood-btn">😐 Okay</button>
                                        <button onclick="logMood('stressed')" class="mood-btn">😫 Stressed</button>
                                    </div>
                                </div>
                                <div class="stat-card">
                                    <i class="fas fa-spa" style="font-size: 2rem;"></i>
                                    <h3>Wellness Tips</h3>
                                    <p>Take a 5-minute break every hour</p>
                                    <p>Stay hydrated throughout the day</p>
                                    <button class="btn-premium" style="margin-top: 1rem;" onclick="startMeditation()">Start Meditation 🧘</button>
                                </div>
                            </div>
                        </div>
                    </main>
                </div>
            `;
            
            // Initialize charts
            initPerformanceChart();
            
            // Setup task form
            document.getElementById('addTaskForm')?.addEventListener('submit', async (e) => {
                e.preventDefault();
                await addTask();
            });
        }
        
        function renderTaskBoard(tasks) {
            const columns = {
                'pending': tasks.filter(t => !t.completed),
                'completed': tasks.filter(t => t.completed)
            };
            
            return `
                <div class="task-column">
                    <h4>📋 Pending Tasks (${columns.pending.length})</h4>
                    ${columns.pending.map(task => `
                        <div class="task-card" onclick="toggleTask('${task.id}')">
                            <strong>${task.title}</strong>
                            <p style="font-size: 0.875rem; color: #6b7280;">${task.subject} • Due: ${task.deadline}</p>
                            <span style="font-size: 0.75rem; padding: 0.25rem 0.5rem; background: ${task.priority === 'high' ? '#fee2e2' : '#e5e7eb'}; border-radius: 0.25rem;">${task.priority}</span>
                        </div>
                    `).join('')}
                </div>
                <div class="task-column">
                    <h4>✅ Completed (${columns.completed.length})</h4>
                    ${columns.completed.map(task => `
                        <div class="task-card" style="opacity: 0.7;">
                            <strong>✓ ${task.title}</strong>
                            <p style="font-size: 0.875rem; color: #6b7280;">Completed with AI assistance</p>
                        </div>
                    `).join('')}
                </div>
            `;
        }
        
        function initPerformanceChart() {
            const ctx = document.getElementById('performanceChart')?.getContext('2d');
            if (ctx) {
                new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: ['Week 1', 'Week 2', 'Week 3', 'Week 4'],
                        datasets: [{
                            label: 'Productivity Score',
                            data: [65, 72, 78, 85],
                            borderColor: '#3b82f6',
                            backgroundColor: 'rgba(59,130,246,0.1)',
                            tension: 0.4,
                            fill: true
                        }, {
                            label: 'Focus Score',
                            data: [70, 75, 80, 82],
                            borderColor: '#8b5cf6',
                            backgroundColor: 'rgba(139,92,246,0.1)',
                            tension: 0.4,
                            fill: true
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: true,
                        plugins: {
                            legend: {
                                position: 'top',
                            }
                        }
                    }
                });
            }
        }
        
        async function addTask() {
            const title = document.getElementById('taskTitle').value;
            const subject = document.getElementById('taskSubject').value;
            const deadline = document.getElementById('taskDeadline').value;
            const priority = document.getElementById('taskPriority').value;
            
            const newTask = {
                id: Date.now().toString(),
                title, subject, deadline, priority,
                completed: false,
                createdAt: new Date().toISOString(),
                timeSpent: 0
            };
            
            currentUser.tasks = currentUser.tasks || [];
            currentUser.tasks.push(newTask);
            await dataManager.saveUser(currentUser);
            localStorage.setItem('focuswell_current_user', JSON.stringify(currentUser));
            
            renderDashboard();
            showScreen('tasks');
        }
        
        window.toggleTask = async (taskId) => {
            const task = currentUser.tasks.find(t => t.id === taskId);
            if (task) {
                task.completed = !task.completed;
                if (task.completed) {
                    task.completedAt = new Date().toISOString();
                }
                await dataManager.saveUser(currentUser);
                localStorage.setItem('focuswell_current_user', JSON.stringify(currentUser));
                renderDashboard();
            }
        };
        
        window.logMood = async (mood) => {
            currentUser.moods = currentUser.moods || [];
            currentUser.moods.push({
                mood,
                date: new Date().toISOString()
            });
            await dataManager.saveUser(currentUser);
            localStorage.setItem('focuswell_current_user', JSON.stringify(currentUser));
            alert(`Mood logged: ${mood}! Your AI assistant notes this for better recommendations.`);
        };
        
        window.sendMessage = async () => {
            const input = document.getElementById('chatInput');
            const message = input.value.trim();
            if (!message) return;
            
            const chatMessages = document.getElementById('chatMessages');
            chatMessages.innerHTML += `
                <div class="message user">
                    <div class="message-bubble">${message}</div>
                </div>
            `;
            
            input.value = '';
            
            // AI Response based on message analysis
            const analysis = await aiModel.analyzeText(message);
            let response = '';
            
            if (message.toLowerCase().includes('study') || message.toLowerCase().includes('plan')) {
                response = `Based on your study patterns, I recommend focusing on ${analysis.topics.join(', ')}. Your optimal study time is in the morning when your energy is highest. Would you like me to create a personalized study schedule?`;
            } else if (message.toLowerCase().includes('stress') || message.toLowerCase().includes('tired')) {
                response = `I notice you're feeling ${analysis.sentiment}. Let me suggest a 5-minute breathing exercise. Take deep breaths: inhale for 4 seconds, hold for 4, exhale for 4. Repeat 5 times. You've got this! 💪`;
            } else {
                response = `Thank you for sharing! Based on my analysis (${Math.round(analysis.confidence * 100)}% confidence), here's my suggestion: Stay consistent with your study habits, take regular breaks, and celebrate small wins. Your dedication will pay off! 🌟`;
            }
            
            setTimeout(() => {
                chatMessages.innerHTML += `
                    <div class="message ai">
                        <div class="message-bubble">${response}</div>
                    </div>
                `;
                chatMessages.scrollTop = chatMessages.scrollHeight;
            }, 500);
        };
        
        window.startMeditation = () => {
            alert("🧘 Guided Meditation\n\n1. Find a comfortable position\n2. Close your eyes\n3. Breathe naturally\n4. Focus on your breath for 2 minutes\n\nYour AI coach is here to support your wellness journey!");
        };
        
        window.showScreen = (screen) => {
            const screens = ['dashboard', 'tasks', 'ai-chat', 'analytics', 'wellness'];
            screens.forEach(s => {
                const element = document.getElementById(`${s}-screen`);
                if (element) element.style.display = 'none';
            });
            document.getElementById(`${screen}-screen`).style.display = 'block';
            
            // Highlight active nav
            document.querySelectorAll('.nav-item').forEach(item => {
                item.style.background = 'transparent';
            });
        };
        
        window.logout = () => {
            localStorage.removeItem('focuswell_current_user');
            currentUser = null;
            renderLogin();
        };
        
        // Export functions to global
        window.renderLogin = renderLogin;
        window.renderRegister = renderRegister;
        window.renderDashboard = renderDashboard;
        window.showScreen = showScreen;
        window.addTask = addTask;
        window.toggleTask = toggleTask;
        window.logMood = logMood;
        window.sendMessage = sendMessage;
        window.startMeditation = startMeditation;
        window.logout = logout;
        
        // Initialize app
        init();
    </script>
</body>
</html>
