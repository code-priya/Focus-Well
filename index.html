            getTasks: () => JSON.parse(localStorage.getItem('focuswell_tasks_v2') || '[]'),
            saveTask: (task) => { const tasks = Storage.getTasks(); tasks.push(task); localStorage.setItem('focuswell_tasks_v2', JSON.stringify(tasks)); },
            updateTask: (taskId, updates) => { const tasks = Storage.getTasks(); const idx = tasks.findIndex(t => t.id === taskId); if(idx !== -1) { tasks[idx] = { ...tasks[idx], ...updates }; localStorage.setItem('focuswell_tasks_v2', JSON.stringify(tasks)); } },
            deleteTask: (taskId) => { let tasks = Storage.getTasks(); tasks = tasks.filter(t => t.id !== taskId); localStorage.setItem('focuswell_tasks_v2', JSON.stringify(tasks)); },
            getFlashcards: () => JSON.parse(localStorage.getItem('focuswell_flashcards_v2') || '[]'),

            saveStudySession: (session) => { const sessions = Storage.getStudySessions(); sessions.push(session); localStorage.setItem('focuswell_sessions_v2', JSON.stringify(sessions.slice(-50))); },
            getQuizzes: () => JSON.parse(localStorage.getItem('focuswell_quizzes_v2') || '[]'),
            saveQuizResult: (result) => { const quizzes = Storage.getQuizzes(); quizzes.push(result); localStorage.setItem('focuswell_quizzes_v2', JSON.stringify(quizzes.slice(-30))); },

        }
        class Chatbot { getResponse(msg) { const m = msg.toLowerCase(); if(m.includes('stress')||m.includes('anxious')) return "💙 Breathe with me: Inhale 4, hold 4, exhale 6. You're not alone. 🌸"; if(m.includes('study tip')) return "📘 Try active recall & spaced repetition. Use flashcards daily! 🧠"; if(m.includes('motivation')) return "🔥 You've already taken the first step. Keep going — small wins build big results!"; if(m.includes('procrastinate')) return "⏳ The 5-minute rule: commit to just 5 minutes. You'll likely continue! 🚀"; return "🤖 I'm your AI study coach! Ask about stress, exams, focus, or just say hi! ✨"; } }

            currentUser.points = (currentUser.points || 0) + points;

        }
        
        function recordStudySession(minutes=null) {
            let mins = minutes;
            if(mins === null){ const input = prompt('How many minutes did you study?', '25'); if(!input || isNaN(parseInt(input))) return; mins = parseInt(input); }
            if(mins > 0){
                const hours = mins/60;
                Storage.saveStudySession({ date: new Date().toISOString(), hours, minutes: mins });
                currentUser.totalFocusMins = (currentUser.totalFocusMins || 0) + mins;

        function renderRegister(){ document.getElementById('app').innerHTML = `<div style="min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px;"><div class="glass-card" style="max-width:440px; width:100%; padding:40px;"><h2 style="text-align:center;">Join FocusWell</h2><form id="registerForm"><input type="text" id="name" placeholder="Full Name" required style="width:100%; padding:14px; margin-bottom:14px; border-radius:60px;"><input type="email" id="email" placeholder="Email" required style="width:100%; padding:14px; margin-bottom:14px; border-radius:60px;"><input type="password" id="password" placeholder="Password" required style="width:100%; padding:14px; margin-bottom:24px; border-radius:60px;"><button type="submit" class="btn-primary" style="width:100%;">Start studying →</button></form><p style="text-align:center; margin-top:20px;"><a href="#" onclick="renderLogin(); return false;">Back to Login</a></p></div></div>`; document.getElementById('registerForm').addEventListener('submit',(e)=>{ e.preventDefault(); const name=document.getElementById('name').value, email=document.getElementById('email').value, password=document.getElementById('password').value; if(Storage.getUser(email)){ alert('User exists'); return; } const newUser={ name, email, password, studyStreak:0, points:0, level:1, xp:0, sleepQuality:7, anxietyLevel:3, totalFocusMins:0 }; Storage.saveUser(newUser); currentUser=newUser; Storage.setCurrent(newUser); renderDashboard(); }); }

        function renderTasks(){ currentScreen='tasks'; const tasks=Storage.getTasks(); document.getElementById('app').innerHTML = getNavHTML('tasks')+`<div class="main-container"><div class="glass-card" style="padding:28px; margin-bottom:24px;"><h3>➕ New Task</h3><form id="taskForm"><input type="text" id="taskTitle" placeholder="e.g., Review chapter 4" required style="width:100%; padding:12px; margin-bottom:12px; border-radius:40px;"><input type="date" id="taskDeadline" required style="width:100%; padding:12px; margin-bottom:12px; border-radius:40px;"><select id="taskPriority"><option value="low">🟢 Low</option><option value="medium" selected>🟡 Medium</option><option value="high">🔴 High</option></select><button type="submit" class="btn-primary" style="margin-top:12px;">Add Task</button></form></div><div class="glass-card" style="padding:28px;"><h3>📋 My Tasks</h3><div id="tasksList">${tasks.length===0?'<p>No tasks. Create one to boost productivity!</p>':tasks.map(task=>`<div class="task-item"><div style="display:flex; gap:12px; align-items:center;"><input type="checkbox" ${task.completed?'checked':''} onchange="toggleTask('${task.id}')"><div><strong style="${task.completed?'text-decoration:line-through; opacity:0.6':''}">${task.title}</strong><div style="font-size:12px;">📅 ${task.deadline} • ${task.priority}</div></div></div><button class="btn-secondary" style="padding:6px 12px;" onclick="deleteTask('${task.id}')">Delete</button></div>`).join('')}</div></div></div>`; document.getElementById('taskForm')?.addEventListener('submit',(e)=>{ e.preventDefault(); const title=document.getElementById('taskTitle').value, deadline=document.getElementById('taskDeadline').value, priority=document.getElementById('taskPriority').value; Storage.saveTask({ id:Date.now().toString(), title, deadline, priority, completed:false, createdAt:new Date().toISOString() }); renderTasks(); }); }

        function renderFlashcards(){ currentScreen='flashcards'; let cards=Storage.getFlashcards(); document.getElementById('app').innerHTML = getNavHTML('flashcards')+`<div class="main-container"><div class="grid-2"><div class="glass-card" style="padding:28px;"><h3>✨ Create Flashcard</h3><form id="flashcardForm"><input type="text" id="cardTopic" placeholder="Topic" required><input type="text" id="cardQuestion" placeholder="Question" required><input type="text" id="cardAnswer" placeholder="Answer" required><button type="submit" class="btn-primary">Save Card</button></form><div style="margin-top:20px;"><h4>Your Cards</h4>${cards.map(c=>`<div style="background:#f1f5f9; margin:8px 0; padding:8px 12px; border-radius:20px; display:flex; justify-content:space-between;"><span><strong>${c.topic}</strong>: ${c.question}</span><button onclick="deleteFlashcardById('${c.id}')" style="background:none; border:none; color:red;">🗑️</button></div>`).join('')}</div></div><div class="glass-card" style="padding:28px; text-align:center;"><h3>🃏 Study Mode</h3>${cards.length>0?`<div class="flashcard" id="flashcardDisplay" onclick="flipCurrentCard()"><div id="flashcardContent"><p style="font-size:20px;">❓ ${cards[currentFlashcardIndex]?.question}</p><p style="font-size:13px;">Click to flip</p></div></div><div style="display:flex; gap:12px; justify-content:center; margin-top:20px;"><button class="btn-secondary" onclick="previousFlashcard()">◀ Prev</button><button class="btn-secondary" onclick="nextFlashcard()">Next ▶</button></div><p>${currentFlashcardIndex+1}/${cards.length}</p>`:'<p>Create your first flashcard above ☝️</p>'}</div></div></div>`; document.getElementById('flashcardForm')?.addEventListener('submit',(e)=>{ e.preventDefault(); Storage.saveFlashcard({ id:Date.now(), topic:document.getElementById('cardTopic').value, question:document.getElementById('cardQuestion').value, answer:document.getElementById('cardAnswer').value }); renderFlashcards(); }); }
        function deleteFlashcardById(id){ let cards=Storage.getFlashcards(); cards=cards.filter(c=>c.id!=id); localStorage.setItem('focuswell_flashcards_v2',JSON.stringify(cards)); if(currentFlashcardIndex>=cards.length-1 && cards.length>0) currentFlashcardIndex=cards.length-1; else if(cards.length===0) currentFlashcardIndex=0; renderFlashcards(); }
