<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>FocusWell | Ultimate AI Study Companion</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --secondary: #8b5cf6;
            --accent: #06b6d4;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --dark: #1e293b;
            --light: #f8fafc;
            --white: #ffffff;
            --shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
            --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.1);
            --radius: 1rem;
        }

        body {
            font-family: 'Nunito', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }

        /* Glass Card */
        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            transition: all 0.3s ease;
            border: 1px solid rgba(255,255,255,0.3);
        }

        .glass-card:hover {
            transform: translateY(-3px);
            box-shadow: var(--shadow-lg);
        }

        /* Navigation */
        .nav-bar {
            background: white;
            border-radius: 50px;
            padding: 12px 24px;
            margin: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: var(--shadow);
            flex-wrap: wrap;
            gap: 10px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 24px;
            font-weight: 800;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .nav-links {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .nav-link {
            cursor: pointer;
            padding: 8px 16px;
            border-radius: 30px;
            transition: all 0.3s;
            font-weight: 600;
            font-size: 14px;
        }

        .nav-link:hover, .nav-link.active {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
        }

        /* Main Container */
        .main-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        /* Grid Layouts */
        .grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; }
        .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
        .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; }

        /* Buttons */
        .btn-primary, .btn-secondary {
            border: none;
            padding: 10px 20px;
            border-radius: 40px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 14px;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
        }

        .btn-secondary {
            background: #e2e8f0;
            color: var(--dark);
        }

        .btn-primary:hover, .btn-secondary:hover {
            transform: scale(1.02);
        }

        /* Welcome Banner */
        .welcome-banner {
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-radius: var(--radius);
            padding: 30px;
            color: white;
            margin-bottom: 24px;
        }

        /* Progress Bar */
        .progress-bar {
            height: 8px;
            background: rgba(255,255,255,0.3);
            border-radius: 4px;
            overflow: hidden;
            margin-top: 10px;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #ffd166, #ff9f1c);
            transition: width 0.5s;
        }

        /* Flashcard */
        .flashcard {
            background: linear-gradient(135deg, #fff, #f0f0ff);
            border-radius: var(--radius);
            padding: 40px 20px;
            text-align: center;
            cursor: pointer;
            min-height: 250px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: var(--shadow);
            transition: all 0.3s;
        }

        .flashcard:hover {
            transform: scale(1.02);
        }

        /* Quiz Option */
        .quiz-option {
            background: #f1f5f9;
            padding: 12px 16px;
            margin: 10px 0;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .quiz-option:hover {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
        }

        /* Timer */
        .pomodoro-timer {
            font-size: 64px;
            font-family: monospace;
            font-weight: bold;
            margin: 20px 0;
        }

        /* Study Room */
        .study-room-card {
            background: linear-gradient(135deg, #1e293b, #0f172a);
            border-radius: var(--radius);
            padding: 30px;
            text-align: center;
            color: white;
            cursor: pointer;
            transition: all 0.3s;
        }

        .study-room-card:hover {
            transform: translateY(-5px);
        }

        /* Achievement Badge */
        .achievement-card {
            text-align: center;
            padding: 20px;
            border-radius: var(--radius);
            background: white;
        }

        .achievement-badge {
            width: 70px;
            height: 70px;
            background: linear-gradient(135deg, #ffd166, #ff9f1c);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            margin: 0 auto 15px;
        }

        /* Responsive */
        @media (max-width: 1000px) {
            .grid-4 { grid-template-columns: repeat(2, 1fr); }
            .grid-3 { grid-template-columns: repeat(2, 1fr); }
        }

        @media (max-width: 768px) {
            .grid-2, .grid-3, .grid-4 { grid-template-columns: 1fr; }
            .nav-links { display: none; }
        }

        /* Chatbot */
        .chatbot-container {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 1000;
        }

        .chatbot-toggle {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: var(--shadow-lg);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .chatbot-window {
            position: absolute;
            bottom: 70px;
            right: 0;
            width: 350px;
            height: 500px;
            background: white;
            border-radius: 20px;
            box-shadow: var(--shadow-lg);
            display: none;
            flex-direction: column;
            overflow: hidden;
        }

        .chatbot-window.open { display: flex; }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
        }

        .message {
            margin-bottom: 12px;
            display: flex;
        }

        .message.bot { justify-content: flex-start; }
        .message.user { justify-content: flex-end; }

        .message-bubble {
            max-width: 80%;
            padding: 10px 14px;
            border-radius: 18px;
            font-size: 13px;
        }

        .message.bot .message-bubble {
            background: #f1f5f9;
            color: var(--dark);
        }

        .message.user .message-bubble {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
        }

        .task-item {
            background: #f8fafc;
            padding: 12px;
            margin: 8px 0;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
        }

        .task-item:hover { background: #e2e8f0; }
    </style>
</head>
<body>
    <div id="app"></div>

    <script>
        // ============ DATA STORAGE ============
        const Storage = {
            getUsers: () => JSON.parse(localStorage.getItem('focuswell_users') || '[]'),
            saveUser: (user) => {
                const users = Storage.getUsers();
                users.push(user);
                localStorage.setItem('focuswell_users', JSON.stringify(users));
            },
            getUser: (email) => Storage.getUsers().find(u => u.email === email),
            updateUser: (email, data) => {
                const users = Storage.getUsers();
                const idx = users.findIndex(u => u.email === email);
                if (idx !== -1) {
                    users[idx] = { ...users[idx], ...data };
                    localStorage.setItem('focuswell_users', JSON.stringify(users));
                }
            },
            getCurrent: () => JSON.parse(localStorage.getItem('focuswell_current')),
            setCurrent: (user) => localStorage.setItem('focuswell_current', JSON.stringify(user)),
            clearCurrent: () => localStorage.removeItem('focuswell_current'),
            
            getTasks: () => JSON.parse(localStorage.getItem('focuswell_tasks') || '[]'),
            saveTask: (task) => {
                const tasks = Storage.getTasks();
                tasks.push(task);
                localStorage.setItem('focuswell_tasks', JSON.stringify(tasks));
            },
            updateTask: (taskId, updates) => {
                const tasks = Storage.getTasks();
                const idx = tasks.findIndex(t => t.id === taskId);
                if (idx !== -1) {
                    tasks[idx] = { ...tasks[idx], ...updates };
                    localStorage.setItem('focuswell_tasks', JSON.stringify(tasks));
                }
            },
            
            getFlashcards: () => JSON.parse(localStorage.getItem('focuswell_flashcards') || '[]'),
            saveFlashcard: (card) => {
                const cards = Storage.getFlashcards();
                cards.push(card);
                localStorage.setItem('focuswell_flashcards', JSON.stringify(cards));
            },
            
            getStudySessions: () => JSON.parse(localStorage.getItem('focuswell_sessions') || '[]'),
            saveStudySession: (session) => {
                const sessions = Storage.getStudySessions();
                sessions.push(session);
                localStorage.setItem('focuswell_sessions', JSON.stringify(sessions.slice(-30)));
            },
            
            getQuizzes: () => JSON.parse(localStorage.getItem('focuswell_quizzes') || '[]'),
            saveQuizResult: (result) => {
                const quizzes = Storage.getQuizzes();
                quizzes.push(result);
                localStorage.setItem('focuswell_quizzes', JSON.stringify(quizzes.slice(-20)));
            }
        };

        // ============ INITIALIZE SAMPLE DATA ============
        function initSampleData() {
            if (Storage.getUsers().length === 0) {
                Storage.saveUser({ name: 'Demo Student', email: 'student@focuswell.com', password: '123', studyStreak: 0, points: 0, level: 1, xp: 0, sleepQuality: 7, anxietyLevel: 3 });
            }
        }

        // ============ STRESS ANALYZER ============
        class StressAnalyzer {
            calculateStressLevel(user) {
                const sleep = user.sleepQuality || 7;
                const anxiety = user.anxietyLevel || 3;
                let score = ((10 - sleep) * 8) + (anxiety * 7);
                score = Math.min(100, Math.max(0, score));
                
                let level = 'low', color = '#10b981', emoji = '😊', advice = "You're doing great! Keep it up! 🌟";
                if (score > 60) { level = 'high'; color = '#ef4444'; emoji = '😰'; advice = "Take a break! Try our breathing exercise. 💙"; }
                else if (score > 30) { level = 'medium'; color = '#f59e0b'; emoji = '😌'; advice = "A short walk might help! 🚶"; }
                
                return { score, level, color, emoji, advice };
            }
        }

        // ============ AI CHATBOT ============
        class Chatbot {
            getResponse(message) {
                const msg = message.toLowerCase();
                if (msg.includes('stress') || msg.includes('anxious')) return "💙 I hear you! Take 5 deep breaths: Inhale 4s, hold 4s, exhale 4s. You've got this! 🌸";
                if (msg.includes('study tip')) return "📚 Try the Pomodoro method: 25 min study, 5 min break. It boosts focus by 50%! 🍅";
                if (msg.includes('motivation')) return "🌟 You are capable of amazing things! Every small step counts toward your dreams! ⭐";
                if (msg.includes('exam')) return "📝 Trust your preparation! Get good sleep, eat well, and stay confident. You'll do great! 🎯";
                if (msg.includes('procrastinate')) return "⏰ Start with just 5 minutes - that's all it takes to build momentum! You can do it! 🚀";
                return "🎓 Hi! I'm your study buddy! Ask me about study tips, stress relief, motivation, or just chat! 💫";
            }
        }

        // ============ MAIN APP ============
        let currentUser = null;
        let currentScreen = 'dashboard';
        let stressAnalyzer = new StressAnalyzer();
        let chatbot = new Chatbot();
        let pomodoroInterval = null;
        let pomodoroSeconds = 25 * 60;
        let isPomodoroRunning = false;
        let currentFlashcardIndex = 0;
        let currentQuiz = null;
        let quizAnswers = [];
        let quizIndex = 0;

        function init() {
            initSampleData();
            const saved = Storage.getCurrent();
            if (saved) {
                currentUser = saved;
                renderDashboard();
            } else {
                renderLogin();
            }
        }

        function renderLogin() {
            document.getElementById('app').innerHTML = `
                <div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px;">
                    <div class="glass-card" style="max-width: 400px; width: 100%; padding: 40px; text-align: center;">
                        <div style="font-size: 60px;">🎓✨</div>
                        <h1 style="font-size: 32px; margin: 15px 0;">FocusWell</h1>
                        <p>Your AI Study Companion</p>
                        <form id="loginForm" style="margin-top: 30px;">
                            <input type="email" id="email" placeholder="Email" required style="width:100%; padding:12px; margin-bottom:12px; border:1px solid #ddd; border-radius:10px;">
                            <input type="password" id="password" placeholder="Password" required style="width:100%; padding:12px; margin-bottom:20px; border:1px solid #ddd; border-radius:10px;">
                            <button type="submit" class="btn-primary" style="width:100%;">Login →</button>
                        </form>
                        <p style="margin-top: 20px;">New? <a href="#" onclick="renderRegister(); return false;" style="color:var(--primary);">Create Account</a></p>
                        <p style="margin-top: 10px; font-size:12px;">Demo: student@focuswell.com / 123</p>
                    </div>
                </div>
            `;
            document.getElementById('loginForm').addEventListener('submit', (e) => {
                e.preventDefault();
                const email = document.getElementById('email').value;
                const pwd = document.getElementById('password').value;
                const user = Storage.getUser(email);
                if (user && user.password === pwd) {
                    currentUser = user;
                    Storage.setCurrent(user);
                    renderDashboard();
                } else {
                    alert('Invalid credentials. Use student@focuswell.com / 123');
                }
            });
        }

        function renderRegister() {
            document.getElementById('app').innerHTML = `
                <div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px;">
                    <div class="glass-card" style="max-width: 400px; width: 100%; padding: 40px;">
                        <h2 style="text-align:center;">Create Account</h2>
                        <form id="registerForm" style="margin-top: 20px;">
                            <input type="text" id="name" placeholder="Full Name" required style="width:100%; padding:12px; margin-bottom:12px; border:1px solid #ddd; border-radius:10px;">
                            <input type="email" id="email" placeholder="Email" required style="width:100%; padding:12px; margin-bottom:12px; border:1px solid #ddd; border-radius:10px;">
                            <input type="password" id="password" placeholder="Password" required style="width:100%; padding:12px; margin-bottom:20px; border:1px solid #ddd; border-radius:10px;">
                            <button type="submit" class="btn-primary" style="width:100%;">Sign Up</button>
                        </form>
                        <p style="text-align:center; margin-top:20px;"><a href="#" onclick="renderLogin(); return false;">Back to Login</a></p>
                    </div>
                </div>
            `;
            document.getElementById('registerForm').addEventListener('submit', (e) => {
                e.preventDefault();
                const name = document.getElementById('name').value;
                const email = document.getElementById('email').value;
                const password = document.getElementById('password').value;
                if (Storage.getUser(email)) { alert('User exists!'); return; }
                const newUser = { name, email, password, studyStreak: 0, points: 0, level: 1, xp: 0, sleepQuality: 7, anxietyLevel: 3 };
                Storage.saveUser(newUser);
                currentUser = newUser;
                Storage.setCurrent(newUser);
                renderDashboard();
            });
        }

        function renderDashboard() {
            const stressData = stressAnalyzer.calculateStressLevel(currentUser);
            const tasks = Storage.getTasks();
            const pendingTasks = tasks.filter(t => !t.completed).length;
            const flashcards = Storage.getFlashcards();
            const sessions = Storage.getStudySessions();
            const todayHours = sessions.filter(s => new Date(s.date).toDateString() === new Date().toDateString()).reduce((sum, s) => sum + s.hours, 0);
            const xpProgress = ((currentUser.xp % 100) / 100) * 100;
            
            document.getElementById('app').innerHTML = `
                <div class="nav-bar">
                    <div class="logo"><span>🎓✨</span><span>FocusWell</span></div>
                    <div class="nav-links">
                        <div class="nav-link ${currentScreen === 'dashboard' ? 'active' : ''}" onclick="renderDashboard()">🏠 Home</div>
                        <div class="nav-link" onclick="renderTasks()">✅ Tasks</div>
                        <div class="nav-link" onclick="renderFlashcards()">🃏 Cards</div>
                        <div class="nav-link" onclick="renderPomodoro()">🍅 Timer</div>
                        <div class="nav-link" onclick="renderQuizzes()">📝 Quiz</div>
                        <div class="nav-link" onclick="renderStudyRoom()">🎮 Study</div>
                        <div class="nav-link" onclick="renderWellness()">💖 Wellness</div>
                        <div class="nav-link" onclick="renderAchievements()">🏆 Awards</div>
                        <div class="nav-link" onclick="logout()">🚪 Exit</div>
                    </div>
                </div>
                
                <div class="main-container">
                    <div class="welcome-banner">
                        <h1>Hello, ${currentUser.name}! 👋</h1>
                        <p>Ready to boost your productivity? Let's study together! 🚀</p>
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 15px; flex-wrap: wrap; gap: 10px;">
                            <div><span style="background:rgba(255,255,255,0.2); padding:5px 12px; border-radius:20px;">🔥 ${currentUser.studyStreak} day streak</span></div>
                            <div><span style="background:rgba(255,255,255,0.2); padding:5px 12px; border-radius:20px;">⭐ ${currentUser.points} points</span></div>
                            <div><span style="background:rgba(255,255,255,0.2); padding:5px 12px; border-radius:20px;">Level ${currentUser.level}</span></div>
                        </div>
                        <div class="progress-bar"><div class="progress-fill" style="width: ${xpProgress}%"></div></div>
                        <p style="margin-top: 5px; font-size:12px;">${currentUser.xp % 100}/100 XP to next level</p>
                    </div>
                    
                    <div class="grid-4">
                        <div class="glass-card" style="padding:20px; text-align:center;">
                            <div style="font-size:36px;">📚</div>
                            <h3>Study Time</h3>
                            <p style="font-size:28px; font-weight:bold;">${todayHours.toFixed(1)}h</p>
                            <p>today</p>
                        </div>
                        <div class="glass-card" style="padding:20px; text-align:center;">
                            <div style="font-size:36px;">✅</div>
                            <h3>Tasks</h3>
                            <p style="font-size:28px; font-weight:bold;">${pendingTasks}</p>
                            <p>pending</p>
                        </div>
                        <div class="glass-card" style="padding:20px; text-align:center;">
                            <div style="font-size:36px;">🃏</div>
                            <h3>Flashcards</h3>
                            <p style="font-size:28px; font-weight:bold;">${flashcards.length}</p>
                            <p>total</p>
                        </div>
                        <div class="glass-card" style="padding:20px; text-align:center; background: linear-gradient(135deg, #ffe8f0, #ffe0f0);">
                            <div style="font-size:36px;">${stressData.emoji}</div>
                            <h3>Stress Level</h3>
                            <p style="font-size:28px; font-weight:bold; color:${stressData.color};">${stressData.score}%</p>
                            <p>${stressData.level}</p>
                        </div>
                    </div>
                    
                    <div class="grid-3" style="margin-top: 20px;">
                        <div class="glass-card" style="padding:20px; cursor:pointer;" onclick="renderStudyTools()">
                            <h3>✨ Generate Study Guide</h3>
                            <p>Create personalized study plans for any topic</p>
                            <button class="btn-primary" style="margin-top:10px;">Create →</button>
                        </div>
                        <div class="glass-card" style="padding:20px; cursor:pointer;" onclick="startQuickQuiz()">
                            <h3>📝 Quick Quiz</h3>
                            <p>Test your knowledge with AI-generated questions</p>
                            <button class="btn-primary" style="margin-top:10px;">Start →</button>
                        </div>
                        <div class="glass-card" style="padding:20px; background: linear-gradient(135deg, #667eea, #764ba2); color:white; cursor:pointer;" onclick="recordStudySession()">
                            <h3>🎯 Log Study Session</h3>
                            <p>Track your progress and earn XP!</p>
                            <button class="btn-primary" style="margin-top:10px; background:white; color:#667eea;">Log Now →</button>
                        </div>
                    </div>
                </div>
                
                <div class="chatbot-container">
                    <div class="chatbot-toggle" onclick="toggleChatbot()"><i class="fas fa-robot" style="font-size:28px; color:white;"></i></div>
                    <div class="chatbot-window" id="chatbotWindow">
                        <div style="background: linear-gradient(135deg, var(--primary), var(--secondary)); padding:15px; color:white; display:flex; justify-content:space-between;">
                            <span>🤖 FocusWell AI</span>
                            <i class="fas fa-times" style="cursor:pointer;" onclick="toggleChatbot()"></i>
                        </div>
                        <div class="chat-messages" id="chatMessages">
                            <div class="message bot"><div class="message-bubble">Hi ${currentUser.name}! I'm your study assistant. Ask me anything about studying! 📚</div></div>
                        </div>
                        <div style="padding:15px; border-top:1px solid #ddd; display:flex; gap:10px;">
                            <input type="text" id="chatInput" placeholder="Type your message..." style="flex:1; padding:10px; border-radius:20px; border:1px solid #ddd;">
                            <button onclick="sendChatMessage()" class="btn-primary" style="padding:10px 15px;">Send</button>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderTasks() {
            currentScreen = 'tasks';
            const tasks = Storage.getTasks();
            
            document.getElementById('app').innerHTML = `
                <div class="nav-bar">
                    <div class="logo">🎓✨ FocusWell</div>
                    <div class="nav-links">
                        <div class="nav-link" onclick="renderDashboard()">🏠 Home</div>
                        <div class="nav-link active">✅ Tasks</div>
                        <div class="nav-link" onclick="renderFlashcards()">🃏 Cards</div>
                        <div class="nav-link" onclick="renderPomodoro()">🍅 Timer</div>
                        <div class="nav-link" onclick="logout()">🚪 Exit</div>
                    </div>
                </div>
                <div class="main-container">
                    <div class="glass-card" style="padding:25px; margin-bottom:20px;">
                        <h3>➕ Add New Task</h3>
                        <form id="taskForm" style="margin-top:15px;">

        function startPomodoro() {
            if (!isPomodoroRunning) {
                isPomodoroRunning = true;
                pomodoroInterval = setInterval(() => {
                    if (pomodoroSeconds > 0) {
                        pomodoroSeconds--;
                        updatePomodoroDisplay();
                    } else {
                        pausePomodoro();
                        alert("🎉 Time's up! Take a 5-minute break!");
                        recordStudySession();
                    }
                }, 1000);
            }
        }

        function pausePomodoro() {
            if (pomodoroInterval) {
                clearInterval(pomodoroInterval);
                pomodoroInterval = null;
                isPomodoroRunning = false;
            }
        }

        function resetPomodoro() {
            pausePomodoro();
            pomodoroSeconds = 25 * 60;
            updatePomodoroDisplay();
        }

        function updatePomodoroDisplay() {
            const minutes = Math.floor(pomodoroSeconds / 60);
            const seconds = pomodoroSeconds % 60;
            const display = document.getElementById('pomodoroDisplay');
            if (display) display.textContent = `${minutes.toString().padStart(2,'0')}:${seconds.toString().padStart(2,'0')}`;
        }
