<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FocusWell Elite | AI & Social Study</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        :root {
            --p: #8B5CF6; --p-soft: #DDD6FE;
            --s: #EC4899; --a: #06B6D4;
            --bg: #F8FAFC; --card: rgba(255, 255, 255, 0.8);
            --text: #1E293B; --grad: linear-gradient(135deg, #8B5CF6 0%, #EC4899 100%);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        
        body { background: #f0f2f5; color: var(--text); overflow-x: hidden; }

        /* Sidebar Layout */
        .app-container { display: flex; min-height: 100vh; }
        
        .sidebar {
            width: 280px; background: white; border-right: 1px solid #e2e8f0;
            padding: 30px 20px; display: flex; flex-direction: column; gap: 10px;
            position: sticky; top: 0; height: 100vh;
        }

        .main-content { flex: 1; padding: 30px; max-width: 1200px; margin: 0 auto; }

        .nav-item {
            padding: 14px 20px; border-radius: 16px; cursor: pointer;
            display: flex; align-items: center; gap: 12px; font-weight: 600;
            color: #64748b; transition: 0.3s;
        }

        .nav-item:hover, .nav-item.active { background: #f5f3ff; color: var(--p); }
        .nav-item.active { background: var(--grad); color: white; }

        /* Modern Glass Cards */
        .card {
            background: var(--card); backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.5); border-radius: 24px;
            padding: 25px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.05);
            margin-bottom: 24px;
        }

        /* Pomodoro Timer */
        .timer-display {
            font-size: 64px; font-weight: 800; color: var(--text);
            text-align: center; margin: 20px 0; font-variant-numeric: tabular-nums;
        }

        /* Leaderboard */
        .leaderboard-item {
            display: flex; align-items: center; justify-content: space-between;
            padding: 12px; border-bottom: 1px solid #f1f5f9;
        }

        .btn {
            padding: 12px 24px; border-radius: 14px; border: none;
            font-weight: 700; cursor: pointer; transition: 0.3s;
        }

        .btn-p { background: var(--grad); color: white; }
        .btn-p:hover { opacity: 0.9; transform: translateY(-2px); }

        /* Animations */
        @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .animate-up { animation: slideUp 0.5s ease forwards; }
    </style>
</head>
<body>

<div id="app"></div>

<script>
    // --- DATABASE & STATE ---
    const DB = {
        save: (key, val) => localStorage.setItem(`fw_${key}`, JSON.stringify(val)),
        get: (key) => JSON.parse(localStorage.getItem(`fw_${key}`)) || null,
        init: () => {
            if (!DB.get('users')) {
                DB.save('users', [
                    { id: 1, name: "Alex Pro", xp: 2500, level: 12, avatar: "🔥" },
                    { id: 2, name: "StudyBee", xp: 1800, level: 8, avatar: "🐝" }
                ]);
            }
        }
    };

    let user = DB.get('current_user') || { name: "New Scholar", xp: 0, level: 1, avatar: "🐣", sessions: [] };
    let timerInterval = null;
    let timeLeft = 25 * 60;

    // --- COMPONENTS ---
    const Sidebar = () => `
        <div class="sidebar">
            <h2 style="font-weight: 800; color: var(--p); margin-bottom: 30px;">
                <i class="fas fa-brain"></i> FocusWell
            </h2>
            <div class="nav-item active" onclick="render('dash')"><i class="fas fa-home"></i> Dashboard</div>
            <div class="nav-item" onclick="render('timer')"><i class="fas fa-stopwatch"></i> Pomodoro</div>
            <div class="nav-item" onclick="render('social')"><i class="fas fa-users"></i> Leaderboard</div>
            <div class="nav-item" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Logout</div>
        </div>
    `;

    // --- VIEWS ---
    function render(view) {
        const app = document.getElementById('app');
        DB.save('current_user', user);

        if (view === 'dash') {
            app.innerHTML = `
                <div class="app-container">
                    ${Sidebar()}
                    <div class="main-content animate-up">
                        <div class="card" style="background: var(--grad); color: white;">
                            <h1>Welcome back, ${user.name}!</h1>
                            <p>Level ${user.level} Scholar • ${user.xp} Total XP</p>
                            <div style="background: rgba(255,255,255,0.2); height: 10px; border-radius: 5px; margin-top: 15px;">
                                <div style="width: ${user.xp % 100}%; background: white; height: 100%; border-radius: 5px;"></div>
                            </div>
                        </div>
                        
                        <div style="display: grid; grid-template-columns: 2fr 1fr; gap: 24px;">
                            <div class="card">
                                <h3><i class="fas fa-chart-line"></i> Productivity Trend</h3>
                                <canvas id="mainChart" style="max-height: 300px;"></canvas>
                            </div>
                            <div class="card">
                                <h3><i class="fas fa-bolt"></i> Daily Goal</h3>
                                <div style="text-align:center; padding: 20px;">
                                    <h2 style="font-size: 40px; color: var(--p);">85%</h2>
                                    <p>Almost there!</p>
                                    <button class="btn btn-p" style="width: 100%; margin-top: 20px;" onclick="addXP(50)">Quick Study (+50 XP)</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            `;
            initChart();
        } 
        
        else if (view === 'timer') {
            app.innerHTML = `
                <div class="app-container">
                    ${Sidebar()}
                    <div class="main-content animate-up" style="display: flex; justify-content: center; align-items: center;">
                        <div class="card" style="width: 100%; max-width: 500px; text-align: center;">
                            <h2 style="color: var(--p)">Focus Timer</h2>
                            <div class="timer-display" id="timerDisp">25:00</div>
                            <div style="display: flex; gap: 10px; justify-content: center;">
                                <button class="btn btn-p" onclick="toggleTimer()">Start / Pause</button>
                                <button class="btn" style="background: #e2e8f0;" onclick="resetTimer()">Reset</button>
                            </div>
                            <p style="margin-top: 20px; color: #64748b;">Complete a session to earn 100 XP</p>
                        </div>
                    </div>
                </div>
            `;
        }

        else if (view === 'social') {
            const users = DB.get('users').sort((a,b) => b.xp - a.xp);
            app.innerHTML = `
                <div class="app-container">
                    ${Sidebar()}
                    <div class="main-content animate-up">
                        <div class="card">
                            <h3><i class="fas fa-trophy" style="color: #fbbf24;"></i> Global Leaderboard</h3>
                            <div style="margin-top: 20px;">
                                ${users.map((u, i) => `
                                    <div class="leaderboard-item">
                                        <span><strong>#${i+1}</strong> ${u.avatar} ${u.name}</span>
                                        <span style="font-weight: 700; color: var(--p);">${u.xp} XP</span>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }
    }

    // --- LOGIC ---
    function addXP(amt) {
        user.xp += amt;
        if (user.xp % 1000 < amt) {
            user.level++;
            confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 } });
        }
        render('dash');
    }

    function toggleTimer() {
        if (timerInterval) {
            clearInterval(timerInterval);
            timerInterval = null;
        } else {
            timerInterval = setInterval(() => {
                timeLeft--;
                updateTimerUI();
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    addXP(100);
                    alert("Focus session complete! +100 XP");
                    resetTimer();
                }
            }, 1000);
        }
    }

    function resetTimer() {
        clearInterval(timerInterval);
        timerInterval = null;
        timeLeft = 25 * 60;
        updateTimerUI();
    }

    function updateTimerUI() {
        const m = Math.floor(timeLeft / 60);
        const s = timeLeft % 60;
        const disp = `${m}:${s < 10 ? '0' : ''}${s}`;
        const el = document.getElementById('timerDisp');
        if (el) el.innerText = disp;
    }

    function initChart() {
        const ctx = document.getElementById('mainChart').getContext('2d');
        new Chart(ctx, {
            type: 'line',
            data: {
                labels: ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'],
                datasets: [{
                    label: 'Focus Hours',
                    data:,
                    borderColor: '#8B5CF6',
                    backgroundColor: 'rgba(139, 92, 246, 0.1)',
                    fill: true,
                    tension: 0.4
                }]
            },
            options: { plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true } } }
        });
    }

    function logout() {
        localStorage.removeItem('fw_current_user');
        location.reload();
    }

    // Initialize
    DB.init();
    render('dash');
</script>
</body>
</html>
