
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>FocusWell | AI Study Ecosystem | Ultimate Student Success</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --secondary: #ec4899;
            --accent: #06b6d4;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --dark: #0f172a;
            --light: #f8fafc;
            --white: #ffffff;
            --shadow: 0 20px 25px -5px rgba(0,0,0,0.1);
            --shadow-lg: 0 25px 50px -12px rgba(0,0,0,0.25);
            --radius: 1.5rem;
        }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: linear-gradient(145deg, #f0f4ff 0%, #e8eeff 100%);
            min-height: 100vh;
            transition: background 0.3s, color 0.3s;
        }
        body.dark-mode { background: linear-gradient(145deg, #0f172a 0%, #1e293b 100%); color: #e2e8f0; }
        body.dark-mode .glass-card, body.dark-mode .nav-bar, body.dark-mode .achievement-card, body.dark-mode .task-item { background: rgba(30, 41, 59, 0.9); color: #e2e8f0; border-color: rgba(255,255,255,0.1); }
        .glass-card {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(12px);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1px solid rgba(255,255,255,0.5);
        }
        .glass-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-lg); }
        .nav-bar {
            background: rgba(255,255,255,0.95);
            border-radius: 80px;
            padding: 12px 32px;
            margin: 20px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: var(--shadow);
            flex-wrap: wrap;
            gap: 12px;
            animation: slideDown 0.5s ease;
        }
        @keyframes slideDown { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
        .logo { display: flex; align-items: center; gap: 10px; font-size: 28px; font-weight: 800; background: linear-gradient(135deg, var(--primary), var(--secondary)); -webkit-background-clip: text; background-clip: text; color: transparent; }
        .nav-link { cursor: pointer; padding: 8px 20px; border-radius: 40px; transition: all 0.2s; font-weight: 600; }
        .nav-link:hover, .nav-link.active { background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color: white; transform: scale(1.05); }
        .btn-primary, .btn-secondary { border: none; padding: 12px 28px; border-radius: 60px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
        .btn-primary { background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color: white; box-shadow: 0 4px 14px rgba(99,102,241,0.4); }
        .btn-primary:hover { transform: scale(1.02); box-shadow: 0 6px 20px rgba(99,102,241,0.6); }
        .welcome-banner {
            background: linear-gradient(135deg, #667eea, #764ba2, #f093fb);
            border-radius: 2rem;
            padding: 32px;
            color: white;
            margin-bottom: 28px;
            position: relative;
            overflow: hidden;
            animation: gradientShift 8s ease infinite;
            background-size: 200% 200%;
        }
        @keyframes gradientShift { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
        .progress-bar { height: 10px; background: rgba(255,255,255,0.3); border-radius: 10px; overflow: hidden; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, #ffd166, #ff9f1c); transition: width 0.5s; border-radius: 10px; }
        .stress-meter {
            background: linear-gradient(135deg, #10b981, #f59e0b, #ef4444);
            border-radius: 20px;
            padding: 4px;
            cursor: pointer;
        }
        .stress-fill { height: 12px; border-radius: 16px; background: white; transition: width 0.3s; }
        .flashcard-3d {
            transform-style: preserve-3d;
            transition: transform 0.6s;
            cursor: pointer;
        }
        .flashcard-3d.flipped { transform: rotateY(180deg); }
        .grid-2, .grid-3, .grid-4 { display: grid; gap: 24px; }
        .grid-2 { grid-template-columns: repeat(2,1fr); }
        .grid-3 { grid-template-columns: repeat(3,1fr); }
        .grid-4 { grid-template-columns: repeat(4,1fr); }
        @media (max-width: 1000px) { .grid-4 { grid-template-columns: repeat(2,1fr); } .grid-3 { grid-template-columns: repeat(2,1fr); } }
        @media (max-width: 768px) { .grid-2, .grid-3, .grid-4 { grid-template-columns: 1fr; } .nav-links { display: none; } }
        .chatbot-container { position: fixed; bottom: 24px; right: 24px; z-index: 1000; }
        .chatbot-toggle { width: 70px; height: 70px; background: linear-gradient(135deg, var(--primary), var(--secondary)); border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: var(--shadow-lg); animation: pulse 2s infinite; }
        @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.08); } }
        .chatbot-window { position: absolute; bottom: 80px; right: 0; width: 380px; height: 550px; background: white; border-radius: 32px; box-shadow: var(--shadow-lg); display: none; flex-direction: column; overflow: hidden; }
        .chatbot-window.open { display: flex; }
        .typing-indicator { display: flex; gap: 4px; padding: 8px; }
        .typing-dot { width: 8px; height: 8px; background: #94a3b8; border-radius: 50%; animation: typing 1.4s infinite; }
        @keyframes typing { 0%,60%,100% { transform: translateY(0); } 30% { transform: translateY(-6px); } }
        .note-card { background: #fff9e8; border-left: 6px solid var(--primary); padding: 16px; border-radius: 20px; margin: 12px 0; }
        .theme-selector { display: flex; gap: 8px; margin-left: 10px; }
        .theme-dot { width: 28px; height: 28px; border-radius: 50%; cursor: pointer; transition: transform 0.2s; border: 2px solid white; }
        .theme-dot:hover { transform: scale(1.1); }
        @keyframes float { 0%,100% { transform: translateY(0px); } 50% { transform: translateY(-10px); } }
        .floating { animation: float 3s ease-in-out infinite; }
    </style>
</head>
<body>
    <div id="app"></div>
    <script>
        // ============ STORAGE ============
        const Storage = {
            getUsers: () => JSON.parse(localStorage.getItem('focuswell_users_v3') || '[]'),
            saveUser: (u) => { const users = Storage.getUsers(); users.push(u); localStorage.setItem('focuswell_users_v3', JSON.stringify(users)); },
            getUser: (email) => Storage.getUsers().find(u => u.email === email),
            updateUser: (email, data) => { const users = Storage.getUsers(); const idx = users.findIndex(u => u.email === email); if(idx !== -1) { users[idx] = { ...users[idx], ...data }; localStorage.setItem('focuswell_users_v3', JSON.stringify(users)); Storage.setCurrent(users[idx]); } },
            getCurrent: () => JSON.parse(localStorage.getItem('focuswell_current_v3')),
            setCurrent: (u) => localStorage.setItem('focuswell_current_v3', JSON.stringify(u)),
            clearCurrent: () => localStorage.removeItem('focuswell_current_v3'),
            getTasks: () => JSON.parse(localStorage.getItem('focuswell_tasks_v3') || '[]'),
            saveTask: (t) => { const tasks = Storage.getTasks(); tasks.push(t); localStorage.setItem('focuswell_tasks_v3', JSON.stringify(tasks)); },
            updateTask: (id, updates) => { const tasks = Storage.getTasks(); const idx = tasks.findIndex(t => t.id === id); if(idx !== -1) { tasks[idx] = { ...tasks[idx], ...updates }; localStorage.setItem('focuswell_tasks_v3', JSON.stringify(tasks)); } },
            deleteTask: (id) => { let tasks = Storage.getTasks(); tasks = tasks.filter(t => t.id !== id); localStorage.setItem('focuswell_tasks_v3', JSON.stringify(tasks)); },
            getFlashcards: () => JSON.parse(localStorage.getItem('focuswell_flashcards_v3') || '[]'),
            saveFlashcard: (c) => { const cards = Storage.getFlashcards(); cards.push(c); localStorage.setItem('focuswell_flashcards_v3', JSON.stringify(cards)); },
            deleteFlashcard: (id) => { let cards = Storage.getFlashcards(); cards = cards.filter(c => c.id !== id); localStorage.setItem('focuswell_flashcards_v3', JSON.stringify(cards)); },
            getStudySessions: () => JSON.parse(localStorage.getItem('focuswell_sessions_v3') || '[]'),
            saveStudySession: (s) => { const sessions = Storage.getStudySessions(); sessions.push(s); localStorage.setItem('focuswell_sessions_v3', JSON.stringify(sessions.slice(-50))); },
            getQuizzes: () => JSON.parse(localStorage.getItem('focuswell_quizzes_v3') || '[]'),
            saveQuizResult: (r) => { const quizzes = Storage.getQuizzes(); quizzes.push(r); localStorage.setItem('focuswell_quizzes_v3', JSON.stringify(quizzes.slice(-30))); },
            getNotes: () => JSON.parse(localStorage.getItem('focuswell_notes') || '[]'),
            saveNote: (n) => { const notes = Storage.getNotes(); notes.push(n); localStorage.setItem('focuswell_notes', JSON.stringify(notes)); },
            deleteNote: (id) => { let notes = Storage.getNotes(); notes = notes.filter(n => n.id !== id); localStorage.setItem('focuswell_notes', JSON.stringify(notes)); },
            getTheme: () => localStorage.getItem('focuswell_theme') || 'light',
            setTheme: (t) => localStorage.setItem('focuswell_theme', t)
        };
        
        if(Storage.getUsers().length === 0){
            Storage.saveUser({ name: 'Sarah Johnson', email: 'sarah@focuswell.com', password: 'study123', studyStreak: 0, points: 520, level: 2, xp: 45, sleepQuality: 6, anxietyLevel: 5, totalFocusMins: 0, stressHistory: [] });
            Storage.saveUser({ name: 'Demo Student', email: 'student@focuswell.com', password: '123', studyStreak: 0, points: 0, level: 1, xp: 0, sleepQuality: 7, anxietyLevel: 3, totalFocusMins: 0, stressHistory: [] });
        }
        
        let currentUser = null, currentScreen = 'dashboard';
        let pomodoroInterval = null, pomodoroSeconds = 25*60, isPomodoroRunning = false;
        let currentFlashcardIndex = 0, currentQuiz = null, quizAnswers = [], quizIndex = 0;
        let speechRecognition = null;
        let currentHighlightColor = '#fef08a';
        
        // AI Chatbot with free API (using OpenRouter demo endpoint fallback to smart local)
        async function getAIResponse(message) {
            try {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 8000);
                const response = await fetch('https://openrouter.ai/api/v1/chat/completions', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'HTTP-Referer': 'https://focuswell.app', 'X-Title': 'FocusWell' },
                    body: JSON.stringify({ model: 'mistralai/mistral-7b-instruct:free', messages: [{ role: 'user', content: message }], max_tokens: 150 }),
                    signal: controller.signal
                }).catch(() => null);
                clearTimeout(timeoutId);
                if(response && response.ok) { const data = await response.json(); return data.choices?.[0]?.message?.content || getLocalResponse(message); }
                return getLocalResponse(message);
            } catch(e) { return getLocalResponse(message); }
        }
        function getLocalResponse(msg) {
            const m = msg.toLowerCase();
            if(m.includes('stress')) return "💙 Try the 4-7-8 breathing technique. Inhale 4s, hold 7s, exhale 8s. Repeat 4 times. Your stress will drop!";
            if(m.includes('study tip')) return "📚 Use active recall & spaced repetition. Create flashcards and test yourself daily!";
            if(m.includes('motivation')) return "🔥 You're doing amazing! Every minute you invest compounds into success!";
            return "🤖 I'm your AI study coach! Tell me about stress, exams, focus, or anything!";
        }
        
        // Stress detection with detailed analysis
        function analyzeStressDetailed(sleep, anxiety) {
            let score = ((10 - sleep) * 8) + (anxiety * 7);
            score = Math.min(100, Math.max(0, score));
            let level = 'Low', color = '#10b981', emoji = '😊', suggestions = [];
            if(score > 65) { level = 'High'; color = '#ef4444'; emoji = '⚠️'; suggestions = ['Take a 10-min walk', 'Practice deep breathing (4-7-8)', 'Listen to calming music', 'Talk to a friend']; }
            else if(score > 35) { level = 'Medium'; color = '#f59e0b'; emoji = '😌'; suggestions = ['Short meditation', 'Stretch breaks', 'Organize tasks', 'Hydrate well']; }
            else { suggestions = ['Keep up the great work!', 'Maintain sleep schedule', 'Stay active']; }
            return { score, level, color, emoji, suggestions };
        }
        
        function addPointsAndXP(points, xpGain) {
            currentUser.points += points;
            currentUser.xp += xpGain;
            let leveledUp = false;
            while(currentUser.xp >= 100) { currentUser.level++; currentUser.xp -= 100; leveledUp = true; }
            Storage.updateUser(currentUser.email, { points: currentUser.points, xp: currentUser.xp, level: currentUser.level });
            if(leveledUp) setTimeout(() => alert(`🎉 LEVEL UP! You're now Level ${currentUser.level}! 🎉`), 100);
        }
        
        // Speech to Text
        function initSpeech() { if(!('webkitSpeechRecognition' in window)) { alert('Speech recognition not supported in this browser'); return null; } const recognition = new webkitSpeechRecognition(); recognition.continuous = false; recognition.interimResults = false; recognition.lang = 'en-US'; return recognition; }
        function startSpeechToText(callback) { const recog = initSpeech(); if(!recog) return; recog.onresult = (event) => { const text = event.results[0][0].transcript; callback(text); }; recog.start(); }
        
        // Text to Speech
        function speakText(text) { const utterance = new SpeechSynthesisUtterance(text); utterance.rate = 0.9; utterance.pitch = 1; window.speechSynthesis.cancel(); window.speechSynthesis.speak(utterance); }
        
        // Note taking & highlighter
        function saveNote(title, content) { Storage.saveNote({ id: Date.now(), title, content, createdAt: new Date().toISOString() }); renderNotes(); }
        
        function renderLogin() { document.getElementById('app').innerHTML = `<div style="min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px;"><div class="glass-card" style="max-width:450px; width:100%; padding:48px; text-align:center;"><div class="floating" style="font-size:80px;">🎓✨</div><h1 style="font-size:40px;">FocusWell</h1><p style="margin:8px 0 24px;">AI-powered study ecosystem for peak performance</p><form id="loginForm"><input type="email" id="email" placeholder="Email" required style="width:100%; padding:14px; margin-bottom:14px; border-radius:60px; border:1px solid #ddd;"><input type="password" id="password" placeholder="Password" required style="width:100%; padding:14px; margin-bottom:24px; border-radius:60px; border:1px solid #ddd;"><button type="submit" class="btn-primary" style="width:100%;">Sign in →</button></form><p style="margin-top:24px;">New? <a href="#" onclick="renderRegister(); return false;" style="color:var(--primary);">Create free account</a></p><p style="margin-top:16px; font-size:13px;">Demo: student@focuswell.com / 123</p></div></div>`; document.getElementById('loginForm').addEventListener('submit',(e)=>{ e.preventDefault(); const email=document.getElementById('email').value, pwd=document.getElementById('password').value; const user=Storage.getUser(email); if(user && user.password===pwd){ currentUser=user; Storage.setCurrent(user); renderDashboard(); } else alert('Invalid credentials'); }); }
        function renderRegister(){ document.getElementById('app').innerHTML = `<div style="min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px;"><div class="glass-card" style="max-width:450px; width:100%; padding:48px;"><h2>Join FocusWell</h2><form id="registerForm"><input type="text" id="name" placeholder="Full Name" required><input type="email" id="email" placeholder="Email" required><input type="password" id="password" placeholder="Password" required><button type="submit" class="btn-primary">Start Learning →</button></form></div></div>`; document.getElementById('registerForm').addEventListener('submit',(e)=>{ e.preventDefault(); const name=document.getElementById('name').value, email=document.getElementById('email').value, password=document.getElementById('password').value; if(Storage.getUser(email)){ alert('User exists'); return; } const newUser={ name, email, password, studyStreak:0, points:0, level:1, xp:0, sleepQuality:7, anxietyLevel:3, totalFocusMins:0, stressHistory:[] }; Storage.saveUser(newUser); currentUser=newUser; Storage.setCurrent(newUser); renderDashboard(); }); }
        
        function renderDashboard() {
            currentScreen='dashboard';
            const stress = analyzeStressDetailed(currentUser.sleepQuality||7, currentUser.anxietyLevel||3);
            const tasks = Storage.getTasks(); const pendingTasks = tasks.filter(t=>!t.completed).length;
            const sessions = Storage.getStudySessions();
            const todayMins = sessions.filter(s=>new Date(s.date).toDateString()===new Date().toDateString()).reduce((sum,s)=>sum+(s.minutes||0),0);
            const xpProgress = ((currentUser.xp % 100) / 100) * 100;
            document.getElementById('app').innerHTML = `
                <div class="nav-bar"><div class="logo"><span>🧠✨</span><span>FocusWell</span></div><div class="theme-selector"><div class="theme-dot" style="background:#f8fafc; border:2px solid #4f46e5;" onclick="setTheme('light')"></div><div class="theme-dot" style="background:#1e293b;" onclick="setTheme('dark')"></div><div class="theme-dot" style="background:#fce7f3;" onclick="setTheme('pink')"></div></div><div class="nav-links">${['dashboard','tasks','notes','flashcards','pomodoro','quizzes','studyroom','wellness','achievements'].map(s=>`<div class="nav-link ${currentScreen===s?'active':''}" onclick="render${s.charAt(0).toUpperCase()+s.slice(1)}()">${s==='dashboard'?'🏠 Home':s==='tasks'?'✅ Tasks':s==='notes'?'📝 Notes':s==='flashcards'?'🃏 Cards':s==='pomodoro'?'🍅 Timer':s==='quizzes'?'📋 Quiz':s==='studyroom'?'🎮 Study':s==='wellness'?'💖 Wellness':'🏆 Awards'}</div>`).join('')}<div class="nav-link" onclick="logout()">🚪 Exit</div></div></div>
                <div class="main-container" style="max-width:1400px; margin:0 auto; padding:20px;">
                    <div class="welcome-banner"><h1>👋 Hello, ${currentUser.name}!</h1><p>Your focused journey continues. Let's achieve greatness! 🚀</p>
                    <div style="display:flex; gap:20px; flex-wrap:wrap; margin-top:18px;"><span>🔥 ${currentUser.studyStreak} day streak</span><span>⭐ ${currentUser.points} points</span><span>🏆 Level ${currentUser.level}</span></div>
                    <div class="progress-bar"><div class="progress-fill" style="width: ${xpProgress}%"></div></div><p>${currentUser.xp % 100}/100 XP to next level</p></div>
                    <div class="grid-4"><div class="glass-card" style="padding:24px; text-align:center;"><div style="font-size:48px;">📖</div><h3>Focus Time</h3><p style="font-size:36px; font-weight:800;">${Math.floor(todayMins/60)}h ${todayMins%60}m</p></div>
                    <div class="glass-card" style="padding:24px; text-align:center;"><div style="font-size:48px;">✅</div><h3>Tasks</h3><p style="font-size:36px;">${pendingTasks}</p></div>
                    <div class="glass-card" style="padding:24px; text-align:center;"><div style="font-size:48px;">🃏</div><h3>Flashcards</h3><p style="font-size:36px;">${Storage.getFlashcards().length}</p></div>
                    <div class="glass-card" style="padding:24px; text-align:center; background:${stress.color}20;"><div style="font-size:48px;">${stress.emoji}</div><h3>Stress Level</h3><div class="stress-meter" style="margin-top:12px;"><div class="stress-fill" style="width: ${stress.score}%; background:${stress.color};"></div></div><p style="font-size:28px; font-weight:700; color:${stress.color};">${stress.score}%</p><p>${stress.level}</p></div></div>
                    <div class="grid-3" style="margin-top:24px;"><div class="glass-card" style="padding:24px;" onclick="generateStudyNote()"><h3>✨ AI Study Note Generator</h3><p>Generate smart notes on any topic</p><button class="btn-primary">Generate →</button></div>
                    <div class="glass-card" style="padding:24px;" onclick="startQuickQuiz()"><h3>📝 Quick Quiz</h3><p>Test knowledge with AI</p><button class="btn-primary">Start →</button></div>
                    <div class="glass-card" style="padding:24px; background:linear-gradient(135deg,#4f46e5,#a855f7); color:white;" onclick="recordStudySession()"><h3>🎯 Log Session</h3><p>Track progress & earn XP</p><button class="btn-primary" style="background:white; color:#4f46e5;">Log Now</button></div></div>
                    <div class="glass-card" style="padding:24px; margin-top:24px;"><h3>📋 Stress Management Tips</h3><div style="display:flex; gap:12px; flex-wrap:wrap;">${stress.suggestions.map(s=>`<span style="background:${stress.color}20; padding:8px 16px; border-radius:40px;">💡 ${s}</span>`).join('')}</div><button class="btn-secondary" onclick="speakText('Your stress level is ${stress.level}. ${stress.suggestions[0]}')">🔊 Read Aloud</button></div>
                </div>
                <div class="chatbot-container"><div class="chatbot-toggle" onclick="toggleChatbot()"><i class="fas fa-robot" style="font-size:32px;"></i></div><div class="chatbot-window" id="chatbotWindow"><div style="background:linear-gradient(135deg,var(--primary),var(--secondary)); padding:16px; color:white;"><span>🤖 FocusWell AI Coach</span><i class="fas fa-times" style="float:right; cursor:pointer;" onclick="toggleChatbot()"></i></div><div class="chat-messages" id="chatMessages" style="flex:1; overflow-y:auto; padding:16px;"><div class="message bot"><div class="message-bubble">Hi! Ask me anything about studying, stress, or motivation! ✨</div></div></div><div style="padding:12px; display:flex; gap:8px;"><input type="text" id="chatInput" placeholder="Type message..." style="flex:1; padding:12px; border-radius:40px;"><button onclick="sendChatMessage()" class="btn-primary">Send</button><button onclick="startSpeechToText((t)=>document.getElementById('chatInput').value=t)" style="background:#f1f5f9; border:none; border-radius:40px; padding:12px;"><i class="fas fa-microphone"></i></button></div></div></div>
            `;
        }
        
        async function generateStudyNote() {
            const topic = prompt("Enter topic for AI notes:", "Machine Learning Basics");
            if(topic) {
                const loading = alert("Generating smart notes... (AI demo)");
                const fakeNote = `📘 ${topic.toUpperCase()} STUDY NOTES\n\n1. Introduction: ${topic} is a fascinating field.\n2. Key Concepts: Core principles include active learning and practice.\n3. Summary: Consistent revision yields mastery.\n✨ Pro tip: Create flashcards from these notes!`;
                Storage.saveNote({ id: Date.now(), title: `${topic} Notes`, content: fakeNote, createdAt: new Date().toISOString() });
                alert(`Notes for "${topic}" saved! Check Notes section.`);
                renderNotes();
            }
        }
        
        function renderNotes() {
            currentScreen='notes';
            const notes = Storage.getNotes();
            document.getElementById('app').innerHTML = getNavHTML('notes')+`<div class="main-container"><div class="glass-card" style="padding:28px;"><h3>📝 Smart Notes & Highlighter</h3><div style="display:flex; gap:12px; margin-bottom:20px;"><button class="btn-primary" onclick="createNewNote()">+ New Note</button><button class="btn-secondary" onclick="speakText(document.getElementById('noteContent')?.innerText || 'No note selected')">🔊 Read Selected</button></div><div id="notesList" style="max-height:300px; overflow-y:auto;">${notes.map(n=>`<div class="note-card" onclick="viewNote('${n.id}')"><strong>${n.title}</strong><p style="font-size:12px;">${new Date(n.createdAt).toLocaleString()}</p><button onclick="event.stopPropagation(); Storage.deleteNote('${n.id}'); renderNotes();">🗑️</button></div>`).join('')}</div><div id="noteViewer" style="margin-top:20px; padding:20px; background:var(--light); border-radius:20px;"><p>Select a note to view or edit</p></div></div></div>`;
        }
        function createNewNote(){ const title=prompt("Note title"); if(title){ const content=prompt("Note content"); if(content) Storage.saveNote({ id:Date.now(), title, content, createdAt:new Date().toISOString() }); renderNotes(); } }
        function viewNote(id){ const note=Storage.getNotes().find(n=>n.id==id); if(note){ document.getElementById('noteViewer').innerHTML=`<h4>${note.title}</h4><div id="noteContent" style="white-space:pre-wrap;">${note.content}</div><div><button class="btn-secondary" onclick="speakText('${note.content}')">🔊 Read</button><button class="btn-secondary" onclick="highlightText()">🟡 Highlight</button></div>`; } }

        function renderTasks(){ currentScreen='tasks'; const tasks=Storage.getTasks(); document.getElementById('app').innerHTML = getNavHTML('tasks')+`<div class="main-container"><div class="glass-card" style="padding:28px;"><h3>➕ New Task</h3><form id="taskForm"><input type="text" id="taskTitle" placeholder="Task" required><input type="date" id="taskDeadline"><select id="taskPriority"><option>Low</option><option selected>Medium</option><option>High</option></select><button type="submit" class="btn-primary">Add</button></form><div id="tasksList">${tasks.map(t=>`<div class="task-item"><input type="checkbox" ${t.completed?'checked':''} onchange="toggleTask('${t.id}')"><span>${t.title}</span><button onclick="deleteTask('${t.id}')">🗑️</button></div>`).join('')}</div></div></div>`; document.getElementById('taskForm')?.addEventListener('submit',(e)=>{ e.preventDefault(); Storage.saveTask({ id:Date.now().toString(), title:document.getElementById('taskTitle').value, deadline:document.getElementById('taskDeadline').value, priority:document.getElementById('taskPriority').value, completed:false }); renderTasks(); }); }
        function toggleTask(id){ const tasks=Storage.getTasks(); const task=tasks.find(t=>t.id===id); if(task){ task.completed=!task.completed; localStorage.setItem('focuswell_tasks_v3',JSON.stringify(tasks)); if(task.completed) addPointsAndXP(10,10); renderTasks(); } }
        function deleteTask(id){ Storage.deleteTask(id); renderTasks(); }
        
        function renderFlashcards(){ currentScreen='flashcards'; let cards=Storage.getFlashcards(); document.getElementById('app').innerHTML = getNavHTML('flashcards')+`<div class="main-container"><div class="grid-2"><div class="glass-card" style="padding:28px;"><h3>Create Card</h3><form id="flashcardForm"><input placeholder="Topic"><input placeholder="Question"><input placeholder="Answer"><button type="submit">Save</button></form><div>${cards.map(c=>`<div>${c.question} <button onclick="deleteFlashcardById('${c.id}')">❌</button></div>`).join('')}</div></div><div class="glass-card" style="padding:28px;"><h3>Study Mode</h3>${cards.length?`<div class="flashcard-3d" id="flashcard3d" onclick="flipCard3d()"><div style="backface-visibility:hidden;"><p>${cards[currentFlashcardIndex]?.question}</p></div><div style="backface-visibility:hidden; transform:rotateY(180deg);"><p>${cards[currentFlashcardIndex]?.answer}</p></div></div><button onclick="nextFlashcard()">Next</button>`:'No cards'}</div></div></div>`; document.getElementById('flashcardForm')?.addEventListener('submit',(e)=>{ e.preventDefault(); const inputs=e.target.querySelectorAll('input'); Storage.saveFlashcard({ id:Date.now(), topic:inputs[0].value, question:inputs[1].value, answer:inputs[2].value }); renderFlashcards(); }); }

        function renderPomodoro(){ currentScreen='pomodoro'; document.getElementById('app').innerHTML = getNavHTML('pomodoro')+`<div class="main-container"><div class="glass-card" style="padding:48px; text-align:center;"><h2>🍅 Focus Timer</h2><div class="pomodoro-timer" style="font-size:72px;" id="pomodoroDisplay">25:00</div><button class="btn-primary" onclick="startPomodoro()">Start</button><button class="btn-secondary" onclick="pausePomodoro()">Pause</button><button class="btn-secondary" onclick="resetPomodoro()">Reset</button><button class="btn-secondary" onclick="speakText('Focus session started')">🔊</button></div></div>`; resetPomodoro(); }
        function startPomodoro(){ if(!isPomodoroRunning){ isPomodoroRunning=true; pomodoroInterval=setInterval(()=>{ if(pomodoroSeconds>0){ pomodoroSeconds--; updatePomodoroDisplay(); } else { pausePomodoro(); alert("Session complete!"); recordStudySession(25); resetPomodoro(); } },1000); } }

        function startQuiz(){ currentQuiz={ questions:[{text:"Best study technique?",options:["Highlighting","Active Recall","Re-reading"],correct:1},{text:"Pomodoro length?",options:["25min","45min"],correct:0},{text:"Stress reducer?",options:["Breathing","Caffeine"],correct:0}] }; quizAnswers=[]; quizIndex=0; renderQuizQuestion(); }
        function renderQuizQuestion(){ if(quizIndex>=currentQuiz.questions.length){ const score=quizAnswers.filter((a,i)=>a===currentQuiz.questions[i].correct).length; addPointsAndXP(score*20,score*15); alert(`Score: ${score}/${currentQuiz.questions.length}`); renderQuizzes(); return; } const q=currentQuiz.questions[quizIndex]; document.getElementById('app').innerHTML = `<div class="main-container"><div class="glass-card"><h3>Question ${quizIndex+1}</h3><p>${q.text}</p>${q.options.map((opt,i)=>`<div class="quiz-option" onclick="answerQuiz(${i})">${opt}</div>`).join('')}</div></div>`; }

        function joinGlobalStudy(){ alert("🌍 You've joined the Global Focus Room! 342 students online. Stay productive!"); }
        function renderWellness(){ currentScreen='wellness'; const stress=analyzeStressDetailed(currentUser.sleepQuality||7, currentUser.anxietyLevel||3); document.getElementById('app').innerHTML = getNavHTML('wellness')+`<div class="main-container"><div class="grid-2"><div class="glass-card"><h3>💖 Wellness Check</h3><label>Sleep (0-10)</label><input type="range" id="sleep" min="0" max="10" value="${currentUser.sleepQuality||7}"><label>Anxiety (0-10)</label><input type="range" id="anxiety" min="0" max="10" value="${currentUser.anxietyLevel||3}"><button class="btn-primary" onclick="updateWellness()">Update</button></div><div class="glass-card"><h3>🧘 Stress Tools</h3><button class="btn-primary" onclick="startBreathing()">🌬️ Breathing Exercise</button><button class="btn-secondary" onclick="showAffirmation()">✨ Affirmation</button><div style="margin-top:20px;"><p>Stress Score: ${stress.score}%</p><p>${stress.suggestions[0]}</p></div></div></div></div>`; }
        function updateWellness(){ currentUser.sleepQuality=parseInt(document.getElementById('sleep').value); currentUser.anxietyLevel=parseInt(document.getElementById('anxiety').value); Storage.updateUser(currentUser.email,{ sleepQuality:currentUser.sleepQuality, anxietyLevel:currentUser.anxietyLevel }); alert("Wellness updated!"); renderDashboard(); }
        function renderAchievements(){ currentScreen='achievements'; const achievements=[{name:"Task Master",earned:Storage.getTasks().some(t=>t.completed)},{name:"Card Creator",earned:Storage.getFlashcards().length>=3},{name:"Focus Streak",earned:(currentUser.studyStreak||0)>=2}]; document.getElementById('app').innerHTML = getNavHTML('achievements')+`<div class="main-container"><div class="grid-3">${achievements.map(a=>`<div class="achievement-card"><div class="achievement-badge">🏆</div><h4>${a.name}</h4>${a.earned?'✅':'🔒'}</div>`).join('')}</div></div>`; }

        function recordStudySession(mins=null){ let m=mins||prompt("Minutes studied?"); if(m){ Storage.saveStudySession({ date:new Date().toISOString(), minutes:parseInt(m), hours:parseInt(m)/60 }); addPointsAndXP(parseInt(m)*1.5, parseInt(m)); alert(`+${parseInt(m)*1.5} points!`); renderDashboard(); } }
