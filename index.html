<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>FocusWell Pro | Enterprise AI Study Suite</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.15.0/dist/tf.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #3b82f6;
            --primary-dark: #2563eb;
            --secondary: #8b5cf6;
            --accent: #06b6d4;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --dark: #0f172a;
            --glass: rgba(255, 255, 255, 0.98);
            --glass-dark: rgba(15, 23, 42, 0.85);
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1);
            --shadow-xl: 0 20px 25px -5px rgb(0 0 0 / 0.1);
            --radius: 1rem;
            --radius-lg: 1.5rem;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Premium Animations */
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(-20px); }
            to { opacity: 1; transform: translateX(0); }
        }

        /* Glassmorphism Components */
        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-xl);
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .glass-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 25px 35px -12px rgba(0,0,0,0.25);
        }

        .gradient-text {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .btn-premium {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border: none;
            padding: 12px 28px;
            border-radius: 50px;
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }

        .btn-premium:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 25px -5px rgba(59,130,246,0.5);
        }

        /* Dashboard Layout */
        .dashboard {
            display: flex;
            min-height: 100vh;
        }

        .sidebar {
            width: 280px;
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(20px);
            border-right: 1px solid rgba(255,255,255,0.1);
            position: fixed;
            height: 100vh;
            display: flex;
            flex-direction: column;
            z-index: 100;
            overflow-y: auto;
        }

        .main-content {
            flex: 1;
            margin-left: 280px;
            padding: 2rem;
            overflow-y: auto;
        }

        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .stat-card {
            background: linear-gradient(135deg, rgba(255,255,255,0.95), rgba(255,255,255,0.85));
            border-radius: var(--radius-lg);
            padding: 1.5rem;
            position: relative;
            overflow: hidden;
            cursor: pointer;
        }

        .stat-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
        }

        /* Task Board */
        .task-board {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 1.5rem;
            margin-top: 1.5rem;
        }

        .task-column {
            background: rgba(255,255,255,0.9);
            border-radius: var(--radius);
            padding: 1rem;
        }

        .task-card {
            background: white;
            border-radius: 0.75rem;
            padding: 1rem;
            margin-bottom: 0.75rem;
            box-shadow: var(--shadow-sm);
            transition: all 0.3s;
            cursor: pointer;
        }

        .task-card:hover {
            transform: translateX(5px);
            box-shadow: var(--shadow-md);
        }

        /* AI Chat */
        .ai-chat {
            background: rgba(255,255,255,0.95);
            border-radius: var(--radius-lg);
            height: 500px;
            display: flex;
            flex-direction: column;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 1.5rem;
        }

        .message {
            margin-bottom: 1rem;
            display: flex;
            animation: slideIn 0.3s ease;
        }

        .message.ai {
            justify-content: flex-start;
        }

        .message.user {
            justify-content: flex-end;
        }

        .message-bubble {
            max-width: 70%;
            padding: 0.75rem 1rem;
            border-radius: 1rem;
        }

        .message.ai .message-bubble {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }

        .message.user .message-bubble {
            background: #e5e7eb;
            color: #1f2937;
        }

        /* Nav Items */
        .nav-item {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 0.75rem 1rem;
            border-radius: 0.5rem;
            color: white;
            text-decoration: none;
            transition: all 0.3s;
            cursor: pointer;
        }

        .nav-item:hover, .nav-item.active {
            background: rgba(99, 102, 241, 0.3);
        }

        /* Mood Buttons */
        .mood-btn {
            padding: 0.5rem 1rem;
            border: none;
            border-radius: 2rem;
            background: #f3f4f6;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 1rem;
        }

        .mood-btn:hover {
            transform: scale(1.05);
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .sidebar {
                transform: translateX(-100%);
                transition: transform 0.3s;
            }
            .sidebar.open {
                transform: translateX(0);
            }
            .main-content {
                margin-left: 0;
            }
        }

        /* Form Styles */
        input, select, textarea {
            width: 100%;
            padding: 0.75rem;
            border: 2px solid #e5e7eb;
            border-radius: 0.5rem;
            font-family: inherit;
            transition: all 0.2s;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(59,130,246,0.1);
        }
    </style>
</head>
<body>
    <div id="app"></div>

    <script>
        // ============ STORAGE MANAGEMENT ============
        const Storage = {
            getUsers: () => JSON.parse(localStorage.getItem('focuswell_pro_users') || '[]'),
            saveUser: (user) => {
                const users = Storage.getUsers();
                users.push(user);
                localStorage.setItem('focuswell_pro_users', JSON.stringify(users));
            },
            getUser: (email) => Storage.getUsers().find(u => u.email === email),
            updateUser: (email, data) => {
                const users = Storage.getUsers();
                const index = users.findIndex(u => u.email === email);
                if (index !== -1) {
                    users[index] = { ...users[index], ...data };
                    localStorage.setItem('focuswell_pro_users', JSON.stringify(users));
                }
            },
            getCurrentUser: () => JSON.parse(localStorage.getItem('focuswell_current_user')),
            setCurrentUser: (user) => localStorage.setItem('focuswell_current_user', JSON.stringify(user)),
            clearCurrentUser: () => localStorage.removeItem('focuswell_current_user')
        };

        // ============ AI ENGINE ============
        class AIEngine {
            static async predictOptimalStudy(userData) {
                const tasks = userData.tasks || [];
                const completed = tasks.filter(t => t.completed).length;
                const total = tasks.length || 1;
                const productivity = (completed / total) * 100;
                
                let hours = 2;
                if (productivity > 80) hours = 3.5;
                else if (productivity > 60) hours = 2.5;
                else if (productivity < 40) hours = 1.5;
                
                const bestTime = this.getBestStudyTime(userData);
                
                return {
                    hours: hours,
                    bestTime: bestTime,
                    productivity: Math.round(productivity),
                    confidence: Math.min(95, 60 + productivity * 0.35)
                };
            }
            
            static getBestStudyTime(userData) {
                const moods = userData.moods || [];
                const morningMoods = moods.filter(m => new Date(m.date).getHours() < 12);
                const afternoonMoods = moods.filter(m => new Date(m.date).getHours() >= 12 && new Date(m.date).getHours() < 17);
                
                const getAvg = (moods) => {
                    if (!moods.length) return 0;
                    const values = { great: 5, good: 4, motivated: 4, okay: 3, tired: 2, stressed: 1 };
                    return moods.reduce((sum, m) => sum + (values[m.mood] || 3), 0) / moods.length;
                };
                
                const morning = getAvg(morningMoods);
                const afternoon = getAvg(afternoonMoods);
                
                if (morning >= afternoon) return "Morning (9 AM - 12 PM)";
                return "Afternoon (2 PM - 5 PM)";
            }
            
            static generateRecommendation(userData) {
                const tasks = userData.tasks || [];
                const pending = tasks.filter(t => !t.completed).length;
                const moods = userData.moods || [];
                const recentStress = moods.slice(-3).filter(m => m.mood === 'stressed').length;
                
                if (pending > 5) {
                    return "📚 You have several pending tasks. Try breaking them into 25-minute focused sessions using the Pomodoro technique!";
                }
                if (recentStress > 2) {
                    return "🧘 I notice you've been feeling stressed. Take a 5-minute break and try our breathing exercise. Your wellbeing matters!";
                }
                if (userData.studyStreak > 5) {
                    return `🔥 Amazing ${userData.studyStreak}-day streak! Keep the momentum going. Remember to celebrate small wins!`;
                }
                return "💪 You're doing great! Focus on one task at a time, and don't forget to take short breaks between study sessions.";
            }
        }

        // ============ AUTHENTICATION ============
        function showLogin() {
            document.getElementById('app').innerHTML = `
                <div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1rem;">
                    <div class="glass-card" style="max-width: 450px; width: 100%; padding: 2.5rem;">
                        <div style="text-align: center; margin-bottom: 2rem;">
                            <div style="width: 80px; height: 80px; background: linear-gradient(135deg, #667eea, #764ba2); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 1rem;">
                                <i class="fas fa-brain" style="font-size: 40px; color: white;"></i>
                            </div>
                            <h1 style="font-size: 2rem; margin-bottom: 0.5rem;">FocusWell Pro</h1>
                            <p class="gradient-text" style="font-weight: 600;">AI-Powered Study Assistant</p>
                        </div>
                        
                        <form id="loginForm">
                            <div style="margin-bottom: 1rem;">
                                <label style="display: block; margin-bottom: 0.5rem; font-weight: 600;">Email</label>
                                <input type="email" id="email" required placeholder="student@example.com">
                            </div>
                            <div style="margin-bottom: 1.5rem;">
                                <label style="display: block; margin-bottom: 0.5rem; font-weight: 600;">Password</label>
                                <input type="password" id="password" required placeholder="••••••">
                            </div>
                            <button type="submit" class="btn-premium" style="width: 100%;">Login to Dashboard →</button>
                        </form>
                        
                        <p style="text-align: center; margin-top: 1.5rem;">
                            New user? <a href="#" onclick="showRegister(); return false;" style="color: var(--primary); text-decoration: none; font-weight: 600;">Create Free Account</a>
                        </p>
                        
                        <div id="errorMsg" style="color: var(--danger); text-align: center; margin-top: 1rem;"></div>
                    </div>
                </div>
            `;
            
            document.getElementById('loginForm').addEventListener('submit', (e) => {
                e.preventDefault();
                const email = document.getElementById('email').value;
                const password = document.getElementById('password').value;
                const user = Storage.getUser(email);
                
                if (user && user.password === password) {
                    Storage.setCurrentUser(user);
                    showDashboard();
                } else {
                    document.getElementById('errorMsg').innerText = 'Invalid email or password';
                }
            });
        }
        
        function showRegister() {
            document.getElementById('app').innerHTML = `
                <div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1rem;">
                    <div class="glass-card" style="max-width: 500px; width: 100%; padding: 2.5rem;">
                        <div style="text-align: center; margin-bottom: 2rem;">
                            <i class="fas fa-rocket" style="font-size: 50px; background: linear-gradient(135deg, #667eea, #764ba2); -webkit-background-clip: text; -webkit-text-fill-color: transparent;"></i>
                            <h2 style="margin-top: 1rem;">Start Your AI Journey</h2>
                            <p>Get personalized AI insights and boost productivity</p>
                        </div>
                        
                        <form id="registerForm">
                            <div style="margin-bottom: 1rem;">
                                <label>Full Name</label>
                                <input type="text" id="name" required placeholder="John Doe">
                            </div>
                            <div style="margin-bottom: 1rem;">
                                <label>Email</label>
                                <input type="email" id="email" required placeholder="student@example.com">
                            </div>
                            <div style="margin-bottom: 1rem;">
                                <label>Password</label>
                                <input type="password" id="password" required placeholder="••••••">
                            </div>
                            <div style="margin-bottom: 1.5rem;">
                                <label>I am a</label>
                                <select id="role">
                                    <option value="student">Student</option>
                                    <option value="professional">Professional</option>
                                    <option value="teacher">Teacher/Educator</option>
                                </select>
                            </div>
                            <button type="submit" class="btn-premium" style="width: 100%;">Create Free Account →</button>
                        </form>
                        
                        <p style="text-align: center; margin-top: 1.5rem;">
                            Already have an account? <a href="#" onclick="showLogin(); return false;" style="color: var(--primary); text-decoration: none; font-weight: 600;">Login</a>
                        </p>
                    </div>
                </div>
            `;
            
            document.getElementById('registerForm').addEventListener('submit', (e) => {
                e.preventDefault();
                const name = document.getElementById('name').value;
                const email = document.getElementById('email').value;
                const password = document.getElementById('password').value;
                const role = document.getElementById('role').value;
                
                if (Storage.getUser(email)) {
                    alert('User already exists. Please login.');
                    return;
                }
                
                const newUser = {
                    name, email, password, role,
                    tasks: [],
                    moods: [],
                    studyStreak: 0,
                    createdAt: new Date().toISOString(),
                    subscription: 'free'
                };
                
                Storage.saveUser(newUser);
                Storage.setCurrentUser(newUser);
                showDashboard();
            });
        }
        
        // ============ DASHBOARD ============
        async function showDashboard() {
            const user = Storage.getCurrentUser();
            if (!user) {
                showLogin();
                return;
            }
            
            const aiPlan = await AIEngine.predictOptimalStudy(user);
            const recommendation = AIEngine.generateRecommendation(user);
            const completedTasks = (user.tasks || []).filter(t => t.completed).length;
            const totalTasks = (user.tasks || []).length;
            const completionRate = totalTasks ? Math.round((completedTasks / totalTasks) * 100) : 0;
            
            document.getElementById('app').innerHTML = `
                <div class="dashboard">
                    <aside class="sidebar">
                        <div style="padding: 2rem;">
                            <div style="display: flex; align-items: center; gap: 1rem; margin-bottom: 2rem;">
                                <div style="width: 50px; height: 50px; background: linear-gradient(135deg, #667eea, #764ba2); border-radius: 50%; display: flex; align-items: center; justify-content: center;">
                                    <i class="fas fa-brain" style="color: white;"></i>
                                </div>
                                <div>
                                    <h3 style="color: white;">FocusWell Pro</h3>
                                    <p style="color: #94a3b8; font-size: 0.875rem;">AI-Powered Suite</p>
                                </div>
                            </div>
                            
                            <nav style="display: flex; flex-direction: column; gap: 0.5rem;">
                                <div class="nav-item active" data-screen="dashboard">
                                    <i class="fas fa-chart-line"></i> Dashboard
                                </div>
                                <div class="nav-item" data-screen="tasks">
                                    <i class="fas fa-tasks"></i> Tasks
                                </div>
                                <div class="nav-item" data-screen="ai-chat">
                                    <i class="fas fa-robot"></i> AI Assistant
                                </div>
                                <div class="nav-item" data-screen="wellness">
                                    <i class="fas fa-heartbeat"></i> Wellness
                                </div>
                            </nav>
                            
                            <div style="position: absolute; bottom: 2rem; left: 2rem; right: 2rem;">
                                <div style="background: rgba(255,255,255,0.1); border-radius: 0.5rem; padding: 1rem; margin-bottom: 1rem;">
                                    <p style="color: white; font-size: 0.875rem;">Account: <strong>${user.subscription === 'free' ? 'Free' : 'Premium'}</strong></p>
                                    <div style="width: 100%; height: 4px; background: rgba(255,255,255,0.2); border-radius: 2px; margin-top: 0.5rem;">
                                        <div style="width: ${user.subscription === 'free' ? '30%' : '100%'}; height: 100%; background: linear-gradient(90deg, #667eea, #764ba2); border-radius: 2px;"></div>
                                    </div>
                                </div>
                                <button onclick="logout()" class="btn-premium" style="width: 100%; background: rgba(239,68,68,0.8);">Logout</button>
                            </div>
                        </div>
                    </aside>
                    
                    <main class="main-content">
                        <!-- Dashboard Screen -->
                        <div id="dashboard-screen" style="display: block;">
                            <div class="stats-grid">
                                <div class="stat-card">
                                    <i class="fas fa-brain" style="font-size: 2rem; color: var(--primary);"></i>
                                    <h3 style="margin-top: 1rem;">AI Productivity Score</h3>
                                    <p style="font-size: 2.5rem; font-weight: bold;">${aiPlan.productivity}</p>
                                    <p>+${Math.floor(Math.random() * 15)}% vs last week</p>
                                </div>
                                <div class="stat-card">
                                    <i class="fas fa-clock" style="font-size: 2rem; color: var(--secondary);"></i>
                                    <h3 style="margin-top: 1rem;">Optimal Study Time</h3>
                                    <p style="font-size: 1.5rem; font-weight: bold;">${aiPlan.hours} hours/day</p>
                                    <p>${aiPlan.bestTime}</p>
                                </div>
                                <div class="stat-card">
                                    <i class="fas fa-fire" style="font-size: 2rem; color: var(--warning);"></i>
                                    <h3 style="margin-top: 1rem;">Study Streak</h3>
                                    <p style="font-size: 2.5rem; font-weight: bold;">${user.studyStreak}</p>
                                    <p>Keep it going! 🔥</p>
                                </div>
                                <div class="stat-card">
                                    <i class="fas fa-check-circle" style="font-size: 2rem; color: var(--success);"></i>
                                    <h3 style="margin-top: 1rem;">Completion Rate</h3>
                                    <p style="font-size: 2.5rem; font-weight: bold;">${completionRate}%</p>
                                    <p>${totalTasks} total tasks</p>
                                </div>
                            </div>
                            
                            <div class="glass-card" style="padding: 1.5rem; margin-bottom: 1.5rem;">
                                <div style="display: flex; align-items: center; gap: 1rem; margin-bottom: 1rem;">
                                    <i class="fas fa-robot" style="font-size: 2rem; color: var(--primary);"></i>
                                    <h3>AI Recommendation</h3>
                                    <span style="background: linear-gradient(135deg, #667eea, #764ba2); padding: 0.25rem 0.75rem; border-radius: 1rem; color: white; font-size: 0.75rem;">${Math.round(aiPlan.confidence)}% confident</span>
                                </div>
                                <p>${recommendation}</p>
                            </div>
                            
                            <div class="glass-card" style="padding: 1.5rem;">
                                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
                                    <h3>📋 Recent Tasks</h3>
                                    <button class="btn-premium" style="padding: 0.5rem 1rem;" onclick="document.querySelector('[data-screen=\\'tasks\\']').click()">+ Add Task</button>
                                </div>
                                <div id="recentTasks">
                                    ${renderTaskList((user.tasks || []).slice(0, 5))}
                                </div>
                            </div>
                        </div>
                        
                        <!-- Tasks Screen -->
                        <div id="tasks-screen" style="display: none;">
                            <div class="glass-card" style="padding: 1.5rem; margin-bottom: 1.5rem;">
                                <h3>➕ Create New Task</h3>
                                <form id="addTaskForm" style="margin-top: 1rem;">
                                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1rem;">
                                        <input type="text" id="taskTitle" placeholder="Task title" required>
                                        <input type="text" id="taskSubject" placeholder="Subject/Category" required>
                                        <input type="date" id="taskDeadline" required>
                                        <select id="taskPriority">
                                            <option value="low">Low Priority</option>
                                            <option value="medium" selected>Medium Priority</option>
                                            <option value="high">High Priority</option>
                                        </select>
                                    </div>
                                    <button type="submit" class="btn-premium" style="width: 100%;">Add Task with AI Optimization</button>
                                </form>
                            </div>
                            
                            <div class="task-board">
                                <div class="task-column">
                                    <h4>📋 Pending Tasks</h4>
                                    <div id="pendingTasks">
                                        ${renderTaskList((user.tasks || []).filter(t => !t.completed))}
                                    </div>
                                </div>
                                <div class="task-column">
                                    <h4>✅ Completed Tasks</h4>
                                    <div id="completedTasks">
                                        ${renderTaskList((user.tasks || []).filter(t => t.completed))}
                                    </div>
                                </div>
                            </div>
                        </div>
                        
                        <!-- AI Chat Screen -->
                        <div id="ai-chat-screen" style="display: none;">
                            <div class="ai-chat">
                                <div class="chat-messages" id="chatMessages">
                                    <div class="message ai">
                                        <div class="message-bubble">
                                            👋 Hello! I'm your AI study assistant. I can help you with:<br>
                                            • Study planning and scheduling<br>
                                            • Motivation and productivity tips<br>
                                            • Breaking down complex tasks<br>
                                            • Stress management techniques<br><br>
                                            How can I help you today?
                                        </div>
                                    </div>
                                </div>
                                <div style="padding: 1rem; border-top: 1px solid #e5e7eb; display: flex; gap: 1rem;">
                                    <input type="text" id="chatInput" placeholder="Ask me anything about studying, productivity, or wellness..." style="flex: 1;">
                                    <button onclick="sendChatMessage()" class="btn-premium">Send</button>
                                </div>
                            </div>
                        </div>
                        
                        <!-- Wellness Screen -->
                        <div id="wellness-screen" style="display: none;">
                            <div class="stats-grid">
                                <div class="stat-card">
                                    <i class="fas fa-smile" style="font-size: 2rem;"></i>
                                    <h3>How are you feeling?</h3>
                                    <div style="display: flex; gap: 0.5rem; margin-top: 1rem; flex-wrap: wrap;">
                                        <button onclick="logMood('great')" class="mood-btn">😁 Great</button>
                                        <button onclick="logMood('good')" class="mood-btn">🙂 Good</button>
                                        <button onclick="logMood('okay')" class="mood-btn">😐 Okay</button>
                                        <button onclick="logMood('tired')" class="mood-btn">😴 Tired</button>
                                        <button onclick="logMood('stressed')" class="mood-btn">😰 Stressed</button>
                                        <button onclick="logMood('motivated')" class="mood-btn">🚀 Motivated</button>
                                    </div>
                                    <div id="moodFeedback" style="margin-top: 1rem;"></div>
                                </div>
                                
                                <div class="stat-card">
                                    <i class="fas fa-chart-line" style="font-size: 2rem;"></i>
                                    <h3>Mood History</h3>
                                    <div id="moodHistory" style="max-height: 200px; overflow-y: auto;">
                                        ${renderMoodHistory((user.moods || []).slice(-7))}
                                    </div>
                                </div>
                                
                                <div class="stat-card">
                                    <i class="fas fa-spa" style="font-size: 2rem;"></i>
                                    <h3>Wellness Tools</h3>
                                    <button onclick="startBreathing()" class="btn-premium" style="width: 100%; margin-bottom: 0.5rem;">🧘 Breathing Exercise</button>
                                    <button onclick="showAffirmation()" class="btn-premium" style="width: 100%; margin-bottom: 0.5rem;">💭 Daily Affirmation</button>
                                    <button onclick="playFocusMusic()" class="btn-premium" style="width: 100%;">🎵 Focus Music</button>
                                </div>
                            </div>
                            
                            <div class="glass-card" style="padding: 1.5rem; margin-top: 1.5rem;">
                                <h3>💡 Wellness Tips from AI</h3>
                                <ul style="margin-top: 1rem; list-style: none;">
                                    <li style="margin-bottom: 0.75rem;">✓ Take a 5-minute break every 45 minutes of study</li>
                                    <li style="margin-bottom: 0.75rem;">✓ Stay hydrated - keep water nearby</li>
                                    <li style="margin-bottom: 0.75rem;">✓ Use the 5-4-3-2-1 grounding technique when stressed</li>
                                    <li style="margin-bottom: 0.75rem;">✓ Get 7-8 hours of sleep for better memory retention</li>
                                </ul>
                            </div>
                        </div>
                    </main>
                </div>
            `;
            
            // Setup navigation
            document.querySelectorAll('.nav-item').forEach(item => {
                item.addEventListener('click', () => {
                    const screen = item.dataset.screen;
                    document.querySelectorAll('.nav-item').forEach(nav => nav.classList.remove('active'));
                    item.classList.add('active');
                    document.querySelectorAll('#dashboard-screen, #tasks-screen, #ai-chat-screen, #wellness-screen').forEach(s => {
                        s.style.display = 'none';
                    });
                    document.getElementById(`${screen}-screen`).style.display = 'block';
                });
            });
            
            // Setup task form
            document.getElementById('addTaskForm')?.addEventListener('submit', async (e) => {
                e.preventDefault();
                await addTask();
            });
        }
        
        function renderTaskList(tasks) {
            if (!tasks || tasks.length === 0) {
                return '<p style="color: #9ca3af; text-align: center;">No tasks yet. Create your first task!</p>';
            }
            
            return tasks.map(task => `
                <div class="task-card" onclick="toggleTask('${task.id}')">
                    <div style="display: flex; justify-content: space-between; align-items: start;">
                        <div>
                            <strong>${escapeHtml(task.title)}</strong>
                            <p style="font-size: 0.875rem; color: #6b7280; margin-top: 0.25rem;">${task.subject} • Due: ${task.deadline}</p>
                        </div>
                        <span style="font-size: 0.75rem; padding: 0.25rem 0.5rem; background: ${task.priority === 'high' ? '#fee2e2' : task.priority === 'medium' ? '#fef3c7' : '#d1fae5'}; border-radius: 0.25rem;">
                            ${task.priority}
                        </span>
                    </div>
                </div>
            `).join('');
        }
        
        function renderMoodHistory(moods) {
            if (!moods || moods.length === 0) {
                return '<p style="color: #9ca3af;">No mood entries yet. Check in daily!</p>';
            }
            
            const moodIcons = { great: '😁', good: '🙂', okay: '😐', tired: '😴', stressed: '😰', motivated: '🚀' };
            return moods.reverse().map(m => `
                <div style="display: flex; justify-content: space-between; padding: 0.5rem 0; border-bottom: 1px solid #e5e7eb;">
                    <span>${moodIcons[m.mood] || '😐'} ${m.mood}</span>
                    <span style="color: #6b7280; font-size: 0.875rem;">${new Date(m.date).toLocaleDateString()}</span>
                </div>
            `).join('');
        }
        
        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }
        
        async function addTask() {
            const user = Storage.getCurrentUser();
            const title = document.getElementById('taskTitle').value;
            const subject = document.getElementById('taskSubject').value;
            const deadline = document.getElementById('taskDeadline').value;
            const priority = document.getElementById('taskPriority').value;
            
            if (!title || !subject || !deadline) {
                alert('Please fill all fields');
                return;
            }
            
            const newTask = {
                id: Date.now().toString(),
                title, subject, deadline, priority,
                completed: false,
                createdAt: new Date().toISOString()
            };
            
            user.tasks = user.tasks || [];
            user.tasks.push(newTask);
            Storage.updateUser(user.email, { tasks: user.tasks });
            Storage.setCurrentUser({ ...user, tasks: user.tasks });
            
            document.getElementById('addTaskForm').reset();
            showDashboard();
            document.querySelector('[data-screen="tasks"]').click();
        }
        
        window.toggleTask = (taskId) => {
            const user = Storage.getCurrentUser();
            const task = user.tasks.find(t => t.id === taskId);
            if (task) {
                task.completed = !task.completed;
                if (task.completed) {
                    user.studyStreak = (user.studyStreak || 0) + 1;
                }
                Storage.updateUser(user.email, { tasks: user.tasks, studyStreak: user.studyStreak });
                Storage.setCurrentUser({ ...user, tasks: user.tasks });
                showDashboard();
            }
        };
        
        window.logMood = (mood) => {
            const user = Storage.getCurrentUser();
            user.moods = user.moods || [];
            user.moods.push({
                mood: mood,
                date: new Date().toISOString()
            });
            Storage.updateUser(user.email, { moods: user.moods });
            Storage.setCurrentUser({ ...user, moods: user.moods });
            
            const feedbacks = {
                great: "🎉 That's wonderful! Your positive energy will boost your studies!",
                good: "😊 Glad to hear! Keep that momentum going!",
                okay: "🌱 That's okay. Take things one step at a time.",
                tired: "😴 Rest is important! Take a short break and recharge.",
                stressed: "🧘 Take a deep breath. You're doing your best!",
                motivated: "🚀 Excellent! Channel that energy into your goals!"
            };
            
            const feedbackDiv = document.getElementById('moodFeedback');
            if (feedbackDiv) {
                feedbackDiv.innerHTML = `<p style="color: var(--success);">${feedbacks[mood] || "Thanks for sharing!"}</p>`;
                setTimeout(() => {
                    feedbackDiv.innerHTML = '';
                }, 3000);
            }
            
            showDashboard();
            document.querySelector('[data-screen="wellness"]').click();
        };
        
        window.sendChatMessage = async () => {
            const input = document.getElementById('chatInput');
            const message = input.value.trim();
            if (!message) return;
            
            const chatMessages = document.getElementById('chatMessages');
            chatMessages.innerHTML += `
                <div class="message user">
                    <div class="message-bubble">${escapeHtml(message)}</div>
                </div>
            `;
            input.value = '';
            chatMessages.scrollTop = chatMessages.scrollHeight;
            
            // Simulate AI thinking
            setTimeout(() => {
                let response = '';
                const lowerMsg = message.toLowerCase();
                
                if (lowerMsg.includes('study') || lowerMsg.includes('learn')) {
                    response = "📚 Great! Here's my study tip: Use the Pomodoro Technique - 25 minutes of focused study, then 5 minutes break. This improves retention by up to 50%! Would you like me to help you plan your study schedule?";
                } else if (lowerMsg.includes('stress') || lowerMsg.includes('anxious')) {
                    response = "🧘 I understand you're feeling stressed. Try this quick breathing exercise: Inhale for 4 seconds, hold for 4, exhale for 4. Repeat 5 times. You've got this! 💪";
                } else if (lowerMsg.includes('task') || lowerMsg.includes('todo')) {
                    response = "✅ Tasks are easier when broken down! Try the 2-minute rule: if a task takes less than 2 minutes, do it immediately. For bigger tasks, break them into smaller steps. Need help organizing your tasks?";
                } else if (lowerMsg.includes('motivation') || lowerMsg.includes('procrastinat')) {
                    response = "🔥 Remember why you started! Your future self will thank you. Start with just 5 minutes - the hardest part is beginning. You're capable of amazing things! ✨";
                } else {
                    response = "💡 Thanks for sharing! Remember: consistency beats intensity. Small daily progress leads to extraordinary results. Is there anything specific about studying or productivity I can help with?";
                }
                
                chatMessages.innerHTML += `
                    <div class="message ai">
                        <div class="message-bubble">${response}</div>
                    </div>
                `;
                chatMessages.scrollTop = chatMessages.scrollHeight;
            }, 800);
        };
        
        window.startBreathing = () => {
            alert("🧘 4-7-8 Breathing Exercise 🧘\n\n1. Inhale quietly through nose for 4 seconds\n2. Hold breath for 7 seconds\n3. Exhale completely through mouth for 8 seconds\n\nRepeat 4 times for instant calm and focus!");
        };
        
        window.showAffirmation = () => {
            const affirmations = [
                "I am capable of achieving my goals",
                "Every day, I'm getting better and better",
                "I have the power to create positive change",
                "My mind is calm, focused, and ready to learn",
                "I embrace challenges as opportunities to grow",
                "I am proud of my progress, no matter how small"
            ];
            const random = affirmations[Math.floor(Math.random() * affirmations.length)];
            alert(`✨ Daily Affirmation ✨\n\n"${random}"`);
        };
        
        window.playFocusMusic = () => {
            alert("🎵 Focus Music Recommendation 🎵\n\nTry these for better concentration:\n• Lo-fi hip hop beats\n• Classical piano (Mozart, Beethoven)\n• Nature sounds (rain, forest)\n• Binaural beats (Alpha waves for focus)");
        };
        
        window.logout = () => {
            Storage.clearCurrentUser();
            showLogin();
        };
        
        // Make functions global
        window.showLogin = showLogin;
        window.showRegister = showRegister;
        window.showDashboard = showDashboard;
        window.addTask = addTask;
        window.toggleTask = toggleTask;
        window.logMood = logMood;
        window.sendChatMessage = sendChatMessage;
        window.startBreathing = startBreathing;
        window.showAffirmation = showAffirmation;
        window.playFocusMusic = playFocusMusic;
        window.logout = logout;
        
        // Initialize
        if (Storage.getCurrentUser()) {
            showDashboard();
        } else {
            showLogin();
        }
    </script>
</body>
</html>
