<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>FocusWell | Study Social - Cute Animal Study Community</title>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        /* DEFAULT THEME: Coral & Mint */
        :root {
            --coral: #FF6B6B;
            --mint: #4ECDC4;
            --sunny: #FFE66D;
            --lavender: #C8A2F8;
            --peach: #FFB8A0;
            --sky: #87CEEB;
            --cotton: #FFF9F0;
            --charcoal: #2D3436;
            --shadow: 0 8px 20px rgba(0,0,0,0.08);
            --shadow-lg: 0 15px 35px rgba(0,0,0,0.12);
            --radius-xl: 28px;
            --radius-lg: 20px;
            --bg-gradient-start: #FFF9F0;
            --bg-gradient-end: #FFEFE8;
            --card-bg: rgba(255, 255, 255, 0.92);
            --text-primary: #2D3436;
        }
        /* Theme 2: Lavender Dream */
        body.theme-lavender {
            --coral: #C8A2F8;
            --mint: #B8E4F0;
            --sunny: #FDE2A2;
            --lavender: #E0BBFF;
            --peach: #FBC8B5;
            --sky: #A0D2EB;
            --cotton: #FCF9FF;
            --charcoal: #3A2E4A;
            --bg-gradient-start: #F3EEFA;
            --bg-gradient-end: #E8DDFF;
            --card-bg: rgba(255, 250, 255, 0.94);
        }
        /* Theme 3: Forest Meadow */
        body.theme-forest {
            --coral: #98C9A8;
            --mint: #A7E0C0;
            --sunny: #F9E79F;
            --lavender: #C5C9E8;
            --peach: #FFCCAA;
            --sky: #A8E6CF;
            --cotton: #F5FDF0;
            --charcoal: #2D4A3E;
            --bg-gradient-start: #EAF7E6;
            --bg-gradient-end: #D4EED7;
            --card-bg: rgba(248, 255, 242, 0.94);
        }
        /* Theme 4: Sunset Glow */
        body.theme-sunset {
            --coral: #FF9F7C;
            --mint: #FFD6A5;
            --sunny: #FDFFB6;
            --lavender: #CAFFBF;
            --peach: #FFC6A7;
            --sky: #9BF6FF;
            --cotton: #FFF7F0;
            --charcoal: #5E3A2C;
            --bg-gradient-start: #FFF0E6;
            --bg-gradient-end: #FFE0D0;
            --card-bg: rgba(255, 248, 240, 0.94);
        }
        body {
            font-family: 'Quicksand', sans-serif;
            background: linear-gradient(145deg, var(--bg-gradient-start) 0%, var(--bg-gradient-end) 100%);
            min-height: 100vh;
            color: var(--text-primary);
            overflow-x: hidden;
            transition: background 0.3s ease, color 0.2s ease;
        }
        /* Cute animations */
        @keyframes bounce {
            0%,100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }
        @keyframes wiggle {
            0%,100% { transform: rotate(0deg); }
            25% { transform: rotate(3deg); }
            75% { transform: rotate(-3deg); }
        }
        @keyframes float {
            0%,100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-12px) rotate(2deg); }
        }
        @keyframes pulse-glow {
            0% { opacity: 0.7; transform: scale(1);}
            100% { opacity: 1; transform: scale(1.05);}
        }
        .floating-emoji {
            position: fixed;
            pointer-events: none;
            font-size: 28px;
            animation: float 3s ease-in-out infinite;
            z-index: 999;
        }
        .glass-card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow);
            transition: all 0.3s cubic-bezier(0.4,0,0.2,1);
            border: 2px solid rgba(255,255,255,0.6);
        }
        .glass-card:hover {
            transform: translateY(-5px);
            box-shadow: var(--shadow-lg);
        }
        .stories-container {
            background: var(--card-bg);
            border-radius: 32px;
            padding: 16px 20px;
            margin-bottom: 24px;
            overflow-x: auto;
            display: flex;
            gap: 20px;
            white-space: nowrap;
            scrollbar-width: thin;
        }
        .story-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .story-item:hover { transform: scale(1.05); }
        .story-ring {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--coral), var(--mint));
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .story-avatar {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
        }
        .post-card {
            background: var(--card-bg);
            border-radius: 28px;
            padding: 20px;
            margin-bottom: 20px;
            transition: all 0.2s;
            border: 1px solid rgba(0,0,0,0.05);
        }
        .post-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 14px;
        }
        .post-avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--lavender), var(--peach));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
        }
        .post-image {
            width: 100%;
            border-radius: 24px;
            margin: 12px 0;
            max-height: 400px;
            object-fit: cover;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .action-buttons {
            display: flex;
            gap: 24px;
            margin: 12px 0;
        }
        .action-btn {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .nav-bar {
            background: var(--card-bg);
            border-radius: 60px;
            padding: 10px 28px;
            margin: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: var(--shadow);
            flex-wrap: wrap;
            gap: 12px;
        }
        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 28px;
            font-weight: 800;
        }
        .nav-link {
            cursor: pointer;
            padding: 8px 20px;
            border-radius: 40px;
            transition: all 0.2s;
            font-weight: 700;
            background: transparent;
        }
        .nav-link:hover, .nav-link.active {
            background: linear-gradient(135deg, var(--coral), var(--peach));
            color: white;
            transform: scale(1.05);
        }
        .btn-primary {
            background: linear-gradient(135deg, var(--coral), var(--peach));
            border: none;
            padding: 12px 28px;
            border-radius: 60px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            color: white;
        }
        .btn-primary:hover { transform: scale(1.02); box-shadow: 0 6px 20px rgba(255,107,107,0.4); }
        .study-timer {
            font-size: 56px;
            font-weight: 800;
            font-family: monospace;
            background: linear-gradient(135deg, var(--coral), var(--mint));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .grid-2, .grid-3 { display: grid; gap: 24px; }
        .grid-2 { grid-template-columns: repeat(2,1fr); }
        .grid-3 { grid-template-columns: repeat(3,1fr); }
        @media (max-width: 900px) { .grid-3 { grid-template-columns: repeat(2,1fr); } }
        @media (max-width: 600px) { .grid-2, .grid-3 { grid-template-columns: 1fr; } }
        .chatbot-container { position: fixed; bottom: 24px; right: 24px; z-index: 1000; }
        .chatbot-toggle {
            width: 68px; height: 68px;
            background: linear-gradient(135deg, var(--coral), var(--lavender));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            animation: bounce 2s infinite;
            box-shadow: var(--shadow-lg);
        }
        .welcome-banner {
            background: linear-gradient(135deg, var(--peach), var(--coral), var(--lavender));
            border-radius: 32px;
            padding: 32px;
            color: white;
            position: relative;
            overflow: hidden;
        }
        .stress-meter-cute {
            background: rgba(0,0,0,0.2);
            border-radius: 20px;
            padding: 4px;
            margin-top: 12px;
        }
        .stress-fill-cute { height: 12px; border-radius: 16px; background: var(--sunny); transition: width 0.5s cubic-bezier(0.2, 0.9, 0.4, 1.1); }
        .animate-in { animation: slideUp 0.5s ease-out; }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .study-room-card {
            background: linear-gradient(145deg, var(--peach), var(--cotton));
            border-radius: 32px;
            padding: 24px;
            text-align: center;
            transition: all 0.3s;
            cursor: pointer;
        }
        .study-room-card:hover { transform: translateY(-8px); }
        .theme-selector {
            display: flex;
            gap: 10px;
            background: rgba(0,0,0,0.05);
            padding: 6px 16px;
            border-radius: 60px;
            align-items: center;
        }
        .theme-btn {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid white;
            transition: transform 0.2s;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        }
        .theme-btn:hover { transform: scale(1.15); }
        .theme-default { background: linear-gradient(135deg, #FF6B6B, #4ECDC4); }
        .theme-lavender { background: linear-gradient(135deg, #C8A2F8, #B8E4F0); }
        .theme-forest { background: linear-gradient(135deg, #98C9A8, #A7E0C0); }
        .theme-sunset { background: linear-gradient(135deg, #FF9F7C, #FFD6A5); }
        .stress-insight {
            font-size: 13px;
            background: rgba(255,255,240,0.8);
            border-radius: 28px;
            padding: 10px 16px;
            margin-top: 12px;
            color: var(--charcoal);
        }
        .pulse-warning {
            animation: pulse-glow 0.8s infinite alternate;
            background: rgba(255,100,100,0.3);
            border-radius: 24px;
        }
    </style>
</head>
<body>
    <div id="app"></div>
    <div id="floatingEmojis"></div>
    <script>
        // ============ ENHANCED STORAGE ============
        const Storage = {
            getUsers: () => JSON.parse(localStorage.getItem('focuswell_cute_users') || '[]'),
            saveUser: (u) => { const users = Storage.getUsers(); users.push(u); localStorage.setItem('focuswell_cute_users', JSON.stringify(users)); },
            getUser: (email) => Storage.getUsers().find(u => u.email === email),
            updateUser: (email, data) => { const users = Storage.getUsers(); const idx = users.findIndex(u => u.email === email); if(idx !== -1) { users[idx] = { ...users[idx], ...data }; localStorage.setItem('focuswell_cute_users', JSON.stringify(users)); Storage.setCurrent(users[idx]); } },
            getCurrent: () => JSON.parse(localStorage.getItem('focuswell_cute_current')),
            setCurrent: (u) => localStorage.setItem('focuswell_cute_current', JSON.stringify(u)),
            clearCurrent: () => localStorage.removeItem('focuswell_cute_current'),
            getPosts: () => JSON.parse(localStorage.getItem('focuswell_posts') || '[]'),
            savePost: (p) => { const posts = Storage.getPosts(); posts.unshift(p); localStorage.setItem('focuswell_posts', JSON.stringify(posts.slice(0, 50))); },
            likePost: (postId) => { const posts = Storage.getPosts(); const post = posts.find(p => p.id === postId); if(post) { post.likes = (post.likes || 0) + 1; localStorage.setItem('focuswell_posts', JSON.stringify(posts)); } },
            getTasks: () => JSON.parse(localStorage.getItem('focuswell_cute_tasks') || '[]'),
            saveTask: (t) => { const tasks = Storage.getTasks(); tasks.push(t); localStorage.setItem('focuswell_cute_tasks', JSON.stringify(tasks)); },
            updateTask: (id, updates) => { const tasks = Storage.getTasks(); const idx = tasks.findIndex(t => t.id === id); if(idx !== -1) { tasks[idx] = { ...tasks[idx], ...updates }; localStorage.setItem('focuswell_cute_tasks', JSON.stringify(tasks)); } },
            deleteTask: (id) => { let tasks = Storage.getTasks(); tasks = tasks.filter(t => t.id !== id); localStorage.setItem('focuswell_cute_tasks', JSON.stringify(tasks)); },
            getStudySessions: () => JSON.parse(localStorage.getItem('focuswell_cute_sessions') || '[]'),
            saveStudySession: (s) => { const sessions = Storage.getStudySessions(); sessions.push(s); localStorage.setItem('focuswell_cute_sessions', JSON.stringify(sessions.slice(-50))); },
            getWellnessLogs: () => JSON.parse(localStorage.getItem('focuswell_wellness_logs') || '[]'),
            saveWellnessLog: (log) => { const logs = Storage.getWellnessLogs(); logs.push(log); localStorage.setItem('focuswell_wellness_logs', JSON.stringify(logs.slice(-30))); }
        };
        
        // Sample users & posts
        if(Storage.getUsers().length === 0){
            Storage.saveUser({ name: 'Panda Sophie', email: 'panda@focuswell.com', password: 'panda123', avatar: '🐼', studyStreak: 5, points: 1250, level: 3, xp: 45, sleepQuality: 8, anxietyLevel: 2, totalFocusMins: 380, followers: 42, following: 28 });
            Storage.saveUser({ name: 'Koala Tim', email: 'koala@focuswell.com', password: 'koala123', avatar: '🐨', studyStreak: 12, points: 890, level: 2, xp: 78, sleepQuality: 7, anxietyLevel: 4, totalFocusMins: 210, followers: 35, following: 42 });
            Storage.saveUser({ name: 'Study Bunny', email: 'student@focuswell.com', password: '123', avatar: '🐰', studyStreak: 0, points: 0, level: 1, xp: 0, sleepQuality: 7, anxietyLevel: 3, totalFocusMins: 0, followers: 0, following: 0 });
            
            const samplePosts = [
                { id: 'p1', userId: 'panda@focuswell.com', userName: 'Panda Sophie', userAvatar: '🐼', content: 'Just finished 3 Pomodoros! 🍅✨ Feeling so productive! #StudyGram', image: 'https://images.unsplash.com/photo-1513258496099-48168024aec0?w=500', likes: 24, comments: 5, time: '2h ago' },
                { id: 'p2', userId: 'koala@focuswell.com', userName: 'Koala Tim', userAvatar: '🐨', content: 'My study setup with cute plant friends 🌿📚 Who else loves cozy study corners?', image: 'https://images.unsplash.com/photo-1516979187457-637abb4f9353?w=500', likes: 56, comments: 12, time: '5h ago' },
                { id: 'p3', userId: 'student@focuswell.com', userName: 'Study Bunny', userAvatar: '🐰', content: 'First day on FocusWell! Let\'s be study buddies! 🎓💕', image: 'https://images.unsplash.com/photo-1434030216411-0b793f4f4173?w=500', likes: 8, comments: 2, time: '1d ago' }
            ];
            localStorage.setItem('focuswell_posts', JSON.stringify(samplePosts));
        }
        
        let currentUser = null, currentScreen = 'social';
        let pomodoroInterval = null, pomodoroSeconds = 25*60, isPomodoroRunning = false;
        
        function addPointsAndXP(points, xpGain) {
            if(!currentUser) return;
            currentUser.points += points;
            currentUser.xp += xpGain;
            let leveled = false;
            while(currentUser.xp >= 100) { currentUser.level++; currentUser.xp -= 100; leveled = true; }
            Storage.updateUser(currentUser.email, { points: currentUser.points, xp: currentUser.xp, level: currentUser.level });
            if(leveled) showToast(`🎉 LEVEL UP! You're now Level ${currentUser.level}! 🎉`, 'success');
        }
        
        function showToast(msg, type='info') {
            const toast = document.createElement('div');
            toast.style.position = 'fixed';
            toast.style.bottom = '100px';
            toast.style.left = '50%';
            toast.style.transform = 'translateX(-50%)';
            toast.style.background = 'white';
            toast.style.padding = '12px 24px';
            toast.style.borderRadius = '60px';
            toast.style.boxShadow = '0 10px 25px rgba(0,0,0,0.1)';
            toast.style.zIndex = '9999';
            toast.style.fontWeight = 'bold';
            toast.style.borderLeft = `4px solid ${type === 'success' ? '#4ECDC4' : '#FF6B6B'}`;
            toast.innerHTML = msg;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 2500);
        }
        
        // ENHANCED STRESS DETECTION: combines sleep, anxiety, recent study load, and consistency
        function analyzeStressAdvanced(sleep, anxiety, studySessions = null) {
            if(!studySessions) studySessions = Storage.getStudySessions();
            const recentSessions = studySessions.filter(s => new Date(s.date) > new Date(Date.now() - 7*24*60*60*1000));
            const totalStudyMins = recentSessions.reduce((sum,s) => sum + (s.minutes||0), 0);
            let studyLoadScore = Math.min(40, Math.max(0, (totalStudyMins / 60) * 2)); // too much study can increase stress
            let consistencyBonus = 0;
            if(recentSessions.length > 3) consistencyBonus = -5; // consistent studying reduces stress
            
            let rawScore = ((10 - sleep) * 8) + (anxiety * 7) + studyLoadScore - consistencyBonus;
            rawScore = Math.min(100, Math.max(0, rawScore));
            
            let level = 'Low 😊', emoji = '🐼✨';
            let suggestions = ['🌸 Keep up the great vibes!', '📖 Try a 5-min journal break', '☕ Enjoy a small treat'];
            let color = '#4ECDC4';
            if(rawScore > 70) { level = 'High 😰'; emoji = '😿⚠️'; color = '#FF6B6B'; suggestions = ['🧘 10-minute guided meditation', '💤 Take a power nap (20 min)', '🐣 Talk to a study buddy', '🌿 Go for a short walk']; }
            else if(rawScore > 40) { level = 'Medium 😌'; emoji = '🐨🌱'; color = '#FFE66D'; suggestions = ['🎵 Lo-fi beats & deep breaths', '🍵 Herbal tea & stretch', '✨ Cute desk tidy-up']; }
            else { suggestions = ['🎉 You are thriving! Celebrate with a sticker', '⭐ Reward yourself with a short break', '📚 Keep your flow state']; }
            
            // Additional personalized warning if anxiety high or sleep low
            let extraTip = "";
            if(anxiety >= 7) extraTip = "💖 High anxiety detected: try the 4-7-8 breathing in Wellness tab!";
            if(sleep <= 4) extraTip = "🛌 Low sleep quality: aim for 7-8 hours rest to boost focus!";
            
            return { score: Math.floor(rawScore), level, color, emoji, suggestions, extraTip };
        }
        
        function createFloatingEmoji() {
            const emojis = ['🐼', '🐨', '🐰', '🦊', '🐱', '🌸', '✨', '📚', '🍎', '⭐'];
            const emoji = emojis[Math.floor(Math.random() * emojis.length)];
            const div = document.createElement('div');
            div.className = 'floating-emoji';
            div.textContent = emoji;
            div.style.left = Math.random() * window.innerWidth + 'px';
            div.style.top = Math.random() * window.innerHeight + 'px';
            div.style.animationDuration = (3 + Math.random() * 3) + 's';
            document.getElementById('floatingEmojis').appendChild(div);
            setTimeout(() => div.remove(), 3000);
        }
        setInterval(createFloatingEmoji, 10000);
        
        // THEME SWITCHER
        function setTheme(themeName) {
            document.body.className = '';
            if(themeName !== 'default') document.body.classList.add(`theme-${themeName}`);
            localStorage.setItem('focuswell_theme', themeName);
        }
        function initTheme() { const saved = localStorage.getItem('focuswell_theme'); if(saved && saved !== 'default') setTheme(saved); else setTheme('default'); }
        
        // RENDER LOGIN
        function renderLogin() {
            document.getElementById('app').innerHTML = `
                <div style="min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px;">
                    <div class="glass-card" style="max-width:450px; width:100%; padding:48px; text-align:center;">
                        <div style="font-size:80px; animation: bounce 2s infinite;">🐼✨</div>
                        <h1 style="font-size:42px;">FocusWell</h1>
                        <p style="margin:8px 0 20px;">Cute Animal Study Social 📚💕</p>
                        <form id="loginForm">
                            <input type="email" id="email" placeholder="Email" required style="width:100%; padding:14px; margin-bottom:14px; border-radius:60px; border:2px solid #FFE0D0;">
                            <input type="password" id="password" placeholder="Password" required style="width:100%; padding:14px; margin-bottom:24px; border-radius:60px; border:2px solid #FFE0D0;">
                            <button type="submit" class="btn-primary" style="width:100%;">Sign in 🐣</button>
                        </form>
                        <p style="margin-top:20px;">New? <a href="#" onclick="renderRegister(); return false;" style="color:var(--coral);">Create cute account 🎀</a></p>
                        <p style="margin-top:12px; font-size:12px;">Demo: student@focuswell.com / 123</p>
                    </div>
                </div>
            `;
            document.getElementById('loginForm').addEventListener('submit', (e) => {
                e.preventDefault();
                const email = document.getElementById('email').value;
                const pwd = document.getElementById('password').value;
                const user = Storage.getUser(email);
                if(user && user.password === pwd) { currentUser = user; Storage.setCurrent(user); renderSocialFeed(); }
                else alert('Invalid credentials 🥺');
            });
        }
        
        function renderRegister() {
            document.getElementById('app').innerHTML = `
                <div style="min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px;">
                    <div class="glass-card" style="max-width:450px; padding:40px;"><h2>Join Study Family 🐣</h2>
                    <form id="registerForm"><input type="text" id="name" placeholder="Name" required><input type="email" id="email" placeholder="Email" required><input type="password" id="password" placeholder="Password" required><button type="submit" class="btn-primary">Create Account 🎀</button></form></div></div>`;
            document.getElementById('registerForm').addEventListener('submit', (e) => {
                e.preventDefault();
                const name = document.getElementById('name').value, email = document.getElementById('email').value, password = document.getElementById('password').value;
                if(Storage.getUser(email)) { alert('User exists!'); return; }
                const newUser = { name, email, password, avatar: ['🐼','🐨','🐰','🦊'][Math.floor(Math.random()*4)], studyStreak:0, points:0, level:1, xp:0, sleepQuality:7, anxietyLevel:3, totalFocusMins:0, followers:0, following:0 };
                Storage.saveUser(newUser); currentUser = newUser; Storage.setCurrent(newUser); renderSocialFeed();
            });
        }
        
        // MAIN SOCIAL FEED WITH THEME SELECTOR AND IMPROVED STRESS
        function renderSocialFeed() {
            currentScreen = 'social';
            const posts = Storage.getPosts();
            const sessions = Storage.getStudySessions();
            const stress = analyzeStressAdvanced(currentUser.sleepQuality||7, currentUser.anxietyLevel||3, sessions);
            const todayMins = sessions.filter(s => new Date(s.date).toDateString() === new Date().toDateString()).reduce((sum,s)=>sum+(s.minutes||0),0);
            document.getElementById('app').innerHTML = `
                <div class="nav-bar">
                    <div class="logo"><span>🐼</span><span>FocusWell</span><span style="font-size:14px;">Study Social</span></div>
                    <div style="display:flex; gap:6px; flex-wrap:wrap; align-items:center;">
                        <div class="theme-selector">
                            <div class="theme-btn theme-default" onclick="setTheme('default')"></div>
                            <div class="theme-btn theme-lavender" onclick="setTheme('lavender')"></div>
                            <div class="theme-btn theme-forest" onclick="setTheme('forest')"></div>
                            <div class="theme-btn theme-sunset" onclick="setTheme('sunset')"></div>
                        </div>
                        <div class="nav-link ${currentScreen==='social'?'active':''}" onclick="renderSocialFeed()">📱 Feed</div>
                        <div class="nav-link" onclick="renderTasks()">✅ Tasks</div>
                        <div class="nav-link" onclick="renderPomodoro()">🍅 Timer</div>
                        <div class="nav-link" onclick="renderStudyRoom()">🎮 Study</div>
                        <div class="nav-link" onclick="renderWellness()">💖 Wellness</div>

                    </div>
                </div>
                <div class="main-container" style="max-width:800px; margin:0 auto; padding:20px;">
                    <div class="welcome-banner animate-in" style="position:relative;">
                        <div style="display:flex; align-items:center; gap:15px;"><span style="font-size:64px;">${currentUser.avatar || '🐰'}</span><div><h2>Hello, ${currentUser.name}! 🎀</h2><p>Today's focus: ${Math.floor(todayMins/60)}h ${todayMins%60}m • 🔥 ${currentUser.studyStreak} day streak</p></div></div>
                        <div class="stress-meter-cute"><div class="stress-fill-cute" style="width: ${stress.score}%; background:${stress.color};"></div></div>
                        <div class="stress-insight"><strong>${stress.emoji} Stress Score: ${stress.score}% (${stress.level})</strong><br>💡 ${stress.suggestions[0]} ${stress.extraTip ? `<span style="display:block; margin-top:4px;">${stress.extraTip}</span>` : ''}</div>
                    </div>
                    <div class="stories-container"><div class="story-item" onclick="createNewPost()"><div class="story-ring"><div class="story-avatar">➕</div></div><span>New Post</span></div>
                    ${Storage.getUsers().slice(0,8).map(u => `<div class="story-item" onclick="showToast('${u.name} is studying! 📚', 'info')"><div class="story-ring"><div class="story-avatar">${u.avatar || '🐣'}</div></div><span>${u.name.split(' ')[0]}</span></div>`).join('')}</div>
                    
                    <div class="glass-card" style="padding:20px; margin-bottom:24px;"><div style="display:flex; gap:12px;"><div style="font-size:48px;">${currentUser.avatar || '🐰'}</div><input type="text" id="postContent" placeholder="What are you studying today? Share your progress! 📝" style="flex:1; border-radius:60px; border:2px solid #FFE0D0; padding:12px;"></div><button class="btn-primary" style="margin-top:12px;" onclick="createNewPost()">Post 🎀</button></div>
                    
                    <h3 style="margin:20px 0 12px;">✨ Study Feed ✨</h3>
                    ${posts.map(post => `
                        <div class="post-card animate-in">
                            <div class="post-header"><div class="post-avatar">${post.userAvatar || '🐣'}</div><div><strong>${post.userName}</strong><p style="font-size:12px;">${post.time || 'just now'}</p></div></div>
                            <p>${post.content}</p>
                            ${post.image ? `<img src="${post.image}" class="post-image" onclick="window.open('${post.image}','_blank')">` : ''}
                            <div class="action-buttons"><button class="action-btn" onclick="likePost('${post.id}')">❤️ <span class="like-count">${post.likes || 0}</span></button><button class="action-btn" onclick="showToast('Comment feature coming soon! 💬', 'info')">💬 <span class="comment-count">${post.comments || 0}</span></button><button class="action-btn" onclick="speakText('${post.content.replace(/'/g, "\\'")}')">🔊</button></div>
                        </div>
                    `).join('')}
                </div>
                <div class="chatbot-container"><div class="chatbot-toggle" onclick="toggleChatbot()"><i class="fas fa-robot" style="font-size:32px;"></i></div><div class="chatbot-window" id="chatbotWindow" style="display:none; background:var(--card-bg); width:350px; height:500px; border-radius:32px; position:absolute; bottom:80px; right:0; flex-direction:column; box-shadow:var(--shadow-lg);"><div style="background:linear-gradient(135deg,var(--coral),var(--lavender)); padding:16px; border-radius:32px 32px 0 0; color:white;"><span>🤖 Study Buddy Bot</span><i class="fas fa-times" style="float:right; cursor:pointer;" onclick="toggleChatbot()"></i></div><div id="chatMessages" style="flex:1; overflow-y:auto; padding:16px;"><div class="message bot">🐣 Hi! Need study motivation or stress relief? Ask me anything!</div></div><div style="padding:12px; display:flex;"><input id="chatInput" placeholder="Type..." style="flex:1; border-radius:40px;"><button onclick="sendChatMessage()" class="btn-primary">Send</button></div></div></div>
            `;
        }
        
        function createNewPost() {
            const content = document.getElementById('postContent')?.value;
            if(content && content.trim()) {
                Storage.savePost({ id: Date.now().toString(), userId: currentUser.email, userName: currentUser.name, userAvatar: currentUser.avatar || '🐣', content: content, image: null, likes: 0, comments: 0, time: 'just now' });
                document.getElementById('postContent').value = '';
                showToast('Post shared! 🎉', 'success');
                renderSocialFeed();
            } else { showToast('Write something first! 📝', 'info'); }
        }
        
        function likePost(postId) { Storage.likePost(postId); renderSocialFeed(); }
        function renderTasks() { /* keep same logic but simplified for brevity */ currentScreen='tasks'; const tasks=Storage.getTasks(); document.getElementById('app').innerHTML = getNavHTML('tasks') + `<div class="main-container"><div class="glass-card" style="padding:28px;"><h3>✅ Cute Task List 🎀</h3><form id="taskForm"><input placeholder="New task..." id="taskTitle"><button type="submit" class="btn-primary">Add 🐣</button></form><div>${tasks.map(t => `<div style="display:flex; justify-content:space-between; padding:12px;"><span><input type="checkbox" ${t.completed?'checked':''} onchange="toggleTask('${t.id}')"> ${t.title}</span><button onclick="deleteTask('${t.id}')">🗑️</button></div>`).join('')}</div></div></div>`; document.getElementById('taskForm')?.addEventListener('submit',(e)=>{e.preventDefault(); const title=document.getElementById('taskTitle').value; if(title){Storage.saveTask({id:Date.now().toString(),title,completed:false}); renderTasks();}});}
        function toggleTask(id){ const tasks=Storage.getTasks(); const task=tasks.find(t=>t.id===id); if(task){ task.completed=!task.completed; localStorage.setItem('focuswell_cute_tasks',JSON.stringify(tasks)); if(task.completed) addPointsAndXP(10,10); renderTasks(); } }
        function deleteTask(id){ Storage.deleteTask(id); renderTasks(); }
        function renderPomodoro() { currentScreen='pomodoro'; document.getElementById('app').innerHTML = getNavHTML('pomodoro') + `<div class="main-container"><div class="glass-card" style="padding:48px; text-align:center;"><div class="study-timer" id="pomodoroDisplay">25:00</div><div style="display:flex; gap:12px; justify-content:center;"><button class="btn-primary" onclick="startPomodoro()">Start</button><button class="btn-secondary" onclick="pausePomodoro()">Pause</button><button class="btn-primary" onclick="resetPomodoro()">Reset</button></div><p>🎵 Study with lo-fi!</p><button class="btn-primary" onclick="window.open('https://www.youtube.com/watch?v=5qap5aO4i9A','_blank')">Play 🎧</button></div></div>`; resetPomodoro(); }
        function startPomodoro() { if(!isPomodoroRunning){ isPomodoroRunning=true; pomodoroInterval=setInterval(()=>{ if(pomodoroSeconds>0){ pomodoroSeconds--; updatePomodoroDisplay(); } else { pausePomodoro(); showToast('🍅 Study session complete! +15 XP','success'); Storage.saveStudySession({ date: new Date().toISOString(), minutes: 25 }); addPointsAndXP(25,15); resetPomodoro(); } },1000); } }
        function pausePomodoro() { if(pomodoroInterval) clearInterval(pomodoroInterval); isPomodoroRunning=false; }
        function resetPomodoro() { pausePomodoro(); pomodoroSeconds=25*60; updatePomodoroDisplay(); }
        function updatePomodoroDisplay() { const el=document.getElementById('pomodoroDisplay'); if(el){ const m=Math.floor(pomodoroSeconds/60), s=pomodoroSeconds%60; el.textContent=`${m}:${s.toString().padStart(2,'0')}`; } }
        function renderStudyRoom() { currentScreen='studyroom'; document.getElementById('app').innerHTML = getNavHTML('studyroom') + `<div class="main-container"><div class="grid-3"><div class="study-room-card" onclick="window.open('https://www.youtube.com/watch?v=jfKfPfyJRdk','_blank')"><div style="font-size:64px;">🎵</div><h3>Lo-Fi Beats</h3><button class="btn-primary">Play</button></div><div class="study-room-card" onclick="window.open('https://www.youtube.com/watch?v=UxJK5VhZjYw','_blank')"><div style="font-size:64px;">🌿</div><h3>Study With Me</h3><button class="btn-primary">Join</button></div><div class="study-room-card" onclick="joinStudyGroup()"><div style="font-size:64px;">🐣</div><h3>Global Group</h3><button class="btn-primary">Connect</button></div></div></div>`; }
        function joinStudyGroup() { showToast("🐼 Joined Cute Study Squad! 342 members online!", "success"); }
        function renderWellness() { currentScreen='wellness'; const stress = analyzeStressAdvanced(currentUser.sleepQuality||7, currentUser.anxietyLevel||3); document.getElementById('app').innerHTML = getNavHTML('wellness') + `<div class="main-container"><div class="grid-2"><div class="glass-card" style="padding:28px;"><h3>💖 Wellness Check</h3><label>😴 Sleep (0-10)</label><input type="range" id="sleep" min="0" max="10" value="${currentUser.sleepQuality||7}"><label>😟 Anxiety (0-10)</label><input type="range" id="anxiety" min="0" max="10" value="${currentUser.anxietyLevel||3}"><button class="btn-primary" onclick="updateWellness()">Update 🌸</button><div class="stress-insight" style="margin-top:12px;"><strong>✨ Current Stress Score: ${stress.score}% (${stress.level})</strong><br>${stress.suggestions[0]}<br>${stress.extraTip || '🐣 Keep going!'}</div></div><div class="glass-card" style="padding:28px;"><h3>🧘 Relax Corner</h3><button class="btn-primary" onclick="startBreathing()">🌬️ Breathing Exercise</button><button class="btn-primary" style="margin-top:12px;" onclick="showAffirmation()">✨ Cute Affirmation</button></div></div></div>`; }
        function updateWellness() { currentUser.sleepQuality = parseInt(document.getElementById('sleep').value); currentUser.anxietyLevel = parseInt(document.getElementById('anxiety').value); Storage.updateUser(currentUser.email, { sleepQuality: currentUser.sleepQuality, anxietyLevel: currentUser.anxietyLevel }); Storage.saveWellnessLog({ date: new Date().toISOString(), sleep: currentUser.sleepQuality, anxiety: currentUser.anxietyLevel }); showToast("Wellness updated! 🌸", "success"); renderWellness(); }
        function startBreathing() { showToast("🧘 4-7-8 Breathing: Inhale 4s → Hold 7s → Exhale 8s", "info"); speakText("Breathe in, hold, breathe out"); }
        function showAffirmation() { const affs = ["🐼 I am focused and capable", "🐨 Every study session grows my brain", "🐰 I deserve success and calm"]; alert(`✨ ${affs[Math.floor(Math.random()*affs.length)]} ✨`); }
        function renderProfile() { currentScreen='profile'; document.getElementById('app').innerHTML = getNavHTML('profile') + `<div class="main-container"><div class="glass-card" style="padding:32px; text-align:center;"><div style="font-size:80px;">${currentUser.avatar}</div><h2>${currentUser.name}</h2><div class="cute-badge">⭐ Level ${currentUser.level} • ${currentUser.points} pts</div><button class="btn-primary" onclick="recordStudySession()">Log Study Minutes 📝</button></div></div>`; }
        function recordStudySession() { const mins = prompt("Minutes studied?", "25"); if(mins && !isNaN(mins)) { Storage.saveStudySession({ date: new Date().toISOString(), minutes: parseInt(mins) }); currentUser.totalFocusMins += parseInt(mins); currentUser.studyStreak++; addPointsAndXP(parseInt(mins)*1.5, parseInt(mins)); showToast(`🐣 +${parseInt(mins)*1.5} points!`, "success"); renderProfile(); } }
        function getNavHTML(active) { return `<div class="nav-bar"><div class="logo"><span>🐼</span><span>FocusWell</span></div><div style="display:flex; gap:6px; flex-wrap:wrap;"><div class="nav-link ${active==='social'?'active':''}" onclick="renderSocialFeed()">📱 Feed</div><div class="nav-link ${active==='tasks'?'active':''}" onclick="renderTasks()">✅ Tasks</div><div class="nav-link ${active==='pomodoro'?'active':''}" onclick="renderPomodoro()">🍅 Timer</div><div class="nav-link ${active==='studyroom'?'active':''}" onclick="renderStudyRoom()">🎮 Study</div><div class="nav-link ${active==='wellness'?'active':''}" onclick="renderWellness()">💖 Wellness</div><div class="nav-link ${active==='profile'?'active':''}" onclick="renderProfile()">👤 Profile</div><div class="nav-link" onclick="logout()">🚪 Exit</div></div></div>`; }
        async function sendChatMessage() { const input=document.getElementById('chatInput'); const msg=input.value.trim(); if(!msg) return; const chatDiv=document.getElementById('chatMessages'); chatDiv.innerHTML+=`<div class="message user">🐣 ${msg}</div>`; input.value=''; const reply=await getAIResponse(msg); chatDiv.innerHTML+=`<div class="message bot">🤖 ${reply}</div>`; chatDiv.scrollTop=chatDiv.scrollHeight; }
        async function getAIResponse(msg) { const m=msg.toLowerCase(); if(m.includes('stress')) return "Take a deep breath! 🐼 Use our enhanced stress tracker & try 4-7-8 breathing. You've got this!"; if(m.includes('study tip')) return "📚 Use active recall! And track your wellness daily for better focus! 🎀"; return "🐨 Keep studying! Check your stress meter in Wellness tab for personalized tips!"; }
        function speakText(text) { const utterance=new SpeechSynthesisUtterance(text); utterance.rate=0.9; window.speechSynthesis.cancel(); window.speechSynthesis.speak(utterance); }
        function toggleChatbot() { const win=document.getElementById('chatbotWindow'); if(win) win.style.display = win.style.display==='flex'?'none':'flex'; }
        function logout() { Storage.clearCurrent(); renderLogin(); }
        
        window.renderSocialFeed=renderSocialFeed; window.renderTasks=renderTasks; window.renderPomodoro=renderPomodoro; window.renderStudyRoom=renderStudyRoom; window.renderWellness=renderWellness; window.renderProfile=renderProfile;
        window.toggleTask=toggleTask; window.deleteTask=deleteTask; window.startPomodoro=startPomodoro; window.pausePomodoro=pausePomodoro; window.resetPomodoro=resetPomodoro;
        window.createNewPost=createNewPost; window.likePost=likePost; window.updateWellness=updateWellness; window.startBreathing=startBreathing; window.showAffirmation=showAffirmation;
        window.recordStudySession=recordStudySession; window.sendChatMessage=sendChatMessage; window.toggleChatbot=toggleChatbot; window.logout=logout; window.speakText=speakText; window.joinStudyGroup=joinStudyGroup;
        window.setTheme=setTheme;
        
        initTheme();
        if(Storage.getCurrent()) { currentUser = Storage.getCurrent(); renderSocialFeed(); } else renderLogin();
    </script>
</body>
</html>
